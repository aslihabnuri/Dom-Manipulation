                label: 'Urungkan', run: function () { Store.undo(); }
              });
            }
          }, [U.icon('plus', 'ico--sm'), U.el('span', { text: 'Tambah' })])
        ])
      ]));
    });

    wrap.appendChild(ul);
    return wrap;
  }

  /* ---------- aksi ---------- */

  function removeStop(day, stop, place) {
    Store.removeStop(day.id, stop.id);
    Shell.toast(place.name + ' dihapus.', { label: 'Urungkan', run: function () { Store.undo(); } });
  }

  function removeDay(day, di) {
    if (!day.stops.length) {
      Store.removeDay(day.id);
      Shell.toast('Hari ' + (di + 1) + ' dihapus.', { label: 'Urungkan', run: function () { Store.undo(); } });
      return;
    }
    Shell.openModal('Hapus hari ' + (di + 1) + '?', U.el('div', { class: 'detail' }, [
      U.el('p', { class: 'detail__prose', text: day.stops.length + ' tempat di hari ini akan ikut terhapus, dan tanggal hari-hari berikutnya akan maju.' }),
      U.el('div', { class: 'empty__actions' }, [
        U.el('button', {
          class: 'btn btn--danger', type: 'button', text: 'Hapus hari ini',
          onclick: function () {
            Shell.closeModal();
            Store.removeDay(day.id);
            Shell.toast('Hari ' + (di + 1) + ' dihapus.', { label: 'Urungkan', run: function () { Store.undo(); } });
          }
        }),
        U.el('button', { class: 'btn', type: 'button', text: 'Batal', onclick: Shell.closeModal })
      ])
    ]));
  }

  function optimise(day) {
    var trip = Store.get();
    var before = Schedule.computeDay(day, { trip: trip, dest: Store.dest() });
    var next = Planner.optimiseDay(day, trip);
    if (!next) { Shell.toast('Perlu minimal tiga tempat untuk dirapikan.'); return; }

    Store.update('rapikan urutan', function () { day.stops = next; });

    var after = Schedule.computeDay(day, { trip: trip, dest: Store.dest() });
    var saved = before.travelKm - after.travelKm;
    var savedMin = before.travelMin - after.travelMin;

    if (saved > 0.4 || savedMin > 4) {
      Shell.toast('Urutan dirapikan — hemat ' + U.km(saved) + ' dan ' + U.dur(savedMin) + '.',
        { label: 'Urungkan', run: function () { Store.undo(); } });
    } else if (saved < -0.4) {
      Store.undo();
      Shell.toast('Urutan yang sekarang sudah lebih pendek. Tidak ada yang diubah.');
    } else {
      Shell.toast('Urutannya sudah efisien.', { label: 'Urungkan', run: function () { Store.undo(); } });
    }
  }

  /* ---------- wizard susun otomatis ---------- */

  var wizardState = {
    days: 3, interests: ['ikonik', 'budaya', 'alam'], pace: 'sedang',
    mode: 'motor', start: '08:00', budget: 0
  };

  function openWizard() {
    var trip = Store.get();
    wizardState.days = trip.days.length;
    wizardState.budget = trip.budget;

    var chipRow = U.el('div', { class: 'chiprow' },
      RUTE_DATA.INTERESTS.map(function (it) {
        var on = wizardState.interests.indexOf(it.id) >= 0;
        var b = U.el('button', {
          class: 'chip', type: 'button', 'aria-pressed': on ? 'true' : 'false', text: it.label
        });
        b.addEventListener('click', function () {
          var i = wizardState.interests.indexOf(it.id);
          if (i >= 0) wizardState.interests.splice(i, 1);
          else wizardState.interests.push(it.id);
          b.setAttribute('aria-pressed', wizardState.interests.indexOf(it.id) >= 0 ? 'true' : 'false');
        });
        return b;
      }));

    var daysEl = U.el('input', { class: 'input', type: 'number', min: '1', max: '14', id: 'wzDays', value: wizardState.days });
    var paceEl = U.el('select', { class: 'select', id: 'wzPace' },
      Object.keys(Planner.PACE).map(function (k) {
        return U.el('option', { value: k, text: Planner.PACE[k].label + ' — ' + Planner.PACE[k].note, selected: k === wizardState.pace });
      }));
    var modeEl = U.el('select', { class: 'select', id: 'wzMode' },
      Geo.MODE_ORDER.map(function (m) {
        return U.el('option', { value: m, text: Geo.MODES[m].label, selected: m === wizardState.mode });
      }));
    var startEl = U.el('input', { class: 'input', type: 'time', id: 'wzStart', value: wizardState.start, step: '300' });
    var budgetEl = U.el('input', { class: 'input', type: 'number', min: '0', step: '100000', id: 'wzBudget', value: wizardState.budget || '' });

    Shell.openModal('Susunkan itinerary ' + Store.dest().name, U.el('div', { class: 'detail' }, [
      U.el('p', { class: 'detail__prose', text: 'Rute akan memilih tempat yang cocok, mengelompokkannya per wilayah supaya tidak bolak-balik, lalu mengurutkannya jadi rute terpendek.' }),

      U.el('div', { class: 'field' }, [
        U.el('span', { class: 'field__label', text: 'Yang kamu cari' }),
        chipRow
      ]),

      U.el('div', { class: 'grid2' }, [
        U.el('div', { class: 'field' }, [
          U.el('label', { class: 'field__label', for: 'wzDays', text: 'Berapa hari' }), daysEl
        ]),
        U.el('div', { class: 'field' }, [
          U.el('label', { class: 'field__label', for: 'wzStart', text: 'Berangkat jam' }), startEl
        ])
      ]),

      U.el('div', { class: 'field' }, [
        U.el('label', { class: 'field__label', for: 'wzPace', text: 'Tempo' }), paceEl
      ]),

      U.el('div', { class: 'grid2' }, [
        U.el('div', { class: 'field' }, [
          U.el('label', { class: 'field__label', for: 'wzMode', text: 'Kendaraan' }), modeEl
        ]),
        U.el('div', { class: 'field' }, [
          U.el('label', { class: 'field__label', for: 'wzBudget', text: 'Anggaran/orang (opsional)' }), budgetEl
        ])
      ]),

      U.el('div', { class: 'empty__actions' }, [
        U.el('button', {
          class: 'btn btn--primary', type: 'button',
          onclick: function () {
            wizardState.days = U.clamp(parseInt(daysEl.value, 10) || 3, 1, 14);
            wizardState.pace = paceEl.value;
            wizardState.mode = modeEl.value;
            wizardState.start = startEl.value || '08:00';
            wizardState.budget = parseInt(budgetEl.value, 10) || 0;
            Shell.closeModal();
            runWizard();
          }
        }, [U.icon('wand', 'ico--sm'), U.el('span', { text: 'Susun sekarang' })]),
        U.el('button', { class: 'btn', type: 'button', text: 'Batal', onclick: Shell.closeModal })
      ]),

      U.el('p', { class: 'field__hint', text: 'Ini mengganti seluruh isi itinerary yang sekarang. Kamu bisa urungkan setelahnya.' })
    ]));
  }

  function runWizard() {
    var trip = Store.get();
    var result = Planner.generate({
      destId: trip.destId,
      days: wizardState.days,
      interests: wizardState.interests,
      pace: wizardState.pace,
      mode: wizardState.mode,
      budgetPerPerson: wizardState.budget,
      startTime: wizardState.start,
      hub: trip.hub
    });

    if (!result.days.length) { Shell.toast('Tidak ada tempat yang cocok. Coba pilih minat lain.'); return; }

    Store.update('susun otomatis', function (t) {
      t.budget = wizardState.budget;
      t.days = result.days.map(function (g, i) {
        var d = Store.newDay(i, t.startDate);
        d.start = wizardState.start;
        d.mode = wizardState.mode;
        d.stops = g.stops.map(function (p) { return Store.newStop(p); });
        return d;
      });
      t.activeDayId = t.days[0].id;
    });

    var count = result.used.length;
    Shell.toast('Tersusun: ' + count + ' tempat dalam ' + result.days.length + ' hari.',
      { label: 'Urungkan', run: function () { Store.undo(); } });

    if (trip.liveRouting) App.warmRoutes();
  }

  return { render: render, openWizard: openWizard };
})();


/* ===== assets/js/ui/explore.js ===== */
/* ============================================================
   Rute — tampilan Jelajah (pustaka tempat & rekomendasi)
   ============================================================ */

window.ExploreView = (function () {
  'use strict';

  var host;
  var state = {
    q: '',
    cat: 'semua',
    interest: [],
    maxCost: 0,
    sort: 'rekomendasi',
    hideUsed: false
  };

  function render() {
    if (!host) host = U.qs('#view-explore');
    var trip = Store.get();
    var dest = Store.dest();
    var used = Store.usedPlaceIds();
    var scrollTop = host.parentNode ? host.parentNode.scrollTop : 0;

    U.clear(host);

    host.appendChild(U.el('div', { class: 'viewhead' }, [
      U.el('div', { class: 'viewhead__row' }, [
        U.el('h1', { class: 'viewhead__title', text: 'Jelajah ' + dest.name }),
        U.el('div', { class: 'chiprow' }, [
          U.el('button', {
            class: 'btn btn--sm', type: 'button',
            onclick: openCustomPlace
          }, [U.icon('plus', 'ico--sm'), U.el('span', { text: 'Tempat sendiri' })]),
          U.el('button', {
            class: 'btn btn--sm btn--primary', type: 'button',
            onclick: PlanView.openWizard
          }, [U.icon('wand', 'ico--sm'), U.el('span', { text: 'Susun otomatis' })])
        ])
      ]),
      U.el('p', { class: 'viewhead__sub', text: dest.blurb + ' Harga tiket adalah estimasi per orang, disegarkan ' + RUTE_DATA.PRICE_SNAPSHOT + '.' })
    ]));

    var results = filterPlaces(Store.allPlaces(), used);

    host.appendChild(filters(results.length, Store.allPlaces().length));

    if (!results.length) {
      host.appendChild(U.el('div', { class: 'empty' }, [
        U.el('h3', { class: 'empty__title', text: 'Tidak ada yang cocok' }),
        U.el('p', { class: 'empty__text', text: 'Coba longgarkan filternya — hapus kata kunci, naikkan batas biaya, atau pilih kategori "Semua".' }),
        U.el('div', { class: 'empty__actions' }, [
          U.el('button', {
            class: 'btn', type: 'button', text: 'Reset filter',
            onclick: function () {
              state = { q: '', cat: 'semua', interest: [], maxCost: 0, sort: 'rekomendasi', hideUsed: false };
              render();
            }
          })
        ])
      ]));
    } else {
      var list = U.el('div', { class: 'placelist' });
      results.forEach(function (p) { list.appendChild(placeRow(p, trip, used)); });
      host.appendChild(list);
    }

    if (host.parentNode) host.parentNode.scrollTop = scrollTop;
  }

  /* ---------- filter ---------- */

  function filterPlaces(places, used) {
    var q = U.deburr(state.q).trim();

    var out = places.filter(function (p) {
      if (state.hideUsed && used[p.id]) return false;
      if (state.cat !== 'semua' && p.cat !== state.cat) return false;
      if (state.maxCost > 0 && (p.cost || 0) > state.maxCost) return false;
      if (state.interest.length) {
        var hit = state.interest.some(function (t) { return (p.tags || []).indexOf(t) >= 0; });
        if (!hit) return false;
      }
      if (q) {
        var hay = U.deburr(p.name + ' ' + p.area + ' ' + p.why + ' ' + (p.tags || []).join(' '));
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });

    var anchor = Store.get().hub;
    var rf = Store.dest().roadFactor;

    if (state.sort === 'dekat') {
      out.sort(function (a, b) { return Geo.haversine(anchor, a) - Geo.haversine(anchor, b); });
    } else if (state.sort === 'murah') {
      out.sort(function (a, b) { return (a.cost || 0) - (b.cost || 0); });
    } else if (state.sort === 'cepat') {
      out.sort(function (a, b) { return a.dur - b.dur; });
    } else {
      out.sort(function (a, b) {
        return Planner.scorePlace(b, { interests: state.interest, maxPerPlace: state.maxCost }) -
               Planner.scorePlace(a, { interests: state.interest, maxPerPlace: state.maxCost });
      });
    }
    return out;
  }

  function filters(shown, total) {
    var search = U.el('input', {
      class: 'input', type: 'search', id: 'flQ', value: state.q,
      placeholder: 'Cari nama tempat, daerah, atau suasana…', autocomplete: 'off'
    });
    search.addEventListener('input', U.debounce(function () {
      state.q = search.value;
      render();
      var again = U.qs('#flQ');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    }, 220));

    var catSel = U.el('select', { class: 'select', id: 'flCat' },
      [U.el('option', { value: 'semua', text: 'Semua kategori', selected: state.cat === 'semua' })].concat(
        Object.keys(RUTE_DATA.CATEGORIES).map(function (k) {
          return U.el('option', { value: k, text: RUTE_DATA.CATEGORIES[k].label, selected: state.cat === k });
        })
      ));
    catSel.addEventListener('change', function () { state.cat = catSel.value; render(); });

    var sortSel = U.el('select', { class: 'select', id: 'flSort' }, [
      U.el('option', { value: 'rekomendasi', text: 'Paling direkomendasikan', selected: state.sort === 'rekomendasi' }),
      U.el('option', { value: 'dekat', text: 'Terdekat dari penginapan', selected: state.sort === 'dekat' }),
      U.el('option', { value: 'murah', text: 'Paling murah', selected: state.sort === 'murah' }),
      U.el('option', { value: 'cepat', text: 'Paling singkat', selected: state.sort === 'cepat' })
    ]);
    sortSel.addEventListener('change', function () { state.sort = sortSel.value; render(); });

    var costSel = U.el('select', { class: 'select', id: 'flCost' }, [
      U.el('option', { value: '0', text: 'Berapa pun', selected: state.maxCost === 0 }),
      U.el('option', { value: '1', text: 'Gratis saja', selected: state.maxCost === 1 }),
      U.el('option', { value: '25000', text: 'Maks Rp25.000', selected: state.maxCost === 25000 }),
      U.el('option', { value: '60000', text: 'Maks Rp60.000', selected: state.maxCost === 60000 }),
      U.el('option', { value: '150000', text: 'Maks Rp150.000', selected: state.maxCost === 150000 })
    ]);
    costSel.addEventListener('change', function () {
      state.maxCost = parseInt(costSel.value, 10);
      if (state.maxCost === 1) state.maxCost = 0.5;
      render();
    });

    var hide = U.el('input', { type: 'checkbox', id: 'flHide', checked: state.hideUsed });
    hide.addEventListener('change', function () { state.hideUsed = hide.checked; render(); });

    var chips = U.el('div', { class: 'chiprow' },
      RUTE_DATA.INTERESTS.map(function (it) {
        var on = state.interest.indexOf(it.id) >= 0;
        var b = U.el('button', { class: 'chip', type: 'button', 'aria-pressed': on ? 'true' : 'false', text: it.label });
        b.addEventListener('click', function () {
          var i = state.interest.indexOf(it.id);
          if (i >= 0) state.interest.splice(i, 1); else state.interest.push(it.id);
          render();
        });
        return b;
      }));

    return U.el('div', { class: 'filters' }, [
      U.el('div', { class: 'filters__row' }, [
        U.el('div', { class: 'field filters__search' }, [
          U.el('label', { class: 'field__label', for: 'flQ', text: 'Cari' }), search
        ]),
        U.el('div', { class: 'field' }, [
          U.el('label', { class: 'field__label', for: 'flCat', text: 'Kategori' }), catSel
        ]),
        U.el('div', { class: 'field' }, [
          U.el('label', { class: 'field__label', for: 'flCost', text: 'Tiket' }), costSel
        ]),
        U.el('div', { class: 'field' }, [
          U.el('label', { class: 'field__label', for: 'flSort', text: 'Urutkan' }), sortSel
        ])
      ]),
      chips,
      U.el('div', { class: 'filters__row', style: 'justify-content: space-between; align-items: center' }, [
        U.el('label', { class: 'checkline', for: 'flHide' }, [
          hide, U.el('span', { class: 'field__hint', text: 'Sembunyikan yang sudah masuk itinerary' })
        ]),
        U.el('span', { class: 'filters__count num', text: shown + ' dari ' + total + ' tempat' })
      ])
    ]);
  }

  /* ---------- baris tempat ---------- */

  function placeRow(p, trip, used) {
    var isUsed = !!used[p.id];
    var distKm = Geo.haversine(trip.hub, p) * Store.dest().roadFactor;

    var daySel = U.el('select', { class: 'select', style: 'width:auto; min-width:96px', 'aria-label': 'Tambahkan ' + p.name + ' ke hari' },
      trip.days.map(function (d, i) {
        return U.el('option', { value: d.id, text: 'Hari ' + (i + 1), selected: d.id === trip.activeDayId });
      }));

    var addBtn = U.el('button', {
      class: 'btn btn--sm' + (isUsed ? '' : ' btn--primary'), type: 'button',
      onclick: function () {
        Store.addStop(daySel.value, p);
        var di = Store.dayIndex(daySel.value);
        Shell.toast(p.name + ' ditambahkan ke hari ' + (di + 1) + '.', {
          label: 'Lihat', run: function () { Store.setActiveDay(daySel.value); App.setView('plan'); }
        });
      }
    }, [U.icon('plus', 'ico--sm'), U.el('span', { text: isUsed ? 'Tambah lagi' : 'Tambah' })]);

    return U.el('div', { class: 'place' + (isUsed ? ' is-added' : '') }, [
      U.el('div', { class: 'place__main' }, [
        U.el('div', { class: 'place__title' }, [
          U.el('span', { class: 'place__name', text: p.name }),
          U.el('span', { class: 'place__area', text: p.area }),
          isUsed ? U.el('span', { class: 'badge badge--brand' }, [U.icon('check', 'ico--sm'), U.el('span', { text: 'sudah masuk' })]) : null,
          p.custom ? U.el('span', { class: 'badge', text: 'tempat sendiri' }) : null
        ]),
        p.why ? U.el('p', { class: 'place__why', text: p.why }) : null,
        U.el('div', { class: 'place__facts' }, [
          U.el('span', { class: 'fact num' }, [U.icon('money', 'ico--sm'), U.el('span', { text: p.cost > 0 ? U.rupiah(p.cost) + '/orang' : 'Gratis' })]),
          U.el('span', { class: 'fact num' }, [U.icon('clock', 'ico--sm'), U.el('span', { text: U.dur(p.dur) })]),
          U.el('span', { class: 'fact num' }, [U.icon('pin', 'ico--sm'), U.el('span', { text: '± ' + U.km(distKm) + ' dari penginapan' })]),
          p.open ? U.el('span', { class: 'fact', text: p.open + '–' + p.close }) : U.el('span', { class: 'fact', text: '24 jam' }),
          p.rating ? U.el('span', { class: 'fact num' }, [U.icon('star', 'ico--sm'), U.el('span', { text: p.rating.toFixed(1) })]) : null
        ].filter(Boolean))
      ]),
      U.el('div', { class: 'place__actions' }, [
        U.el('button', {
          class: 'btn btn--ghost btn--icon btn--sm', type: 'button',
          'aria-label': 'Detail ' + p.name, title: 'Detail',
          onclick: function () { openPlaceDetail(p); }
        }, [U.icon('info', 'ico--sm')]),
        daySel,
        addBtn
      ])
    ]);
  }

  function openPlaceDetail(p) {
    var trip = Store.get();
    var distKm = Geo.haversine(trip.hub, p) * Store.dest().roadFactor;
    var est = Geo.estimateLeg(trip.hub, p, Store.activeDay().mode, { roadFactor: Store.dest().roadFactor, ignoreTraffic: true });

    Shell.openModal(p.name, U.el('div', { class: 'detail' }, [
      p.why ? U.el('p', { class: 'detail__prose', text: p.why }) : null,
      U.el('div', { class: 'detail__facts' }, [
        detailFact('Tiket', p.cost > 0 ? U.rupiah(p.cost) + '/orang' : 'Gratis'),
        p.extra > 0 ? detailFact('Biaya lain', U.rupiah(p.extra)) : null,
        detailFact('Lama kunjungan', U.dur(p.dur)),
        detailFact('Jam buka', p.open ? p.open + '–' + p.close : '24 jam'),
        detailFact('Dari penginapan', U.km(distKm)),
        detailFact('Waktu tempuh', '± ' + U.dur(est.minutes))
      ].filter(Boolean)),
      p.costNote ? U.el('p', { class: 'field__hint', text: 'Catatan harga: ' + p.costNote }) : null,
      p.tip ? U.el('div', { class: 'detail__tip' }, [U.el('b', { text: 'Tips: ' }), U.el('span', { text: p.tip })]) : null,
      (p.tags || []).length ? U.el('div', { class: 'chiprow' },
        p.tags.map(function (t) { return U.el('span', { class: 'badge', text: t }); })) : null,
      U.el('div', { class: 'empty__actions' }, [
        U.el('a', {
          class: 'btn', href: Geo.mapsPlaceUrl(p), target: '_blank', rel: 'noopener'
        }, [U.icon('ext', 'ico--sm'), U.el('span', { text: 'Lihat di Google Maps' })]),
        U.el('button', {
          class: 'btn btn--primary', type: 'button',
          onclick: function () {
            Store.addStop(Store.get().activeDayId, p);
            Shell.closeModal();
            Shell.toast(p.name + ' ditambahkan.');
          }
        }, [U.icon('plus', 'ico--sm'), U.el('span', { text: 'Tambahkan ke hari aktif' })])
      ])
    ].filter(Boolean)));
  }

  function detailFact(k, v) {
    return U.el('div', { class: 'detail__fact' }, [
      U.el('span', { class: 'detail__k', text: k }),
      U.el('span', { class: 'detail__v', text: v })
    ]);
  }

  /* ---------- tempat buatan sendiri ---------- */

  function openCustomPlace() {
    var f = {};
    function field(id, label, attrs, hint) {
      var i = U.el('input', Object.assign({ class: 'input', id: id }, attrs || {}));
      f[id] = i;
      return U.el('div', { class: 'field' }, [
        U.el('label', { class: 'field__label', for: id, text: label }),
        i,
        hint ? U.el('p', { class: 'field__hint', text: hint }) : null
      ].filter(Boolean));
    }

    var catSel = U.el('select', { class: 'select', id: 'cpCat' },
      Object.keys(RUTE_DATA.CATEGORIES).map(function (k) {
        return U.el('option', { value: k, text: RUTE_DATA.CATEGORIES[k].label });
      }));

    var err = U.el('p', { class: 'field__hint', style: 'color: var(--alert-ink)', hidden: true });

    Shell.openModal('Tambah tempat sendiri', U.el('div', { class: 'detail' }, [
      U.el('p', { class: 'detail__prose', text: 'Untuk penginapan, tempat makan, atau apa pun yang belum ada di daftar. Koordinatnya diambil dari Google Maps: klik kanan lokasinya, lalu klik deretan angka yang muncul untuk menyalin.' }),
      field('cpName', 'Nama tempat', { type: 'text', placeholder: 'Warung Bu Ageng', autocomplete: 'off' }),
      field('cpArea', 'Daerah', { type: 'text', placeholder: 'Tirtodipuran', autocomplete: 'off' }),
      U.el('div', { class: 'grid2' }, [
        field('cpLat', 'Lintang', { type: 'number', step: 'any', placeholder: '-7.8123' }),
        field('cpLng', 'Bujur', { type: 'number', step: 'any', placeholder: '110.3654' })
      ]),
      U.el('div', { class: 'grid2' }, [
        field('cpCost', 'Biaya per orang (Rp)', { type: 'number', min: '0', step: '5000', value: '0' }),
        field('cpDur', 'Lama kunjungan (menit)', { type: 'number', min: '5', step: '15', value: '60' })
      ]),
      U.el('div', { class: 'grid2' }, [
        field('cpOpen', 'Jam buka', { type: 'time', step: '300' }, 'Kosongkan kalau 24 jam'),
        field('cpClose', 'Jam tutup', { type: 'time', step: '300' })
      ]),
      U.el('div', { class: 'field' }, [
        U.el('label', { class: 'field__label', for: 'cpCat', text: 'Kategori' }), catSel
      ]),
      err,
      U.el('div', { class: 'empty__actions' }, [
        U.el('button', {
          class: 'btn btn--primary', type: 'button', text: 'Simpan tempat',
          onclick: function () {
            var name = f.cpName.value.trim();
            var lat = parseFloat(f.cpLat.value), lng = parseFloat(f.cpLng.value);
            if (!name) { fail('Nama tempat belum diisi.'); return; }
            if (isNaN(lat) || lat < -90 || lat > 90) { fail('Lintang harus angka antara -90 dan 90.'); return; }
            if (isNaN(lng) || lng < -180 || lng > 180) { fail('Bujur harus angka antara -180 dan 180.'); return; }

            var place = Store.addCustomPlace({
              name: name, area: f.cpArea.value.trim() || 'Tempat sendiri',
              lat: lat, lng: lng, cat: catSel.value,
              cost: parseInt(f.cpCost.value, 10) || 0,
              dur: parseInt(f.cpDur.value, 10) || 60,
              open: f.cpOpen.value || null, close: f.cpClose.value || null
            });
            Shell.closeModal();
            Shell.toast(place.name + ' ditambahkan ke daftar tempat.', {
              label: 'Masukkan ke hari aktif',
              run: function () { Store.addStop(Store.get().activeDayId, place); }
            });
            render();
          }
        }),
        U.el('button', { class: 'btn', type: 'button', text: 'Batal', onclick: Shell.closeModal })
      ])
    ]));

    function fail(msg) {
      err.textContent = msg;
      err.hidden = false;
    }
  }

  return { render: render, openCustomPlace: openCustomPlace };
})();


/* ===== assets/js/ui/budget.js ===== */
/* ============================================================
   Rute — tampilan Biaya
   ------------------------------------------------------------
   Angka apa pun di sini bisa diubah. Harga tiket berubah terus,
   jadi aplikasi tidak boleh berpura-pura tahu harga pasti —
   ia memberi titik awal yang masuk akal lalu menyerahkan
   kendalinya.
   ============================================================ */

window.BudgetView = (function () {
  'use strict';

  var host;

  function render(computed) {
    if (!host) host = U.qs('#view-budget');
    var trip = Store.get();
    var scrollTop = host.parentNode ? host.parentNode.scrollTop : 0;
    U.clear(host);

    host.appendChild(U.el('div', { class: 'viewhead' }, [
      U.el('div', { class: 'viewhead__row' }, [
        U.el('h1', { class: 'viewhead__title', text: 'Biaya perjalanan' })
      ]),
      U.el('p', {
        class: 'viewhead__sub',
        text: 'Semua angka adalah estimasi awal (harga tiket disegarkan ' + RUTE_DATA.PRICE_SNAPSHOT +
              ') dan bisa kamu ubah langsung di tabel di bawah.'
      })
    ]));

    if (!computed.stops) {
      host.appendChild(U.el('div', { class: 'empty' }, [
        U.el('h3', { class: 'empty__title', text: 'Belum ada yang dihitung' }),
        U.el('p', { class: 'empty__text', text: 'Tambahkan tempat ke itinerary dulu — biayanya akan terkumpul sendiri di sini, dipecah per kategori dan per hari.' }),
        U.el('div', { class: 'empty__actions' }, [
          U.el('button', { class: 'btn btn--primary', type: 'button', text: 'Ke Jelajah', onclick: function () { App.setView('explore'); } })
        ])
      ]));
      return;
    }

    host.appendChild(summary(trip, computed));
    host.appendChild(byCategory(computed));
    host.appendChild(byDay(trip, computed));
    host.appendChild(perStop(trip, computed));

    if (host.parentNode) host.parentNode.scrollTop = scrollTop;
  }

  /* ---------- ringkasan ---------- */

  function summary(trip, c) {
    var people = Math.max(1, trip.people);
    var target = trip.budget > 0 ? trip.budget * people : 0;
    var diff = target > 0 ? target - c.grand : 0;

    var panel = U.el('section', { class: 'panel' }, [
      U.el('div', { class: 'total' }, [
        U.el('span', { class: 'total__v num', text: U.rupiah(c.grand) }),
        U.el('span', { class: 'total__k', text: 'total untuk ' + people + ' orang · ' + U.rupiah(c.perPerson) + ' per orang' })
      ])
    ]);

    var facts = U.el('div', { class: 'daystats' }, [
      fact('Hari', trip.days.length + ' hari, ' + c.nights + ' malam'),
      fact('Tempat', c.stops + ' perhentian'),
      fact('Jarak total', U.km(c.travelKm)),
      fact('Waktu di jalan', U.dur(c.travelMin)),
      fact('Rata-rata per hari', U.rupiah(c.grand / trip.days.length))
    ]);
    panel.appendChild(facts);

    if (target > 0) {
      var over = diff < 0;
      panel.appendChild(U.el('div', {
        class: 'flagline', 'data-level': over ? 'alert' : 'ok',
        style: 'margin-top: var(--s-4)'
      }, [
        U.icon(over ? 'warn' : 'check', 'ico--sm'),
        U.el('span', {
          text: over
            ? 'Lewat ' + U.rupiah(-diff) + ' dari target ' + U.rupiah(target) + '. Yang paling besar: ' + biggest(c) + '.'
            : 'Masih ada sisa ' + U.rupiah(diff) + ' dari target ' + U.rupiah(target) + '.'
        })
      ]));
    }

    panel.appendChild(U.el('div', { class: 'empty__actions', style: 'margin-top: var(--s-4)' }, [
      U.el('button', {
        class: 'btn btn--sm', type: 'button', text: 'Atur jumlah orang & anggaran',
        onclick: function () { Shell.toggleDrawer(true); }
      })
    ]));

    return panel;
  }

  function biggest(c) {
    var best = null, bv = -1;
    Object.keys(c.cost).forEach(function (k) {
      if (c.cost[k] > bv) { bv = c.cost[k]; best = k; }
    });
    return (Schedule.COST_LABELS[best] || best).toLowerCase();
  }

  function fact(k, v) {
    return U.el('div', { class: 'daystat' }, [
      U.el('span', { class: 'daystat__k', text: k }),
      U.el('span', { class: 'daystat__v num', text: v })
    ]);
  }

  /* ---------- per kategori ---------- */

  function byCategory(c) {
    var rows = Object.keys(c.cost).map(function (k) {
      return { label: Schedule.COST_LABELS[k] || k, value: c.cost[k] };
    });

    return U.el('section', { class: 'panel' }, [
      U.el('div', { class: 'panel__head' }, [
        U.el('h2', { class: 'panel__title', text: 'Ke mana uangnya pergi' }),
        U.el('span', { class: 'panel__sub', text: 'Seluruh trip, ' + Store.get().people + ' orang' })
      ]),
      Charts.ranked(rows, { emptyText: 'Belum ada biaya tercatat.' }),
      U.el('div', { style: 'margin-top: var(--s-5)' }, [
        Charts.timeSplit(c.travelMin, c.visitMin)
      ])
    ]);
  }

  /* ---------- per hari ---------- */

  function byDay(trip, c) {
    var rows = c.days.map(function (d, i) {
      return {
        label: 'Hari ' + (i + 1) + (d.day.title ? ' · ' + d.day.title : ''),
        value: d.subtotal
      };
    });

    return U.el('section', { class: 'panel' }, [
      U.el('div', { class: 'panel__head' }, [
        U.el('h2', { class: 'panel__title', text: 'Biaya per hari' }),
        U.el('span', { class: 'panel__sub', text: 'Belum termasuk penginapan' })
      ]),
      Charts.byDay(rows)
    ]);
  }

  /* ---------- tabel per perhentian ---------- */

  function perStop(trip, c) {
    var tbody = U.el('tbody');
    var people = Math.max(1, trip.people);

    c.days.forEach(function (dc, di) {
      if (!dc.stopCount) return;

      tbody.appendChild(U.el('tr', {}, [
        U.el('td', { colspan: '5', style: 'background: var(--surface); font-weight: 650; font-size: var(--t-xs)' }, [
          U.el('span', { text: 'Hari ' + (di + 1) + (dc.day.title ? ' — ' + dc.day.title : '') + ' · ' + U.fmtDateShort(dc.day.date) })
        ])
      ]));

      dc.items.forEach(function (it) {
        if (it.type !== 'stop') return;
        var p = it.place;

        var input = U.el('input', {
          class: 'cellinput num', type: 'number', min: '0', step: '5000',
          value: it.perPerson,
          'aria-label': 'Tiket per orang untuk ' + p.name
        });
        input.addEventListener('change', function () {
          var v = Math.max(0, parseInt(input.value, 10) || 0);
          Store.update('ubah biaya', function () { it.stop.cost = v; });
        });

        tbody.appendChild(U.el('tr', {}, [
          U.el('td', {}, [
            U.el('div', { text: p.name }),
            p.costNote ? U.el('div', { style: 'font-size: var(--t-2xs); color: var(--ink-muted)', text: p.costNote }) : null
          ].filter(Boolean)),
          U.el('td', { class: 'n' }, [input]),
          U.el('td', { class: 'n num', text: it.group > 0 ? U.rupiah(it.group) : '—' }),
          U.el('td', { class: 'n num', text: String(people) }),
          U.el('td', { class: 'n num', text: U.rupiah(it.cost) })
        ]));
      });

      if (dc.cost.transport > 0) {
        tbody.appendChild(U.el('tr', {}, [
          U.el('td', {}, [U.el('span', { style: 'color: var(--ink-muted)', text: 'Transport hari ' + (di + 1) + ' (' + U.km(dc.travelKm) + ')' })]),
          U.el('td', { class: 'n num', text: '—' }),
          U.el('td', { class: 'n num', text: U.rupiah(dc.cost.transport) }),
          U.el('td', { class: 'n num', text: '—' }),
          U.el('td', { class: 'n num', text: U.rupiah(dc.cost.transport) })
        ]));
      }
    });

    if (c.cost.penginapan > 0) {
      tbody.appendChild(U.el('tr', {}, [
        U.el('td', {}, [U.el('span', { text: 'Penginapan · ' + c.nights + ' malam' })]),
        U.el('td', { class: 'n num', text: '—' }),
        U.el('td', { class: 'n num', text: U.rupiah(trip.lodging) + '/malam' }),
        U.el('td', { class: 'n num', text: '—' }),
        U.el('td', { class: 'n num', text: U.rupiah(c.cost.penginapan) })
      ]));
    }

    return U.el('section', { class: 'panel' }, [
      U.el('div', { class: 'panel__head' }, [
        U.el('h2', { class: 'panel__title', text: 'Rincian per tempat' }),
        U.el('span', { class: 'panel__sub', text: 'Klik angka tiket untuk mengubahnya' })
      ]),
      U.el('div', { class: 'tablewrap' }, [
        U.el('table', { class: 'costtable' }, [
          U.el('thead', {}, [
            U.el('tr', {}, [
              U.el('th', { scope: 'col', text: 'Tempat' }),
              U.el('th', { scope: 'col', class: 'n', text: 'Tiket/orang' }),
              U.el('th', { scope: 'col', class: 'n', text: 'Biaya rombongan' }),
              U.el('th', { scope: 'col', class: 'n', text: 'Orang' }),
              U.el('th', { scope: 'col', class: 'n', text: 'Subtotal' })
            ])
          ]),
          tbody,
          U.el('tfoot', {}, [
            U.el('tr', {}, [
              U.el('td', { text: 'Total' }),
              U.el('td', { class: 'n' }),
              U.el('td', { class: 'n' }),
              U.el('td', { class: 'n' }),
              U.el('td', { class: 'n num', text: U.rupiah(c.grand) })
            ])
          ])
        ])
      ])
    ]);
  }

  return { render: render };
})();


/* ===== assets/js/ui/live.js ===== */
/* ============================================================
   Rute — tampilan Hari Ini (pengatur waktu di lapangan)
   ------------------------------------------------------------
   Dipakai saat sedang jalan, bukan saat merencanakan. Ia menjawab
   tiga pertanyaan: sekarang harusnya di mana, berapa lama lagi
   harus berangkat, dan kalau sudah telat, jadwal sisanya jadi
   seperti apa.
   ============================================================ */

window.LiveView = (function () {
  'use strict';

  var host;
  var timer = null;

  function nowMinutes() {
    var d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }

  /** Hari yang tanggalnya hari ini; kalau tidak ada, hari aktif. */
  function pickDay(trip) {
    var today = U.isoToday();
    for (var i = 0; i < trip.days.length; i++) {
      if (trip.days[i].date === today) return { day: trip.days[i], index: i, isToday: true };
    }
    var d = Store.activeDay();
    return { day: d, index: Store.dayIndex(d.id), isToday: false };
  }

  function render(computed) {
    if (!host) host = U.qs('#view-live');
    var trip = Store.get();
    var sel = pickDay(trip);
    var dc = computed.days[sel.index];
    var now = nowMinutes();

    U.clear(host);

    host.appendChild(U.el('div', { class: 'viewhead' }, [
      U.el('div', { class: 'viewhead__row' }, [
        U.el('h1', { class: 'viewhead__title', text: sel.isToday ? 'Hari ini' : 'Pratinjau hari ' + (sel.index + 1) })
      ]),
      U.el('p', {
        class: 'viewhead__sub',
        text: sel.isToday
          ? U.fmtDate(sel.day.date, { year: true }) + ' · sekarang ' + U.toHHMM(now)
          : 'Tidak ada hari yang tanggalnya hari ini, jadi yang ditampilkan adalah hari ' + (sel.index + 1) +
            '. Atur tanggal trip di Pengaturan supaya mode ini aktif otomatis saat kamu berangkat.'
      })
    ]));

    if (!dc.stopCount) {
      host.appendChild(U.el('div', { class: 'empty' }, [
        U.el('h3', { class: 'empty__title', text: 'Tidak ada agenda' }),
        U.el('p', { class: 'empty__text', text: 'Hari ini belum ada tempat yang dijadwalkan.' }),
        U.el('div', { class: 'empty__actions' }, [
          U.el('button', { class: 'btn btn--primary', type: 'button', text: 'Susun hari ini', onclick: function () { App.setView('plan'); } })
        ])
      ]));
      return;
    }

    var state = analyse(dc, now, sel.isToday);

    host.appendChild(nowCard(state, dc, sel, trip));
    host.appendChild(driftBar(state, sel, dc));
    host.appendChild(agenda(dc, state, sel));
    host.appendChild(calendarStrip(trip, computed));
  }

  /* ---------- di mana kita sekarang ---------- */

  function analyse(dc, now, isToday) {
    var stops = dc.items.filter(function (it) { return it.type === 'stop'; });
    var legs = dc.items.filter(function (it) { return it.type === 'leg'; });

    if (!isToday) {
      return { phase: 'preview', current: null, next: stops[0] || null, stops: stops, now: now };
    }

    if (now < dc.startMin) {
      return {
        phase: 'before', current: null, next: stops[0] || null, stops: stops, now: now,
        untilStart: dc.startMin - now
      };
    }
    if (now >= dc.endMin) {
      return { phase: 'after', current: null, next: null, stops: stops, now: now };
    }

    for (var i = 0; i < stops.length; i++) {
      var s = stops[i];
      if (now >= s.arrive && now < s.depart) {
        return {
          phase: 'at', current: s, next: stops[i + 1] || null, stops: stops, now: now,
          leftHere: s.depart - now,
          progress: (now - s.arrive) / Math.max(1, s.depart - s.arrive)
        };
      }
      if (now < s.arrive) {
        var prev = stops[i - 1] || null;
        return {
          phase: 'moving', current: null, next: s, prev: prev, stops: stops, now: now,
          untilArrive: s.arrive - now
        };
      }
    }
    return { phase: 'after', current: null, next: null, stops: stops, now: now };
  }

  /* ---------- kartu utama ---------- */

  function nowCard(state, dc, sel, trip) {
    var k, title, meta, progress = null;

    if (state.phase === 'preview') {
      k = 'Mulai hari ini';
      title = state.next ? state.next.place.name : '—';
      meta = 'Berangkat ' + U.toHHMM(dc.startMin) + ' · selesai ' + U.toHHMM(dc.endMin);
    } else if (state.phase === 'before') {
      k = 'Belum berangkat';
      title = state.next ? state.next.place.name : '—';
      meta = 'Berangkat ' + U.dur(state.untilStart) + ' lagi, jam ' + U.toHHMM(dc.startMin);
    } else if (state.phase === 'at') {
      k = 'Sekarang di';
      title = state.current.place.name;
      meta = 'Sisa ' + U.dur(state.leftHere) + ' di sini · lanjut jam ' + U.toHHMM(state.current.depart);
      progress = state.progress;
    } else if (state.phase === 'moving') {
      k = 'Sedang di jalan menuju';
      title = state.next.place.name;
      meta = 'Perkiraan sampai ' + U.toHHMM(state.next.arrive) + ' · ' + U.dur(state.untilArrive) + ' lagi';
    } else {
      k = 'Agenda selesai';
      title = 'Hari ini beres';
      meta = dc.stopCount + ' tempat · ' + U.km(dc.travelKm) + ' · ' + U.rupiah(dc.subtotal);
    }

    var card = U.el('section', { class: 'nowcard' }, [
      U.el('p', { class: 'nowcard__k', text: k }),
      U.el('h2', { class: 'nowcard__title', text: title }),
      U.el('p', { class: 'nowcard__meta num', text: meta })
    ]);

    if (progress !== null) {
      card.appendChild(U.el('div', { class: 'nowcard__bar', role: 'presentation' }, [
        U.el('div', { class: 'nowcard__fill', style: '--p:' + U.clamp(progress, 0, 1) })
      ]));
    }

    var actions = U.el('div', { class: 'nowcard__row' });

    if (state.next) {
      actions.appendChild(U.el('a', {
        class: 'btn btn--sm',
        href: Geo.mapsDirUrl(
          state.current ? state.current.place : (state.prev ? state.prev.place : trip.hub),
          state.next.place,
          sel.day.mode
        ),
        target: '_blank', rel: 'noopener'
      }, [U.icon('route', 'ico--sm'), U.el('span', { text: 'Navigasi ke ' + shortName(state.next.place.name) })]));
    }

    if (state.phase === 'at' || state.phase === 'moving' || state.phase === 'before') {
      actions.appendChild(U.el('button', {
        class: 'btn btn--sm', type: 'button', text: 'Saya telat 15 menit',
        onclick: function () { shift(sel.day, 15); }
      }));
      actions.appendChild(U.el('button', {
        class: 'btn btn--sm', type: 'button', text: 'Telat 30 menit',
        onclick: function () { shift(sel.day, 30); }
      }));
    }

    if (actions.childNodes.length) card.appendChild(actions);
    return card;
  }

  function shortName(n) { return n.length > 22 ? n.slice(0, 21) + '…' : n; }

  /* ---------- selisih terhadap rencana ---------- */

  function driftBar(state, sel, dc) {
    if (state.phase === 'preview' || state.phase === 'after') {
      return U.el('div', { class: 'driftbar' }, [
        U.icon('info', 'ico--sm'),
        U.el('span', {
          text: state.phase === 'after'
            ? 'Semua agenda hari ini sudah lewat.'
            : 'Pratinjau — pengatur waktu aktif otomatis pada tanggal hari itu.'
        })
      ]);
    }

    var target, label;
    if (state.phase === 'at') { target = state.current.arrive; label = 'tiba di ' + shortName(state.current.place.name); }
    else if (state.phase === 'moving') { target = state.prev ? state.prev.depart : dc.startMin; label = 'meninggalkan titik sebelumnya'; }
    else { target = dc.startMin; label = 'berangkat'; }

    var drift = state.now - target;
    var tone = drift > 10 ? 'late' : (drift < -10 ? 'early' : null);
    var text = Math.abs(drift) <= 10
      ? 'Sesuai jadwal'
      : (drift > 0 ? 'Telat ' + U.dur(drift) : 'Lebih cepat ' + U.dur(-drift));

    var bar = U.el('div', { class: 'driftbar' }, [
      U.icon(tone === 'late' ? 'warn' : 'check', 'ico--sm'),
      U.el('span', { class: 'driftbar__v', 'data-tone': tone, text: text }),
      U.el('span', { class: 'field__hint', text: 'dibanding rencana ' + label + ' jam ' + U.toHHMM(target) })
    ]);

    if (Math.abs(drift) > 10) {
      bar.appendChild(U.el('button', {
        class: 'btn btn--sm', type: 'button',
        text: drift > 0 ? 'Geser sisa hari +' + Math.round(drift) + ' mnt' : 'Majukan ' + Math.round(-drift) + ' mnt',
        onclick: function () { shift(sel.day, drift); }
      }));
    }

    return bar;
  }

  function shift(day, minutes) {
    var cur = U.toMin(day.start);
    var next = U.clamp(cur + Math.round(minutes), 0, 23 * 60 + 55);
    Store.update('geser jadwal', function () { day.start = U.toHHMM(next); });
    Shell.toast('Jam berangkat digeser ke ' + U.toHHMM(next) + '. Sisa jadwal ikut menyesuaikan.',
      { label: 'Urungkan', run: function () { Store.undo(); } });
  }

  /* ---------- daftar agenda ---------- */

  function agenda(dc, state, sel) {
    var list = U.el('div', { class: 'upnext' });

    dc.items.forEach(function (it) {
      if (it.type !== 'stop') return;
      var isNow = state.current === it;
      var isDone = state.now >= it.depart && (state.phase !== 'preview');

      var right = isNow ? U.el('span', { class: 'badge badge--brand', text: 'sekarang' })
        : isDone ? U.el('span', { class: 'badge', text: 'lewat' })
        : U.el('span', { class: 'badge num', text: it.cost > 0 ? U.rupiah(it.cost) : 'Gratis' });

      list.appendChild(U.el('div', {
        class: 'upnext__row' + (isNow ? ' is-now' : '') + (isDone && !isNow ? ' is-done' : '')
      }, [
        U.el('span', { class: 'upnext__t num', text: U.toHHMM(it.arrive) }),
        U.el('span', { class: 'upnext__n' }, [
          U.el('span', { text: it.place.name }),
          it.flags.length ? U.el('span', {
            style: 'color: var(--warn-ink); font-size: var(--t-xs); display:block',
            text: it.flags[0].text
          }) : null
        ].filter(Boolean)),
        right
      ]));
    });

    return U.el('section', { class: 'panel' }, [
      U.el('div', { class: 'panel__head' }, [
        U.el('h2', { class: 'panel__title', text: 'Agenda hari ' + (sel.index + 1) }),
        U.el('span', { class: 'panel__sub num', text: U.toHHMM(dc.startMin) + '–' + U.toHHMM(dc.endMin) + ' · ' + U.km(dc.travelKm) })
      ]),
      list
    ]);
  }

  /* ---------- ekspor kalender ---------- */

  function calendarStrip(trip, computed) {
    var hasDates = trip.days.some(function (d) { return !!d.date; });

    return U.el('section', { class: 'panel' }, [
      U.el('div', { class: 'panel__head' }, [
        U.el('h2', { class: 'panel__title', text: 'Bawa ke kalender' }),
        U.el('span', { class: 'panel__sub', text: 'Tanpa login, tanpa izin apa pun' })
      ]),
      U.el('p', { class: 'detail__prose', text: window.RUTE_ARTIFACT
        ? 'Simpan seluruh trip sebagai satu berkas kalender, lalu impor sekali jalan lewat Google Calendar → Setelan → Impor & ekspor. Halaman ini hanya boleh menyimpan berkas .txt, jadi ganti akhirannya jadi .ics dulu. Tiap acara sudah membawa lokasi, perkiraan biaya, dan pengingat 30 menit sebelumnya.'
        : 'Unduh satu berkas .ics berisi seluruh trip, lalu impor sekali jalan ke Google Calendar lewat Setelan → Impor & ekspor. Tiap acara sudah membawa lokasi, perkiraan biaya, dan pengingat 30 menit sebelumnya.' }),
      U.el('div', { class: 'empty__actions' }, [
        U.el('button', {
          class: 'btn btn--primary', type: 'button', disabled: !hasDates,
          onclick: App.exportIcs
        }, [U.icon('cal', 'ico--sm'), U.el('span', { text: window.RUTE_ARTIFACT ? 'Simpan seluruh trip' : 'Unduh seluruh trip (.ics)' })]),
        U.el('a', {
          class: 'btn', href: 'https://calendar.google.com/calendar/u/0/r/settings/export',
          target: '_blank', rel: 'noopener'
        }, [U.icon('ext', 'ico--sm'), U.el('span', { text: 'Buka halaman impor Google' })])
      ]),
      !hasDates ? U.el('p', { class: 'field__hint', text: 'Isi tanggal hari pertama di Pengaturan supaya acaranya punya waktu.' }) : null
    ].filter(Boolean));
  }

  /* ---------- detak jam ---------- */

  function startTicking(onTick) {
    stopTicking();
    timer = setInterval(onTick, 30000);
  }

  function stopTicking() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  return { render: render, startTicking: startTicking, stopTicking: stopTicking };
})();


/* ===== assets/js/app.js ===== */
/* ============================================================
   Rute — bootstrap & orkestrasi
   ============================================================ */

window.App = (function () {
  'use strict';

  var currentView = 'plan';
  var mapScope = 'day';
  var mapOpen = false;
  var computed = null;
  var warming = false;

  /* ---------- render pusat ---------- */

  function refresh() {
    var trip = Store.get();
    computed = Schedule.computeTrip(trip);

    Shell.renderTopbar(computed);
    Shell.renderRail(computed);

    if (currentView === 'plan') PlanView.render(computed);
    else if (currentView === 'explore') ExploreView.render();
    else if (currentView === 'budget') BudgetView.render(computed);
    else if (currentView === 'live') LiveView.render(computed);

    renderMap();
  }

  /* ---------- navigasi tampilan ---------- */

  function setView(view) {
    if (currentView === view) {
      if (view === 'plan') U.qs('.content').scrollTop = 0;
      return;
    }
    currentView = view;
    Store.setPref('view', view);

    ['plan', 'explore', 'budget', 'live'].forEach(function (v) {
      U.qs('#view-' + v).hidden = v !== view;
    });
    U.qsa('.rail__btn[data-view]').forEach(function (b) {
      var on = b.getAttribute('data-view') === view;
      b.classList.toggle('is-active', on);
      if (on) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });

    if (view === 'live') LiveView.startTicking(function () { if (currentView === 'live') refresh(); });
    else LiveView.stopTicking();

    refresh();
    U.qs('.content').scrollTop = 0;
  }

  /* ---------- peta ---------- */

  function buildMapModel() {
    var trip = Store.get();
    var activeIndex = Store.dayIndex(trip.activeDayId);
    var days = [];

    computed.days.forEach(function (dc, di) {
      var points = [];
      var legs = [];
      var order = 0;

      dc.items.forEach(function (it) {
        if (it.type === 'stop') {
          order++;
          points.push({ place: it.place, order: order, arrive: it.arrive, depart: it.depart });
        } else {
          legs.push({
            from: { lat: it.from.lat, lng: it.from.lng },
            to: { lat: it.to.lat, lng: it.to.lng },
            geometry: geometryFor(it, dc.day.mode)
          });
        }
      });

      if (points.length) days.push({ index: di, points: points, legs: legs, mode: dc.day.mode });
    });

    var focus = mapScope === 'day' ? activeIndex : null;

    /* Dalam mode "semua hari", warna saja tidak cukup untuk
       membedakan lebih dari beberapa hari — makanya tiap penanda
       tetap membawa nomor urutannya dan legenda selalu ada. */
    return { days: days, focusIndex: focus, hub: trip.hub };
  }

  function geometryFor(leg, mode) {
    if (!Store.get().liveRouting) return null;
    var m = Geo.MODES[mode] || Geo.MODES.motor;
    var cached = Geo.hasLive(leg.from, leg.to, mode);
    if (!cached) return null;
    var full = Geo.leg(leg.from, leg.to, mode, { live: true, roadFactor: Store.dest().roadFactor });
    return full.geometry || null;
  }

  function renderMap() {
    var model = buildMapModel();
    RMap.render(model);
    renderLegend(model);
  }

  function renderLegend(model) {
    var host = U.qs('#mapLegend');
    U.clear(host);

    if (!model.days.length) {
      host.appendChild(U.el('p', { class: 'legend__note', text: 'Belum ada tempat untuk dipetakan.' }));
      return;
    }

    var wrap = U.el('div', { class: 'legend' });

    if (mapScope === 'day') {
      var di = model.focusIndex;
      var d = null;
      model.days.forEach(function (x) { if (x.index === di) d = x; });
      if (d) {
        wrap.appendChild(U.el('span', { class: 'legend__item' }, [
          U.el('i', { class: 'legend__sw', style: '--swatch: var(--day-' + ((di % 7) + 1) + ')' }),
          U.el('span', { text: 'Hari ' + (di + 1) + ' · ' + d.points.length + ' perhentian, bernomor sesuai urutan' })
        ]));
      } else {
        wrap.appendChild(U.el('span', { class: 'legend__note', text: 'Hari aktif belum punya tempat.' }));
      }
    } else {
      model.days.forEach(function (d) {
        wrap.appendChild(U.el('span', { class: 'legend__item' }, [
          U.el('i', { class: 'legend__sw', style: '--swatch: var(--day-' + ((d.index % 7) + 1) + ')' }),
          U.el('span', { text: 'Hari ' + (d.index + 1) })
        ]));
      });
      wrap.appendChild(U.el('span', { class: 'legend__note', text: '· angka di penanda = urutan kunjungan' }));
    }

    host.appendChild(wrap);

    var live = computed.totalLegs ? computed.liveLegs + '/' + computed.totalLegs : null;
    host.appendChild(U.el('p', {
      class: 'legend__note', style: 'margin-top:6px',
      text: window.RUTE_ARTIFACT
        ? 'Garis putus-putus = jarak lurus antar titik; jarak dan waktu di timeline sudah dikoreksi faktor jalan.'
        : (!Store.get().liveRouting
          ? 'Garis putus-putus = perkiraan garis lurus. Aktifkan rute jalan sebenarnya di Pengaturan.'
          : (live ? live + ' ruas memakai rute jalan sebenarnya.' : 'Menghitung rute…'))
    }));
  }

  function toggleMap(open) {
    mapOpen = open;
    U.qs('#mappane').classList.toggle('is-open', open);
    var tab = U.qs('#btnMapTab');
    tab.setAttribute('aria-expanded', open ? 'true' : 'false');
    tab.classList.toggle('is-active', open);
    if (open) RMap.invalidate();
  }

  /* ---------- rute nyata ---------- */

  function warmRoutes(force) {
    if (window.RUTE_ARTIFACT) return;   /* tidak boleh menghubungi jaringan */
    var trip = Store.get();
    if (!trip.liveRouting && !force) return;
    if (warming) return;

    var pairs = Schedule.legPairs(trip);
    if (!pairs.length) return;

    /* Kelompokkan per moda karena OSRM memakai profil berbeda. */
    var byMode = {};
    pairs.forEach(function (p) {
      var m = p[2] || 'motor';
      (byMode[m] = byMode[m] || []).push([p[0], p[1]]);
    });

    warming = true;
    var dismiss = Shell.toast('Menghitung rute jalan sebenarnya…');
    var modes = Object.keys(byMode);
    var i = 0;

    function nextMode() {
      if (i >= modes.length) {
        warming = false;
        dismiss();
        refresh();
        var pct = computed.totalLegs ? Math.round((computed.liveLegs / computed.totalLegs) * 100) : 0;
        Shell.toast(pct >= 100
          ? 'Semua ruas sudah memakai jarak jalan sebenarnya.'
          : (pct > 0
            ? pct + '% ruas berhasil dirutekan; sisanya tetap pakai estimasi.'
            : 'Layanan rute tidak bisa dihubungi. Tetap memakai estimasi.'));
        return;
      }
      var m = modes[i++];
      Geo.warm(byMode[m], m, function () { refresh(); }).then(nextMode);
    }
    nextMode();
  }

  /* ---------- ekspor ---------- */

  function exportIcs() {
    var trip = Store.get();
    if (!trip.days.some(function (d) { return !!d.date; })) {
      Shell.toast('Isi tanggal trip dulu di Pengaturan.', { label: 'Buka', run: function () { Shell.toggleDrawer(true); } });
      return;
    }
    var ics = Cal.buildIcs(trip, computed);
    var events = Cal.collect(trip, computed);
    if (!events.length) { Shell.toast('Belum ada kegiatan untuk diekspor.'); return; }

    Cal.download(Cal.slug(trip.name) + '.ics', ics).then(function (res) {
      Shell.toast(res.via === 'capability'
        ? events.length + ' acara tersimpan sebagai ' + res.filename +
          '. Ganti akhirannya jadi .ics, lalu impor di Google Calendar → Setelan → Impor & ekspor.'
        : events.length + ' acara diunduh. Impor lewat Google Calendar → Setelan → Impor & ekspor.');
    }).catch(function (e) {
      Shell.toast(downloadError(e, 'Berkas kalender tidak tersimpan.'));
    });
  }

  /** Pesan yang menjelaskan kenapa penyimpanan gagal, bukan sekadar "gagal". */
  function downloadError(e, fallback) {
    var code = e && e.code;
    if (code === 'declined') return 'Penyimpanan dibatalkan.';
    if (code === 'too_large') return 'Berkasnya terlalu besar untuk disimpan dari halaman ini.';
    if (code === 'rate_limited') return 'Tunggu sebentar, lalu coba simpan lagi.';
    if (code === 'rejected_extension' || code === 'extension_not_enabled') {
      return 'Jenis berkas ini tidak bisa disimpan dari halaman ini. Salin datanya lewat Simpan / muat.';
    }
    return fallback;
  }

  function openDataPanel() {
    var trip = Store.get();
    var ta = U.el('textarea', {
      class: 'textarea', style: 'min-height: 180px; font-family: ui-monospace, monospace; font-size: 12px',
      spellcheck: 'false', 'aria-label': 'Data trip dalam format JSON'
    });
    ta.value = Store.exportJson();

    var err = U.el('p', { class: 'field__hint', style: 'color: var(--alert-ink)', hidden: true });

    Shell.openModal('Simpan / muat trip', U.el('div', { class: 'detail' }, [
      U.el('p', { class: 'detail__prose', text: 'Trip tersimpan otomatis di browser ini. Untuk memindahkannya ke perangkat lain atau menyimpan beberapa versi, salin teks di bawah — atau unduh sebagai berkas.' }),
      U.el('div', { class: 'empty__actions' }, [
        U.el('button', {
          class: 'btn', type: 'button', text: 'Unduh berkas .json',
          onclick: function () {
            Cal.download(Cal.slug(trip.name) + '.json', Store.exportJson(), 'application/json')
              .then(function (res) { Shell.toast('Tersimpan sebagai ' + res.filename + '.'); })
              .catch(function (e) { Shell.toast(downloadError(e, 'Berkas tidak tersimpan.')); });
          }
        }),
        U.el('button', {
          class: 'btn', type: 'button', text: 'Salin ke papan klip',
          onclick: function () {
            ta.select();
            try {
              if (navigator.clipboard) navigator.clipboard.writeText(ta.value);
              else document.execCommand('copy');
              Shell.toast('Data trip disalin.');
            } catch (e) { Shell.toast('Salin manual dengan Ctrl+C.'); }
          }
        })
      ]),
      ta,
      err,
      U.el('div', { class: 'empty__actions' }, [
        U.el('button', {
          class: 'btn btn--primary', type: 'button', text: 'Muat dari teks di atas',
          onclick: function () {
            var parsed;
            try { parsed = JSON.parse(ta.value); }
            catch (e) { fail('Teksnya bukan JSON yang valid. Pastikan tersalin utuh.'); return; }
            if (!parsed || !parsed.days || !parsed.days.length) { fail('Data ini tidak berisi hari perjalanan.'); return; }
            if (!RUTE_DATA.DESTINATIONS.some(function (d) { return d.id === parsed.destId; })) {
              fail('Destinasi "' + parsed.destId + '" tidak dikenal di versi ini.');
              return;
            }

            /* Perhentian yang menunjuk ke tempat tak dikenal akan
               hilang diam-diam saat dijadwalkan. Lebih baik dibuang
               di sini dan dilaporkan apa adanya. */
            var known = {};
            RUTE_DATA.byId(parsed.destId).places.forEach(function (pl) { known[pl.id] = true; });
            (parsed.customPlaces || []).forEach(function (pl) { known[pl.id] = true; });

            var lost = 0;
            parsed.days.forEach(function (d) {
              d.stops = (d.stops || []).filter(function (s) {
                if (s.custom || known[s.placeId]) return true;
                lost++;
                return false;
              });
            });

            Store.replaceTrip(parsed);
            Shell.closeModal();
            Shell.toast(lost
              ? 'Trip dimuat, tapi ' + lost + ' tempat tidak dikenali dan dilewati.'
              : 'Trip dimuat.');
          }
        })
      ])
    ]));

    function fail(m) { err.textContent = m; err.hidden = false; }
  }

  /* ---------- papan ketik ---------- */

  function bindKeys() {
    document.addEventListener('keydown', function (e) {
      var t = e.target;
      var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        if (typing) return;
        e.preventDefault();
        var label = Store.undo();
        Shell.toast(label ? 'Dibatalkan: ' + label : 'Tidak ada yang bisa dibatalkan.');
        return;
      }
      if (typing) return;

      if (e.key === '1') setView('plan');
      else if (e.key === '2') setView('explore');
      else if (e.key === '3') setView('budget');
      else if (e.key === '4') setView('live');
      else if (e.key === 'm' || e.key === 'M') toggleMap(!mapOpen);
      else if (e.key === '?') showHelp();
    });
  }

  function showHelp() {
    Shell.openModal('Pintasan papan ketik', U.el('div', { class: 'detail' }, [
      U.el('div', { class: 'detail__facts' }, [
        kv('1 – 4', 'Pindah tampilan'),
        kv('M', 'Buka/tutup peta'),
        kv('Ctrl/Cmd + Z', 'Urungkan'),
        kv('?', 'Bantuan ini')
      ])
    ]));
    function kv(k, v) {
      return U.el('div', { class: 'detail__fact' }, [
        U.el('span', { class: 'detail__k', text: k }),
        U.el('span', { class: 'detail__v', text: v })
      ]);
    }
  }

  /* ---------- mulai ---------- */

  function init() {
    Store.init();
    Shell.init();

    var prefs = Store.getPrefs();
    mapScope = prefs.mapScope || 'day';
    U.qsa('.segmented__btn[data-mapscope]').forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-mapscope') === mapScope);
      b.addEventListener('click', function () {
        mapScope = b.getAttribute('data-mapscope');
        Store.setPref('mapScope', mapScope);
        U.qsa('.segmented__btn[data-mapscope]').forEach(function (o) {
          o.classList.toggle('is-active', o === b);
        });
        renderMap();
      });
    });

    RMap.init(U.qs('#mapCanvas'), function (placeId, dayIndex) {
      var trip = Store.get();
      if (trip.days[dayIndex]) Store.setActiveDay(trip.days[dayIndex].id);
      setView('plan');
      var stop = null;
      (trip.days[dayIndex] || { stops: [] }).stops.forEach(function (s) {
        if (s.placeId === placeId) stop = s;
      });
      if (stop) {
        setTimeout(function () {
          var node = U.qs('#stop-' + stop.id);
          if (node) {
            node.scrollIntoView({ block: 'center', behavior: 'smooth' });
            node.classList.add('is-focused');
            setTimeout(function () { node.classList.remove('is-focused'); }, 1600);
          }
        }, 60);
      }
    });

    U.qsa('.rail__btn[data-view]').forEach(function (b) {
      b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
    });

    U.qs('#btnAddDay').addEventListener('click', function () {
      Store.addDay();
      Shell.toast('Hari ' + Store.get().days.length + ' ditambahkan.');
    });
    U.qs('#btnExportIcs').addEventListener('click', exportIcs);
    U.qs('#btnData').addEventListener('click', openDataPanel);
    U.qs('#btnMapTab').addEventListener('click', function () { toggleMap(!mapOpen); });
    U.qs('#btnCloseMap').addEventListener('click', function () { toggleMap(false); });

    Store.subscribe(function () { refresh(); });

    var startView = prefs.view && ['plan', 'explore', 'budget', 'live'].indexOf(prefs.view) >= 0
      ? prefs.view : 'plan';
    currentView = null;
    setView(startView);

    bindKeys();

    window.addEventListener('resize', U.debounce(function () { RMap.invalidate(); }, 200));

    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onScheme = function () { if ((Store.getPrefs().theme || 'auto') === 'auto') refresh(); };
      if (mq.addEventListener) mq.addEventListener('change', onScheme);
      else if (mq.addListener) mq.addListener(onScheme);
    }

    if (Store.get().liveRouting) setTimeout(function () { warmRoutes(); }, 800);

    /* Di halaman artifact peta skematik memang pilihannya, bukan
       kegagalan — jangan memunculkan peringatan untuk sesuatu yang
       normal. Legenda peta sudah menjelaskan modenya. */
    if (RMap.isFallback() && !window.RUTE_ARTIFACT) {
      setTimeout(function () {
        Shell.toast('Peta jalan tidak bisa dimuat — memakai peta skematik. Semua fitur lain tetap jalan.');
      }, 1200);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  return {
    refresh: refresh, setView: setView, warmRoutes: warmRoutes,
    exportIcs: exportIcs, toggleMap: toggleMap, openDataPanel: openDataPanel
  };
})();

</script>
