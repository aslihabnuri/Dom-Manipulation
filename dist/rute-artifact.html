    if (m >= 420 && m < 540) return 1.28;   /* 07:00-09:00 */
    if (m >= 960 && m < 1110) return 1.32;  /* 16:00-18:30 */
    if (m >= 660 && m < 780) return 1.12;   /* 11:00-13:00 */
    if (m >= 1320 || m < 300) return 0.86;  /* 22:00-05:00 lengang */
    return 1;
  }

  /**
   * Estimasi satu ruas perjalanan.
   * @returns {{km:number, minutes:number, source:'estimasi', mode:string, cost:number}}
   */
  function estimateLeg(from, to, modeId, opts) {
    opts = opts || {};
    var mode = MODES[modeId] || MODES.motor;
    var straight = haversine(from, to);
    var roadFactor = opts.roadFactor || 1.32;

    /* Jarak sangat pendek hampir selalu lurus; jarak jauh lebih
       berkelok. Faktor jalan diskalakan sedikit mengikuti itu. */
    var f = straight < 1.5 ? 1.15 : (straight > 40 ? roadFactor * 1.04 : roadFactor);
    var road = straight * f;

    var traffic = opts.ignoreTraffic ? 1 : trafficFactor(opts.departMin);
    var minutes = (road / mode.speed) * 60 * traffic + mode.overhead;

    return {
      km: road,
      minutes: Math.round(minutes),
      source: 'estimasi',
      mode: mode.id,
      cost: round500(road * (FUEL_PER_KM[mode.id] || 0))
    };
  }

  /* ---------- OSRM: rute jalan sebenarnya (opsional) ---------- */

  var CACHE_KEY = 'rute.osrm.v1';
  var cache = load();
  var inflight = {};
  var failures = 0;
  var DISABLE_AFTER = 4;

  function load() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); }
    catch (e) { return {}; }
  }

  var persist = function () {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) { /* kuota penuh */ }
  };

  function key(from, to, profile) {
    return profile + ':' +
      from.lat.toFixed(4) + ',' + from.lng.toFixed(4) + '>' +
      to.lat.toFixed(4) + ',' + to.lng.toFixed(4);
  }

  function cached(from, to, modeId) {
    var mode = MODES[modeId] || MODES.motor;
    return cache[key(from, to, mode.osrm)] || null;
  }

  /**
   * Ambil rute nyata. Selalu resolve — kegagalan jaringan
   * mengembalikan null, bukan melempar error.
   */
  function fetchLeg(from, to, modeId) {
    var mode = MODES[modeId] || MODES.motor;
    var k = key(from, to, mode.osrm);

    if (cache[k]) return Promise.resolve(cache[k]);
    if (failures >= DISABLE_AFTER) return Promise.resolve(null);
    if (inflight[k]) return inflight[k];

    var url = 'https://router.project-osrm.org/route/v1/' + mode.osrm + '/' +
      from.lng + ',' + from.lat + ';' + to.lng + ',' + to.lat +
      '?overview=full&geometries=geojson';

    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 9000);

    inflight[k] = fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) {
        if (!j.routes || !j.routes.length) throw new Error('tidak ada rute');
        var rt = j.routes[0];
        var out = {
          km: rt.distance / 1000,
          seconds: rt.duration,
          geometry: rt.geometry && rt.geometry.coordinates
            ? simplify(rt.geometry.coordinates, 140)
            : null
        };
        cache[k] = out;
        persist();
        failures = 0;
        return out;
      })
      .catch(function () { failures++; return null; })
      .then(function (res) {
        clearTimeout(timer);
        delete inflight[k];
        return res;
      });

    return inflight[k];
  }

  /** Kurangi jumlah titik garis rute supaya peta tetap ringan. */
  function simplify(coords, max) {
    if (coords.length <= max) return coords;
    var step = Math.ceil(coords.length / max);
    var out = [];
    for (var i = 0; i < coords.length; i += step) out.push(coords[i]);
    if (out[out.length - 1] !== coords[coords.length - 1]) out.push(coords[coords.length - 1]);
    return out;
  }

  /**
   * Ruas perjalanan final: pakai rute nyata kalau sudah ada di
   * cache, kalau tidak pakai estimasi.
   */
  function leg(from, to, modeId, opts) {
    opts = opts || {};
    var est = estimateLeg(from, to, modeId, opts);
    if (!opts.live) return est;

    var hit = cached(from, to, modeId);
    if (!hit) return est;

    var mode = MODES[modeId] || MODES.motor;
    var traffic = opts.ignoreTraffic ? 1 : trafficFactor(opts.departMin);
    var minutes = (hit.seconds / 60) * mode.osrmFactor * traffic + mode.overhead;

    return {
      km: hit.km,
      minutes: Math.round(minutes),
      source: 'rute',
      mode: mode.id,
      cost: round500(hit.km * (FUEL_PER_KM[mode.id] || 0)),
      geometry: hit.geometry
    };
  }

  /** Prefetch berurutan supaya tidak membanjiri server publik OSRM. */
  function warm(pairs, modeId, onProgress) {
    var i = 0, got = 0;
    function next() {
      if (i >= pairs.length || failures >= DISABLE_AFTER) {
        return Promise.resolve({ done: i, ok: got, aborted: failures >= DISABLE_AFTER });
      }
      var pr = pairs[i++];
      return fetchLeg(pr[0], pr[1], modeId).then(function (r) {
        if (r) got++;
        if (onProgress) onProgress(i, pairs.length);
        return new Promise(function (res) { setTimeout(res, 120); });
      }).then(next);
    }
    failures = 0;
    return next();
  }

  function hasLive(from, to, modeId) { return !!cached(from, to, modeId); }

  function clearCache() {
    cache = {};
    try { localStorage.removeItem(CACHE_KEY); } catch (e) { /* abaikan */ }
  }

  /** Tautan navigasi ke Google Maps untuk satu ruas. */
  function mapsDirUrl(from, to, modeId) {
    var travel = (modeId === 'jalan') ? 'walking' :
                 (modeId === 'motor') ? 'two-wheeler' : 'driving';
    return 'https://www.google.com/maps/dir/?api=1' +
      '&origin=' + from.lat + ',' + from.lng +
      '&destination=' + to.lat + ',' + to.lng +
      '&travelmode=' + travel;
  }

  function mapsPlaceUrl(place) {
    return 'https://www.google.com/maps/search/?api=1&query=' +
      encodeURIComponent(place.lat + ',' + place.lng) +
      '&query_place_id=';
  }

  /** Pusat massa sekumpulan titik. */
  function centroid(points) {
    if (!points.length) return null;
    var la = 0, ln = 0;
    points.forEach(function (p) { la += p.lat; ln += p.lng; });
    return { lat: la / points.length, lng: ln / points.length };
  }

  /** Kotak pembatas dengan sedikit ruang di tepi. */
  function bounds(points, pad) {
    if (!points.length) return null;
    var n = -90, s = 90, e = -180, w = 180;
    points.forEach(function (p) {
      n = Math.max(n, p.lat); s = Math.min(s, p.lat);
      e = Math.max(e, p.lng); w = Math.min(w, p.lng);
    });
    var padLat = Math.max((n - s) * (pad || 0.12), 0.01);
    var padLng = Math.max((e - w) * (pad || 0.12), 0.01);
    return { n: n + padLat, s: s - padLat, e: e + padLng, w: w - padLng };
  }

  return {
    MODES: MODES, MODE_ORDER: MODE_ORDER, FUEL_PER_KM: FUEL_PER_KM,
    haversine: haversine, trafficFactor: trafficFactor,
    estimateLeg: estimateLeg, leg: leg,
    fetchLeg: fetchLeg, warm: warm, hasLive: hasLive, clearCache: clearCache,
    mapsDirUrl: mapsDirUrl, mapsPlaceUrl: mapsPlaceUrl,
    centroid: centroid, bounds: bounds
  };
})();


/* ===== assets/js/lib/store.js ===== */
/* ============================================================
   Rute — state trip + penyimpanan lokal
   ------------------------------------------------------------
   Satu objek `trip` adalah sumber kebenaran. Semua perubahan
   lewat Store.update(), yang menyimpan ke localStorage dan
   memberi tahu pelanggan. Riwayat 30 langkah terakhir disimpan
   untuk urungkan.
   ============================================================ */

window.Store = (function () {
  'use strict';

  var KEY = 'rute.trip.v1';
  var PREF = 'rute.pref.v1';

  var listeners = [];
  var history = [];
  var trip = null;
  var prefs = null;

  /* ---------- bentuk data ---------- */

  function newDay(index, startIso) {
    return {
      id: U.uid('d'),
      date: startIso ? U.addDays(startIso, index) : null,
      title: '',
      start: '08:00',
      mode: 'motor',
      startFromHub: true,
      returnToHub: false,
      stops: []
    };
  }

  function newStop(place) {
    return {
      id: U.uid('s'),
      placeId: place.id,
      custom: place.custom ? place : null,
      dur: null,      /* null = pakai durasi bawaan tempat */
      cost: null,     /* null = pakai harga bawaan */
      note: '',
      locked: false   /* true = jangan digeser oleh penyusun ulang */
    };
  }

  function blankTrip(destId) {
    var dest = RUTE_DATA.byId(destId || 'jogja');
    var start = U.isoToday();
    return {
      v: 1,
      name: 'Liburan ' + dest.name,
      destId: dest.id,
      startDate: start,
      people: 2,
      budget: 0,               /* 0 = tanpa target */
      liveRouting: false,
      hub: { name: dest.hub.name, lat: dest.hub.lat, lng: dest.hub.lng },
      lodging: 0,              /* per malam, seluruh rombongan */
      days: [newDay(0, start)],
      customPlaces: [],
      activeDayId: null
    };
  }

  /* ---------- muat & simpan ---------- */

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.days && parsed.days.length) return migrate(parsed);
      }
    } catch (e) { /* data rusak — mulai bersih */ }
    return null;
  }

  function migrate(t) {
    if (!t.customPlaces) t.customPlaces = [];
    if (t.people === undefined) t.people = 2;
    if (t.lodging === undefined) t.lodging = 0;
    if (t.budget === undefined) t.budget = 0;
    if (t.liveRouting === undefined) t.liveRouting = false;
    t.days.forEach(function (d) {
      if (!d.id) d.id = U.uid('d');
      if (d.startFromHub === undefined) d.startFromHub = true;
      if (d.returnToHub === undefined) d.returnToHub = false;
      if (!d.mode) d.mode = 'motor';
      (d.stops || []).forEach(function (s) {
        if (!s.id) s.id = U.uid('s');
        if (s.locked === undefined) s.locked = false;
      });
    });
    return t;
  }

  var save = U.debounce(function () {
    try { localStorage.setItem(KEY, JSON.stringify(trip)); }
    catch (e) { /* penyimpanan penuh atau diblokir */ }
  }, 220);

  function loadPrefs() {
    try {
      var raw = localStorage.getItem(PREF);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* abaikan */ }
    return { theme: 'auto', mapScope: 'day', view: 'plan' };
  }

  function savePrefs() {
    try { localStorage.setItem(PREF, JSON.stringify(prefs)); } catch (e) { /* abaikan */ }
  }

  /* ---------- API ---------- */

  function init() {
    trip = load() || blankTrip('jogja');
    prefs = loadPrefs();
    if (!trip.activeDayId || !dayById(trip.activeDayId)) {
      trip.activeDayId = trip.days[0].id;
    }
    return trip;
  }

  function get() { return trip; }
  function getPrefs() { return prefs; }

  function setPref(k, v) {
    prefs[k] = v;
    savePrefs();
  }

  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  function emit(reason) {
    listeners.forEach(function (fn) { fn(trip, reason); });
  }

  /**
   * Mutasi terkontrol. `label` dipakai untuk urungkan.
   * `silent` melewati notifikasi (dipakai saat mengetik).
   */
  function update(label, mutator, opts) {
    opts = opts || {};
    if (!opts.noHistory) {
      history.push({ label: label, snapshot: JSON.stringify(trip) });
      if (history.length > 30) history.shift();
    }
    mutator(trip);
    save();
    if (!opts.silent) emit(label);
  }

  function canUndo() { return history.length > 0; }

  function undo() {
    var last = history.pop();
    if (!last) return null;
    trip = JSON.parse(last.snapshot);
    save();
    emit('undo');
    return last.label;
  }

  /* ---------- pembacaan turunan ---------- */

  function dest() { return RUTE_DATA.byId(trip.destId); }

  /** Semua tempat: bawaan destinasi + buatan pengguna. */
  function allPlaces() {
    return dest().places.concat(
      trip.customPlaces.filter(function (c) { return c.destId === trip.destId; })
    );
  }

  var placeIndex = null;
  var placeIndexKey = '';

  function placeById(id) {
    var k = trip.destId + ':' + trip.customPlaces.length;
    if (placeIndexKey !== k) {
      placeIndex = {};
      allPlaces().forEach(function (p) { placeIndex[p.id] = p; });
      placeIndexKey = k;
    }
    return placeIndex[id] || null;
  }

  function invalidatePlaces() { placeIndexKey = ''; }

  function dayById(id) {
    for (var i = 0; i < trip.days.length; i++) if (trip.days[i].id === id) return trip.days[i];
    return null;
  }

  function dayIndex(id) {
    for (var i = 0; i < trip.days.length; i++) if (trip.days[i].id === id) return i;
    return -1;
  }

  function activeDay() { return dayById(trip.activeDayId) || trip.days[0]; }

  /** Id tempat yang sudah masuk itinerary (untuk menandai di Jelajah). */
  function usedPlaceIds() {
    var set = {};
    trip.days.forEach(function (d) {
      d.stops.forEach(function (s) { set[s.placeId] = true; });
    });
    return set;
  }

  /* ---------- operasi umum ---------- */

  function setActiveDay(id) {
    if (trip.activeDayId === id) return;
    update('pindah hari', function (t) { t.activeDayId = id; }, { noHistory: true });
  }

  function addDay() {
    update('tambah hari', function (t) {
      var d = newDay(t.days.length, t.startDate);
      t.days.push(d);
      t.activeDayId = d.id;
    });
  }

  function removeDay(id) {
    if (trip.days.length <= 1) return false;
    update('hapus hari', function (t) {
      var i = dayIndex(id);
      t.days.splice(i, 1);
      resyncDates(t);
      if (t.activeDayId === id) t.activeDayId = t.days[Math.min(i, t.days.length - 1)].id;
    });
    return true;
  }

  function resyncDates(t) {
    if (!t.startDate) return;
    t.days.forEach(function (d, i) { d.date = U.addDays(t.startDate, i); });
  }

  function addStop(dayId, place, atIndex) {
    update('tambah tempat', function (t) {
      var d = dayById(dayId) || activeDay();
      var s = newStop(place);
      if (atIndex === undefined || atIndex === null || atIndex >= d.stops.length) d.stops.push(s);
      else d.stops.splice(atIndex, 0, s);
    });
  }

  function removeStop(dayId, stopId) {
    update('hapus tempat', function () {
      var d = dayById(dayId);
      if (!d) return;
      d.stops = d.stops.filter(function (s) { return s.id !== stopId; });
    });
  }

  function moveStop(dayId, stopId, delta) {
    update('geser urutan', function () {
      var d = dayById(dayId);
      if (!d) return;
      var i = -1;
      d.stops.forEach(function (s, idx) { if (s.id === stopId) i = idx; });
      var j = i + delta;
      if (i < 0 || j < 0 || j >= d.stops.length) return;
      var tmp = d.stops[i];
      d.stops[i] = d.stops[j];
      d.stops[j] = tmp;
    });
  }

  function moveStopToDay(fromDayId, stopId, toDayId) {
    update('pindah hari', function () {
      var from = dayById(fromDayId), to = dayById(toDayId);
      if (!from || !to) return;
      var idx = -1;
      from.stops.forEach(function (s, i) { if (s.id === stopId) idx = i; });
      if (idx < 0) return;
      to.stops.push(from.stops.splice(idx, 1)[0]);
    });
  }

  function addCustomPlace(data) {
    var place = {
      id: U.uid('cp'),
      destId: trip.destId,
      custom: true,
      name: data.name,
      area: data.area || 'Tempat sendiri',
      lat: Number(data.lat),
      lng: Number(data.lng),
      cat: data.cat || 'kota',
      cost: Number(data.cost) || 0,
      extra: 0,
      costNote: '',
      dur: Number(data.dur) || 60,
      open: data.open || null,
      close: data.close || null,
      tags: [],
      rating: 0,
      why: data.why || '',
      tip: ''
    };
    update('tambah tempat sendiri', function (t) {
      t.customPlaces.push(place);
      invalidatePlaces();
    });
    return place;
  }

  function replaceTrip(next) {
    update('muat trip', function () { /* placeholder */ });
    trip = migrate(next);
    if (!trip.activeDayId || !dayById(trip.activeDayId)) trip.activeDayId = trip.days[0].id;
    invalidatePlaces();
    save();
    emit('replace');
  }

  function reset(destId) {
    update('mulai ulang', function () { /* placeholder */ });
    trip = blankTrip(destId || trip.destId);
    invalidatePlaces();
    save();
    emit('reset');
  }

  function exportJson() {
    return JSON.stringify(trip, null, 2);
  }

  return {
    init: init, get: get, update: update, subscribe: subscribe,
    getPrefs: getPrefs, setPref: setPref,
    canUndo: canUndo, undo: undo,
    dest: dest, allPlaces: allPlaces, placeById: placeById, invalidatePlaces: invalidatePlaces,
    dayById: dayById, dayIndex: dayIndex, activeDay: activeDay, usedPlaceIds: usedPlaceIds,
    setActiveDay: setActiveDay, addDay: addDay, removeDay: removeDay, resyncDates: resyncDates,
    addStop: addStop, removeStop: removeStop, moveStop: moveStop, moveStopToDay: moveStopToDay,
    addCustomPlace: addCustomPlace, newDay: newDay, newStop: newStop,
    replaceTrip: replaceTrip, reset: reset, exportJson: exportJson, blankTrip: blankTrip
  };
})();


/* ===== assets/js/lib/schedule.js ===== */
/* ============================================================
   Rute — mesin jadwal
   ------------------------------------------------------------
   Menghitung satu hari menjadi rangkaian: berangkat -> ruas
   perjalanan -> kunjungan -> ruas -> kunjungan -> selesai.
   Semua jam mengalir dari satu jam berangkat, jadi mengubah
   urutan atau durasi langsung menggeser sisa hari.

   Selain jam, mesin ini juga menandai masalah yang biasanya
   baru ketahuan di lapangan: tiba setelah tempat tutup, spot
   sunset dijadwalkan tengah hari, atau hari yang isinya 15 jam.
   ============================================================ */

window.Schedule = (function () {
  'use strict';

  var LATE_END = 22 * 60;      /* hari selesai lewat jam ini = terlalu malam */
  var LONG_DAY = 13 * 60;      /* durasi total sejak berangkat */
  var LONG_LEG = 95;           /* satu ruas dianggap jauh */

  /**
   * @param {object} day
   * @param {object} ctx { trip, dest, live, people }
   * @returns {object} hasil terhitung
   */
  function computeDay(day, ctx) {
    var trip = ctx.trip;
    var dest = ctx.dest;
    var people = Math.max(1, Number(trip.people) || 1);
    var hub = trip.hub;
    var mode = day.mode || 'motor';
    var legOpts = { roadFactor: dest.roadFactor, live: !!trip.liveRouting };

    var startMin = U.toMin(day.start);
    if (startMin === null) startMin = 8 * 60;

    var items = [];          /* {type:'leg'|'stop', ...} berurutan */
    var flags = [];          /* peringatan tingkat hari */
    var cursor = startMin;
    var prevPoint = day.startFromHub ? hub : null;
    var travelMin = 0, travelKm = 0, travelCost = 0;
    var visitMin = 0;
    var cost = { tiket: 0, makan: 0, belanja: 0, aktivitas: 0, transport: 0, lain: 0 };
    var liveLegs = 0, totalLegs = 0;

    day.stops.forEach(function (stop, i) {
      var place = stop.custom || Store.placeById(stop.placeId);
      if (!place) return;

      /* --- ruas menuju tempat ini --- */
      var legInfo = null;
      if (prevPoint) {
        legOpts.departMin = cursor;
        legInfo = Geo.leg(prevPoint, place, mode, legOpts);
        cursor += legInfo.minutes;
        travelMin += legInfo.minutes;
        travelKm += legInfo.km;
        travelCost += legInfo.cost;
        totalLegs++;
        if (legInfo.source === 'rute') liveLegs++;

        items.push({
          type: 'leg',
          from: prevPoint,
          to: place,
          mode: mode,
          km: legInfo.km,
          minutes: legInfo.minutes,
          source: legInfo.source,
          cost: legInfo.cost,
          far: legInfo.minutes >= LONG_LEG
        });
      }

      /* --- kunjungan --- */
      var arrive = cursor;
      var wait = 0;
      var openMin = U.toMin(place.open);
      var closeMin = U.toMin(place.close);
      var stopFlags = [];

      if (openMin !== null && arrive < openMin) {
        wait = openMin - arrive;
        arrive = openMin;
        if (wait >= 15) {
          stopFlags.push({
            level: 'info',
            text: 'Tiba ' + U.dur(wait) + ' sebelum buka (' + place.open + '). Jadwal sudah disesuaikan ke jam buka.'
          });
        }
      }

      var visit = stop.dur !== null && stop.dur !== undefined ? Number(stop.dur) : place.dur;
      visit = Math.max(5, visit || 60);
      var depart = arrive + visit;

      if (closeMin !== null) {
        if (arrive >= closeMin) {
          stopFlags.push({
            level: 'alert',
            text: 'Sampai jam ' + U.toHHMM(arrive) + ' padahal tutup jam ' + place.close +
                  '. Majukan jam berangkat atau pindahkan ke hari lain.'
          });
        } else if (depart > closeMin) {
          stopFlags.push({
            level: 'warn',
            text: 'Hanya kebagian ' + U.dur(closeMin - arrive) + ' sebelum tutup jam ' + place.close + '.'
          });
        }
      }

      /* --- kecocokan waktu terbaik --- */
      var tags = place.tags || [];
      if (tags.indexOf('sunrise') >= 0 && arrive > 7 * 60 + 30) {
        stopFlags.push({ level: 'warn', text: 'Tempat ini soal matahari terbit — dijadwalkan jam ' + U.toHHMM(arrive) + ', momennya sudah lewat.' });
      }
      if (tags.indexOf('sunset') >= 0 && depart < 16 * 60 + 30) {
        stopFlags.push({ level: 'warn', text: 'Nilai jualnya matahari terbenam, tapi kamu sudah pergi jam ' + U.toHHMM(depart) + '.' });
      }
      if (tags.indexOf('malam') >= 0 && depart < 18 * 60) {
        stopFlags.push({ level: 'info', text: 'Suasananya baru hidup setelah gelap. Pertimbangkan geser ke malam.' });
      }

      /* --- biaya --- */
      var perPerson = stop.cost !== null && stop.cost !== undefined
        ? Number(stop.cost) : (place.cost || 0);
      var group = place.extra || 0;
      var stopCost = perPerson * people + group;
      var bucket = (RUTE_DATA.CATEGORIES[place.cat] || {}).costGroup || 'lain';
      cost[bucket] = (cost[bucket] || 0) + stopCost;

      visitMin += visit;
      cursor = depart;
      prevPoint = place;

      items.push({
        type: 'stop',
        index: i,
        stop: stop,
        place: place,
        arrive: arrive,
        depart: depart,
        visit: visit,
        wait: wait,
        perPerson: perPerson,
        group: group,
        cost: stopCost,
        flags: stopFlags
      });
    });

    /* --- pulang ke penginapan --- */
    if (day.returnToHub && prevPoint && day.stops.length) {
      legOpts.departMin = cursor;
      var back = Geo.leg(prevPoint, hub, mode, legOpts);
      cursor += back.minutes;
      travelMin += back.minutes;
      travelKm += back.km;
      travelCost += back.cost;
      totalLegs++;
      if (back.source === 'rute') liveLegs++;
      items.push({
        type: 'leg', from: prevPoint, to: hub, mode: mode,
        km: back.km, minutes: back.minutes, source: back.source,
        cost: back.cost, far: back.minutes >= LONG_LEG, isReturn: true
      });
    }

    cost.transport = travelCost;

    var endMin = cursor;
    var totalMin = endMin - startMin;

    /* --- peringatan tingkat hari --- */
    if (day.stops.length) {
      if (endMin >= LATE_END) {
        flags.push({
          level: endMin >= 24 * 60 ? 'alert' : 'warn',
          text: endMin >= 24 * 60
            ? 'Hari ini baru selesai jam ' + U.toHHMMDay(endMin) + '. Terlalu padat — kurangi tempat atau pecah jadi dua hari.'
            : 'Hari ini baru selesai jam ' + U.toHHMM(endMin) + '. Cukup larut.'
        });
      }
      if (totalMin > LONG_DAY) {
        flags.push({ level: 'warn', text: 'Total ' + U.dur(totalMin) + ' di jalan dan di lokasi. Hari yang panjang.' });
      }
      if (travelMin > visitMin && day.stops.length > 1) {
        flags.push({
          level: 'warn',
          text: 'Waktu di jalan (' + U.dur(travelMin) + ') melebihi waktu menikmati tempatnya (' + U.dur(visitMin) + ').'
        });
      }
    }

    var subtotal = 0;
    Object.keys(cost).forEach(function (k) { subtotal += cost[k]; });

    return {
      day: day,
      items: items,
      flags: flags,
      startMin: startMin,
      endMin: endMin,
      totalMin: totalMin,
      travelMin: travelMin,
      travelKm: travelKm,
      visitMin: visitMin,
      cost: cost,
      subtotal: subtotal,
      stopCount: day.stops.length,
      liveLegs: liveLegs,
      totalLegs: totalLegs,
      worst: worstLevel(flags, items)
    };
  }

  function worstLevel(flags, items) {
    var level = null;
    function bump(l) {
      if (l === 'alert') level = 'alert';
      else if (l === 'warn' && level !== 'alert') level = 'warn';
    }
    flags.forEach(function (f) { bump(f.level); });
    items.forEach(function (it) {
      if (it.type === 'stop') it.flags.forEach(function (f) { bump(f.level); });
    });
    return level;
  }

  /** Hitung seluruh trip. */
  function computeTrip(trip) {
    var dest = RUTE_DATA.byId(trip.destId);
    var ctx = { trip: trip, dest: dest };
    var days = trip.days.map(function (d) { return computeDay(d, ctx); });

    var total = { tiket: 0, makan: 0, belanja: 0, aktivitas: 0, transport: 0, lain: 0, penginapan: 0 };
    var travelKm = 0, travelMin = 0, visitMin = 0, stops = 0, liveLegs = 0, totalLegs = 0;

    days.forEach(function (d) {
      Object.keys(d.cost).forEach(function (k) { total[k] = (total[k] || 0) + d.cost[k]; });
      travelKm += d.travelKm;
      travelMin += d.travelMin;
      visitMin += d.visitMin;
      stops += d.stopCount;
      liveLegs += d.liveLegs;
      totalLegs += d.totalLegs;
    });

    /* Penginapan dihitung per malam = jumlah hari - 1, minimal 0. */
    var nights = Math.max(0, trip.days.length - 1);
    total.penginapan = (Number(trip.lodging) || 0) * nights;

    var grand = 0;
    Object.keys(total).forEach(function (k) { grand += total[k]; });

    var people = Math.max(1, Number(trip.people) || 1);

    return {
      days: days,
      cost: total,
      grand: grand,
      perPerson: grand / people,
      nights: nights,
      travelKm: travelKm,
      travelMin: travelMin,
      visitMin: visitMin,
      stops: stops,
      liveLegs: liveLegs,
      totalLegs: totalLegs,
      overBudget: trip.budget > 0 && grand > trip.budget * people
    };
  }

  var COST_LABELS = {
    tiket: 'Tiket masuk',
    makan: 'Makan',
    transport: 'Transport',
    aktivitas: 'Aktivitas',
    belanja: 'Oleh-oleh',
    penginapan: 'Penginapan',
    lain: 'Lain-lain'
  };

  /** Pasangan titik yang perlu dirutekan — untuk prefetch OSRM. */
  function legPairs(trip) {
    var pairs = [];
    trip.days.forEach(function (day) {
      var prev = day.startFromHub ? trip.hub : null;
      day.stops.forEach(function (s) {
        var pl = s.custom || Store.placeById(s.placeId);
        if (!pl) return;
        if (prev) pairs.push([{ lat: prev.lat, lng: prev.lng }, { lat: pl.lat, lng: pl.lng }, day.mode]);
        prev = pl;
      });
      if (day.returnToHub && prev && day.stops.length) {
        pairs.push([{ lat: prev.lat, lng: prev.lng }, { lat: trip.hub.lat, lng: trip.hub.lng }, day.mode]);
      }
    });
    return pairs;
  }

  return {
    computeDay: computeDay,
    computeTrip: computeTrip,
    legPairs: legPairs,
    COST_LABELS: COST_LABELS,
    LATE_END: LATE_END
  };
})();


/* ===== assets/js/lib/planner.js ===== */
/* ============================================================
   Rute — penyusun itinerary otomatis
   ------------------------------------------------------------
   Empat langkah:

   1. SKOR    tiap tempat dinilai dari kecocokan minat, rating,
              status ikonik, dan kepatuhan pada batas biaya.
   2. KELOMPOK tempat terpilih dikelompokkan secara geografis
              dengan k-means (k = jumlah hari), supaya satu hari
              tidak melompat dari pantai selatan ke Borobudur.
   3. URUT    tiap kelompok diurutkan dengan nearest-neighbour
              lalu diperbaiki 2-opt, dimulai dari penginapan.
   4. ISI     tempat dimasukkan sampai jatah waktu hari itu habis,
              dengan menghormati jam buka dan waktu terbaik.

   k-means memakai pengacak berbenih tetap, jadi hasil untuk
   masukan yang sama selalu sama — bukan lotre tiap klik.
   ============================================================ */

window.Planner = (function () {
  'use strict';

  var PACE = {
    santai:  { label: 'Santai',  minutes: 7 * 60,  maxStops: 3, note: 'bangun siang, tidak buru-buru' },
    sedang:  { label: 'Sedang',  minutes: 9 * 60,  maxStops: 5, note: 'ritme wajar' },
    padat:   { label: 'Padat',   minutes: 11 * 60, maxStops: 7, note: 'kejar sebanyak mungkin' }
  };

  /* Pengacak berbenih: hasil deterministik untuk masukan sama. */
  function rng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /* ---------- 1. skor ---------- */

  function scorePlace(place, opts) {
    var interests = opts.interests || [];
    var s = 0;

    var hits = 0;
    (place.tags || []).forEach(function (t) {
      if (interests.indexOf(t) >= 0) hits++;
    });
    s += hits * 26;

    /* Tanpa minat terpilih, andalkan rating dan status ikonik. */
    if (!interests.length) s += 18;

    s += (place.rating || 4) * 9;
    if ((place.tags || []).indexOf('ikonik') >= 0) s += 14;

    /* Hormati batas biaya: mahal tidak dilarang, hanya dikurangi. */
    var perHead = place.cost || 0;
    if (opts.maxPerPlace > 0 && perHead > opts.maxPerPlace) {
      var over = perHead / opts.maxPerPlace;
      s -= Math.min(60, (over - 1) * 34);
    }

    /* Tempat yang nilainya ada di matahari terbit percuma dipilih
       kalau jam berangkatnya sudah siang — kecuali memang diminta. */
    if ((place.tags || []).indexOf('sunrise') >= 0 &&
        opts.startMin > 6 * 60 + 30 && interests.indexOf('sunrise') < 0) {
      s -= 45;
    }

    /* Yang makan waktu sangat lama sulit dipasangkan. */
    if (place.dur >= 210) s -= 8;

    /* Kuliner perlu ada, tapi tidak boleh mendominasi. */
    if (place.cat === 'kuliner' && interests.indexOf('kuliner') < 0) s -= 12;
    if (place.cat === 'belanja' && interests.indexOf('belanja') < 0) s -= 14;

    return s;
  }

  /* ---------- 2. kelompok geografis ---------- */

  function kmeans(points, k, seed) {
    if (points.length <= k) {
      return points.map(function (p) { return [p]; });
    }
    var rand = rng(seed || 7);

    /* k-means++ ringan: benih pertama acak, sisanya yang terjauh. */
    var centers = [pick(points, Math.floor(rand() * points.length))];
    while (centers.length < k) {
      var best = null, bestD = -1;
      points.forEach(function (p) {
        var d = Math.min.apply(null, centers.map(function (c) { return Geo.haversine(p, c); }));
        if (d > bestD) { bestD = d; best = p; }
      });
      centers.push({ lat: best.lat, lng: best.lng });
    }

    var assign = new Array(points.length).fill(0);
    for (var iter = 0; iter < 40; iter++) {
      var moved = false;
      points.forEach(function (p, i) {
        var bi = 0, bd = Infinity;
        centers.forEach(function (c, ci) {
          var d = Geo.haversine(p, c);
          if (d < bd) { bd = d; bi = ci; }
        });
        if (assign[i] !== bi) { assign[i] = bi; moved = true; }
      });
      centers = centers.map(function (c, ci) {
        var members = points.filter(function (_, i) { return assign[i] === ci; });
        return members.length ? Geo.centroid(members) : c;
      });
      if (!moved) break;
    }

    balance(points, assign, centers, k);

    var groups = [];
    for (var g = 0; g < k; g++) groups.push([]);
    points.forEach(function (p, i) { groups[assign[i]].push(p); });
    return groups;
  }

  /**
   * k-means murni sering menghasilkan satu kelompok gemuk dan satu
   * kelompok berisi satu titik — yang berarti satu hari penuh dan
   * satu hari nyaris kosong. Di sini kelebihan anggota dipindahkan
   * ke kelompok terdekat yang masih longgar, memilih anggota yang
   * paling murah dipindahkan.
   */
  function balance(points, assign, centers, k) {
    var cap = Math.ceil(points.length / k);
    var counts = new Array(k).fill(0);
    assign.forEach(function (a) { counts[a]++; });

    var guard = 0;
    while (guard++ < 300) {
      var over = -1;
      for (var i = 0; i < k; i++) if (counts[i] > cap) { over = i; break; }
      if (over < 0) break;

      var bestIdx = -1, bestTo = -1, bestCost = Infinity;
      points.forEach(function (p, idx) {
        if (assign[idx] !== over) return;
        var here = Geo.haversine(p, centers[over]);
        for (var c = 0; c < k; c++) {
          if (c === over || counts[c] >= cap) continue;
          var cost = Geo.haversine(p, centers[c]) - here;
          if (cost < bestCost) { bestCost = cost; bestIdx = idx; bestTo = c; }
        }
      });

      if (bestIdx < 0) break;
      counts[assign[bestIdx]]--;
      assign[bestIdx] = bestTo;
      counts[bestTo]++;
    }
  }

  function pick(arr, i) { return { lat: arr[i].lat, lng: arr[i].lng }; }

  /* ---------- 3. urutan rute ---------- */

  function orderRoute(places, origin, roadFactor) {
    if (places.length <= 2) return places.slice();

    var remaining = places.slice();
    var route = [];
    var cur = origin;

    while (remaining.length) {
      var bi = 0, bd = Infinity;
      remaining.forEach(function (p, i) {
        var d = Geo.haversine(cur, p);
        if (d < bd) { bd = d; bi = i; }
      });
      cur = remaining[bi];
      route.push(cur);
      remaining.splice(bi, 1);
    }

    /* 2-opt: buang persilangan yang tersisa dari nearest-neighbour. */
    var improved = true, guard = 0;
    while (improved && guard++ < 60) {
      improved = false;
      for (var i = 0; i < route.length - 1; i++) {
        for (var j = i + 1; j < route.length; j++) {
          var a = i === 0 ? origin : route[i - 1];
          var b = route[i];
          var c = route[j];
          var d = route[j + 1];
          var before = Geo.haversine(a, b) + (d ? Geo.haversine(c, d) : 0);
          var after = Geo.haversine(a, c) + (d ? Geo.haversine(b, d) : 0);
          if (after < before - 0.0001) {
            var seg = route.slice(i, j + 1).reverse();
            Array.prototype.splice.apply(route, [i, seg.length].concat(seg));
            improved = true;
          }
        }
      }
    }
    return route;
  }

  /* ---------- 4. isi hari ---------- */

  /**
   * Urutkan satu hari dengan dua batasan sekaligus: waktu terbaik
   * tiap tempat (sunrise di depan, sunset/malam di belakang) DAN
   * jarak tempuh sependek mungkin.
   *
   * Kuncinya adalah merutekan tiap kelompok waktu dari posisi
   * terakhir kelompok sebelumnya. Kalau ketiganya dirutekan dari
   * penginapan lalu disambung begitu saja, hasilnya rute yang
   * melompat jauh ke timur, balik ke kota, lalu ke timur lagi.
   */
  function routeWithTiming(places, origin, roadFactor) {
    var dawn = [], dusk = [], mid = [];
    places.forEach(function (p) {
      var t = p.tags || [];
      if (t.indexOf('sunrise') >= 0) dawn.push(p);
      else if (t.indexOf('malam') >= 0 || t.indexOf('sunset') >= 0) dusk.push(p);
      else mid.push(p);
    });

    var out = [];
    var cur = origin;
    [dawn, mid, dusk].forEach(function (bucket) {
      if (!bucket.length) return;
      var seg = orderRoute(bucket, cur, roadFactor);
      out = out.concat(seg);
      cur = seg[seg.length - 1];
    });
    return out;
  }

  /** Perkiraan biaya waktu satu tempat termasuk perjalanan menuju ke sana. */
  function timeCost(place, from, mode, roadFactor) {
    var leg = Geo.estimateLeg(from, place, mode, { roadFactor: roadFactor, ignoreTraffic: true });
    return leg.minutes + place.dur;
  }

  /**
   * @param {object} cfg
   *   destId, days, interests[], pace, mode, budgetPerPerson,
   *   startTime, hub, avoid[]  (id tempat yang tidak diinginkan)
   * @returns {{days: Array<{stops: Array}>, used: Array, dropped: number}}
   */
  function generate(cfg) {
    var dest = RUTE_DATA.byId(cfg.destId);
    var pace = PACE[cfg.pace] || PACE.sedang;
    var dayCount = Math.max(1, cfg.days || 3);
    var mode = cfg.mode || 'motor';
    var hub = cfg.hub || dest.hub;
    var avoid = cfg.avoid || [];

    /* Jatah biaya kasar per tempat, dipakai untuk memberi skor. */
    var slots = dayCount * pace.maxStops;
    var maxPerPlace = cfg.budgetPerPerson > 0
      ? (cfg.budgetPerPerson * 0.55) / Math.max(1, slots) * 2.2
      : 0;

    var scored = dest.places
      .filter(function (p) { return avoid.indexOf(p.id) < 0; })
      .map(function (p) {
        return { place: p, score: scorePlace(p, {
          interests: cfg.interests, maxPerPlace: maxPerPlace, startMin: U.toMin(cfg.startTime || '08:00')
        }) };
      })
      .sort(function (a, b) { return b.score - a.score; });

    /* Ambil kandidat sedikit lebih banyak dari kebutuhan supaya
       pengelompokan punya ruang gerak, lalu buang yang skornya
       jauh di bawah rata-rata. */
    var want = Math.min(scored.length, Math.ceil(slots * 1.7));
    var candidates = scored.slice(0, want).map(function (s) { return s.place; });

    if (!candidates.length) return { days: [], used: [], dropped: 0 };

    var groups = kmeans(candidates, dayCount, 11);

    /* Kelompok yang lebih jauh dari penginapan ditaruh di tengah
       trip; hari pertama dan terakhir biasanya terpotong perjalanan. */
    groups = groups
      .filter(function (g) { return g.length; })
      .map(function (g) {
        var c = Geo.centroid(g);
        return { places: g, dist: Geo.haversine(hub, c), centroid: c };
      })
      .sort(function (a, b) { return a.dist - b.dist; });

    var ordered = arrangeDays(groups, dayCount);

    var startMin = U.toMin(cfg.startTime || '08:00');
    var out = [];
    var used = [];
    var dropped = 0;

    ordered.forEach(function (group) {
      if (!group) { out.push({ stops: [] }); return; }

      var route = routeWithTiming(group.places, hub, dest.roadFactor);
      var budgetMin = pace.minutes;
      var spent = 0;
      var from = hub;
      var stops = [];

      for (var i = 0; i < route.length; i++) {
        var place = route[i];
        if (stops.length >= pace.maxStops) { dropped++; continue; }

        var need = timeCost(place, from, mode, dest.roadFactor);

        /* Jangan mulai kunjungan setelah tempatnya tutup. */
        var closeMin = U.toMin(place.close);
        var arriveApprox = startMin + spent + (need - place.dur);
        if (closeMin !== null && arriveApprox >= closeMin) { dropped++; continue; }

        if (spent + need > budgetMin && stops.length >= 2) { dropped++; continue; }

        stops.push(place);
        used.push(place.id);
        spent += need;
        from = place;
      }

      out.push({ stops: stops });
    });

    return { days: out, used: used, dropped: dropped, pace: pace };
  }

  /**
   * Sebarkan kelompok ke hari: yang terdekat dari penginapan di
   * hari pertama dan terakhir, yang terjauh di tengah.
   */
  function arrangeDays(groups, dayCount) {
    var slotsOrder = [];
    var lo = 0, hi = dayCount - 1;
    /* Urutan pengisian: 0, n-1, 1, n-2, ... */
    while (lo <= hi) {
      slotsOrder.push(lo);
      if (lo !== hi) slotsOrder.push(hi);
      lo++; hi--;
    }
    var out = new Array(dayCount).fill(null);
    groups.forEach(function (g, i) {
      var slot = slotsOrder[i];
      if (slot !== undefined) out[slot] = g;
    });
    return out;
  }

  /**
   * Rekomendasi tambahan: tempat bagus yang belum masuk itinerary,
   * diurutkan dari yang paling dekat dengan rute hari aktif.
   */
  function suggestFor(day, trip, limit) {
    var dest = RUTE_DATA.byId(trip.destId);
    var usedIds = Store.usedPlaceIds();
    var anchor = null;

    if (day.stops.length) {
      var pts = day.stops.map(function (s) {
        return s.custom || Store.placeById(s.placeId);
      }).filter(Boolean);
      anchor = Geo.centroid(pts);
    } else {
      anchor = trip.hub;
    }

    return dest.places
      .filter(function (p) { return !usedIds[p.id]; })
      .map(function (p) {
        var d = Geo.haversine(anchor, p);
        return { place: p, dist: d, score: (p.rating || 4) * 10 - d * 1.6 };
      })
      .sort(function (a, b) { return b.score - a.score; })
      .slice(0, limit || 4);
  }

  /**
   * Susun ulang urutan satu hari yang sudah ada supaya jarak
   * tempuhnya minimal — tanpa menambah atau membuang tempat.
   */
  function optimiseDay(day, trip) {
    var dest = RUTE_DATA.byId(trip.destId);
    var places = day.stops.map(function (s) {
      return { stop: s, place: s.custom || Store.placeById(s.placeId) };
    }).filter(function (x) { return x.place; });

    if (places.length < 3) return null;

    var locked = places.filter(function (x) { return x.stop.locked; });
    var free = places.filter(function (x) { return !x.stop.locked; });
    if (free.length < 2) return null;

    var origin = day.startFromHub ? trip.hub : free[0].place;
    var route = routeWithTiming(free.map(function (x) { return x.place; }), origin, dest.roadFactor);

    var byId = {};
    free.forEach(function (x) { byId[x.place.id] = x.stop; });
    var reordered = route.map(function (p) { return byId[p.id]; });

    /* Kembalikan tempat yang dikunci ke posisi semula. */
    var result = [];
    var fi = 0;
    places.forEach(function (x, i) {
      if (x.stop.locked) result[i] = x.stop;
    });
    for (var i = 0; i < places.length; i++) {
      if (!result[i]) result[i] = reordered[fi++];
    }
    return result.filter(Boolean);
  }

  return {
    PACE: PACE,
    generate: generate,
    suggestFor: suggestFor,
    optimiseDay: optimiseDay,
    scorePlace: scorePlace,
    orderRoute: orderRoute
  };
})();


/* ===== assets/js/lib/calendar.js ===== */
/* ============================================================
   Rute — ekspor kalender
   ------------------------------------------------------------
   Dua jalur, keduanya tanpa login dan tanpa server:

   1. Tautan "Tambah ke Google Calendar" per aktivitas.
   2. Berkas .ics berisi seluruh trip, bisa diimpor sekali jalan
      ke Google Calendar, Apple Calendar, atau Outlook.

   Zona waktu ditulis eksplisit sebagai UTC (akhiran Z) dari jam
   lokal destinasi, jadi jamnya tetap benar walau ponsel sedang
   memakai zona lain.
   ============================================================ */

window.Cal = (function () {
  'use strict';

  /* Zona waktu per destinasi. Indonesia punya tiga. */
  var TZ = {
    jogja:   { offset: 7, name: 'Asia/Jakarta' },
    bandung: { offset: 7, name: 'Asia/Jakarta' },
    bali:    { offset: 8, name: 'Asia/Makassar' },
    bromo:   { offset: 7, name: 'Asia/Jakarta' }
  };

  function tzFor(destId) { return TZ[destId] || TZ.jogja; }

  /**
   * Ubah tanggal ISO + menit lokal menjadi cap waktu UTC gaya iCal.
   * Menit boleh melebihi 1440 (kegiatan yang lewat tengah malam).
   */
  function stampUTC(iso, minutes, offsetHours) {
    var base = U.parseIso(iso);
    if (!base) return null;
    var utcMs = Date.UTC(
      base.getFullYear(), base.getMonth(), base.getDate(), 0, 0, 0
    ) + (minutes - offsetHours * 60) * 60000;
    var d = new Date(utcMs);
    return d.getUTCFullYear() +
      pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
      pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /** Escape sesuai RFC 5545. */
  function esc(s) {
    return String(s || '')
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  }

  /** Baris iCal maksimal 75 oktet; sisanya dilipat dengan spasi. */
  function fold(line) {
    if (line.length <= 73) return line;
    var out = line.slice(0, 73);
    var rest = line.slice(73);
    while (rest.length > 72) {
      out += '\r\n ' + rest.slice(0, 72);
      rest = rest.slice(72);
    }
    return out + (rest.length ? '\r\n ' + rest : '');
  }

  /** Kumpulkan semua kegiatan terjadwal dari hasil hitung trip. */
  function collect(trip, computed) {
    var events = [];
    computed.days.forEach(function (dc, di) {
      var day = dc.day;
      if (!day.date) return;
      dc.items.forEach(function (it) {
        if (it.type !== 'stop') return;
        events.push({
          dayIndex: di,
          date: day.date,
          start: it.arrive,
          end: it.depart,
          place: it.place,
          stop: it.stop,
          cost: it.cost,
          dayTitle: day.title || ('Hari ' + (di + 1))
        });
      });
    });
    return events;
  }

  function describe(ev, trip) {
    var lines = [];
    if (ev.place.why) lines.push(ev.place.why);
    if (ev.place.tip) lines.push('Catatan: ' + ev.place.tip);
    if (ev.stop && ev.stop.note) lines.push('Catatanmu: ' + ev.stop.note);
    lines.push('');
    lines.push('Perkiraan biaya: ' + U.rupiah(ev.cost) + ' untuk ' + trip.people + ' orang');
    if (ev.place.open && ev.place.close) lines.push('Jam buka: ' + ev.place.open + '–' + ev.place.close);
    lines.push('Peta: https://www.google.com/maps/search/?api=1&query=' + ev.place.lat + ',' + ev.place.lng);
    lines.push('');
    lines.push('Dibuat dengan Rute — ' + trip.name);
    return lines.join('\n');
  }

  /** Berkas .ics untuk seluruh trip. */
  function buildIcs(trip, computed) {
    var tz = tzFor(trip.destId);
    var events = collect(trip, computed);
    var now = stampUTC(U.isoToday(), new Date().getHours() * 60 + new Date().getMinutes(), tz.offset);

    var out = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Rute//Perencana Itinerary//ID',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'X-WR-CALNAME:' + esc(trip.name),
      'X-WR-TIMEZONE:' + tz.name
    ];

    events.forEach(function (ev, i) {
      var dtStart = stampUTC(ev.date, ev.start, tz.offset);
      var dtEnd = stampUTC(ev.date, ev.end, tz.offset);
      if (!dtStart || !dtEnd) return;

      out.push('BEGIN:VEVENT');
      out.push('UID:' + (ev.stop ? ev.stop.id : 'ev' + i) + '@rute.local');
      out.push('DTSTAMP:' + now);
      out.push('DTSTART:' + dtStart);
      out.push('DTEND:' + dtEnd);
      out.push(fold('SUMMARY:' + esc(ev.place.name)));
      out.push(fold('LOCATION:' + esc(ev.place.name + ', ' + ev.place.area)));
      out.push(fold('DESCRIPTION:' + esc(describe(ev, trip))));
      out.push('GEO:' + ev.place.lat + ';' + ev.place.lng);
      out.push('CATEGORIES:' + esc(ev.dayTitle));
      out.push('BEGIN:VALARM');
      out.push('TRIGGER:-PT30M');
      out.push('ACTION:DISPLAY');
      out.push(fold('DESCRIPTION:' + esc('30 menit lagi: ' + ev.place.name)));
      out.push('END:VALARM');
      out.push('END:VEVENT');
    });

    out.push('END:VCALENDAR');
    return out.join('\r\n');
  }

  /** Tautan "Tambah ke Google Calendar" untuk satu kegiatan. */
  function googleUrl(ev, trip) {
    var tz = tzFor(trip.destId);
    var s = stampUTC(ev.date, ev.start, tz.offset);
    var e = stampUTC(ev.date, ev.end, tz.offset);
    if (!s || !e) return null;

    var params = [
      'action=TEMPLATE',
      'text=' + encodeURIComponent(ev.place.name),
      'dates=' + s + '/' + e,
      'details=' + encodeURIComponent(describe(ev, trip)),
      'location=' + encodeURIComponent(ev.place.name + ', ' + ev.place.area),
      'ctz=' + encodeURIComponent(tz.name)
    ];
    return 'https://calendar.google.com/calendar/render?' + params.join('&');
  }

  /**
   * Menyimpan berkas. Di halaman biasa lewat blob URL; di halaman
   * artifact lewat kapabilitas unduhan, yang meminta persetujuan
   * pembaca dan hanya menerima daftar ekstensi tertentu — .ics tidak
   * termasuk, jadi di sana ia disimpan sebagai .txt.
   *
   * @returns {Promise<{via:string, filename:string}>}
   *          ditolak dengan {code, message} kalau gagal.
   */
  function download(filename, text, mime) {
    if (window.RUTE_ARTIFACT && window.claude && typeof window.claude.use === 'function') {
      return window.claude.use('downloads').then(function (dl) {
        if (!dl) return blobDownload(filename, text, mime);
        var safe = filename.replace(/\.ics$/i, '.txt');
        return dl.save({ filename: safe, data: text }).then(function () {
          return { via: 'capability', filename: safe };
        });
      });
    }
    return blobDownload(filename, text, mime);
  }

  function blobDownload(filename, text, mime) {
    var blob = new Blob([text], { type: (mime || 'text/calendar') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    return Promise.resolve({ via: 'blob', filename: filename });
  }

  function slug(s) {
    return U.deburr(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'trip';
  }

  return {
    buildIcs: buildIcs,
    googleUrl: googleUrl,
    collect: collect,
    download: download,
    slug: slug,
    tzFor: tzFor
  };
})();


/* ===== assets/js/lib/charts.js ===== */
/* ============================================================
   Rute — grafik biaya
   ------------------------------------------------------------
   Pekerjaan datanya adalah membandingkan besaran antar kategori
   dan antar hari. Itu tugas batang, bukan donat: satu warna,
   panjang batang yang membawa arti, dan angka tertulis di
   sebelahnya sehingga warna tidak pernah jadi satu-satunya
   kanal informasi.
   ============================================================ */

window.Charts = (function () {
  'use strict';

  /**
   * Batang horizontal berperingkat.
   * @param {Array<{label:string, value:number, hint?:string}>} rows
   */
  function ranked(rows, opts) {
    opts = opts || {};
    var visible = rows.filter(function (r) { return r.value > 0; })
      .sort(function (a, b) { return b.value - a.value; });

    if (!visible.length) {
      return U.el('p', { class: 'field__hint', text: opts.emptyText || 'Belum ada biaya tercatat.' });
    }

    var max = visible[0].value;
    var wrap = U.el('div', { class: 'barchart', role: 'list' });

    visible.forEach(function (r, i) {
      var pct = max > 0 ? Math.max(2, (r.value / max) * 100) : 0;
      wrap.appendChild(U.el('div', {
        class: 'barrow', role: 'listitem',
        'aria-label': r.label + ': ' + U.rupiah(r.value)
      }, [
        U.el('span', { class: 'barrow__k', text: r.label }),
        U.el('div', { class: 'barrow__track' }, [
          U.el('div', {
            class: 'barrow__fill',
            style: 'width:' + pct + '%; animation-delay:' + (i * 38) + 'ms'
          })
        ]),
        U.el('span', { class: 'barrow__v num', text: opts.short ? U.rupiahShort(r.value) : U.rupiah(r.value) })
      ]));
    });

    return wrap;
  }

  /**
   * Batang per hari — sumbu kategori tetap urut hari (bukan
   * diurut nilai), karena urutan hari itu sendiri informasi.
   */
  function byDay(days, opts) {
    opts = opts || {};
    var max = 0;
    days.forEach(function (d) { max = Math.max(max, d.value); });

    if (max <= 0) {
      return U.el('p', { class: 'field__hint', text: 'Belum ada biaya untuk dibandingkan antar hari.' });
    }

    var wrap = U.el('div', { class: 'barchart', role: 'list' });
    days.forEach(function (d, i) {
      var pct = Math.max(d.value > 0 ? 2 : 0, (d.value / max) * 100);
      wrap.appendChild(U.el('div', {
        class: 'barrow', role: 'listitem',
        'aria-label': d.label + ': ' + U.rupiah(d.value)
      }, [
        U.el('span', { class: 'barrow__k', text: d.label }),
        U.el('div', { class: 'barrow__track' }, [
          U.el('div', {
            class: 'barrow__fill',
            style: 'width:' + pct + '%; animation-delay:' + (i * 38) + 'ms'
          })
        ]),
        U.el('span', { class: 'barrow__v num', text: U.rupiahShort(d.value) })
      ]));
    });
    return wrap;
  }

  /**
   * Perbandingan waktu di jalan vs waktu di lokasi, sebagai satu
   * batang dua segmen dengan celah 2px agar batasnya terbaca.
   */
  function timeSplit(travelMin, visitMin) {
    var total = travelMin + visitMin;
    if (total <= 0) return U.el('p', { class: 'field__hint', text: 'Belum ada kegiatan terjadwal.' });

    var pctTravel = (travelMin / total) * 100;

    var bar = U.el('div', {
      class: 'splitbar',
      role: 'img',
      'aria-label': 'Di jalan ' + U.dur(travelMin) + ', di lokasi ' + U.dur(visitMin)
    }, [
      U.el('span', { class: 'splitbar__a', style: 'width:' + pctTravel + '%' }),
      U.el('span', { class: 'splitbar__b' })
    ]);

    return U.el('div', { class: 'split' }, [
      bar,
      U.el('div', { class: 'split__keys' }, [
        U.el('span', { class: 'split__key' }, [
          U.el('i', { class: 'split__sw split__sw--a' }),
          U.el('span', { text: 'Di jalan ' }),
          U.el('b', { class: 'num', text: U.dur(travelMin) })
        ]),
        U.el('span', { class: 'split__key' }, [
          U.el('i', { class: 'split__sw split__sw--b' }),
          U.el('span', { text: 'Di lokasi ' }),
          U.el('b', { class: 'num', text: U.dur(visitMin) })
        ])
      ])
    ]);
  }

  return { ranked: ranked, byDay: byDay, timeSplit: timeSplit };
})();


/* ===== assets/js/lib/map.js ===== */
/* ============================================================
   Rute — peta
   ------------------------------------------------------------
   Jalur utama: Leaflet + ubin OpenStreetMap.
   Jalur cadangan: peta skematik SVG yang digambar sendiri, tetap
   menunjukkan posisi relatif dan urutan rute walau tanpa
   internet. Aplikasi tidak pernah kehilangan visualisasinya.

   Warna hari memakai tangga ordinal (terang -> gelap), dan tiap
   penanda membawa NOMOR urutannya. Identitas hari tidak pernah
   bergantung pada warna saja.
   ============================================================ */

window.RMap = (function () {
  'use strict';

  var map = null;
  var layer = null;
  var ready = false;
  var failed = false;
  var container = null;
  var onSelect = null;
  var lastSignature = '';
  var tilesWarned = false;
  var lastModel = null;

  /* Teksnya berbeda tergantung kenapa kita memakai peta skematik:
     jaringan bermasalah, atau memang tidak ada akses jaringan sama
     sekali (halaman artifact). Jangan menyalahkan jaringan kalau
     bukan itu sebabnya. */
  var schematicNote = window.RUTE_ARTIFACT
    ? 'Peta skematik: posisi, jarak, dan urutan sesuai koordinat asli, tapi garisnya bukan bentuk jalan sebenarnya. Tiap ruas punya tautan "buka rute" ke Google Maps.'
    : 'Peta jalan tidak bisa dimuat, jadi ini tampilan skematik: posisi relatif dan urutan tetap benar, garisnya bukan rute jalan sebenarnya.';

  function showTileNotice() {
    if (!container || container.querySelector('.schematic__note')) return;
    var note = document.createElement('div');
    note.className = 'schematic__note';
    note.innerHTML = '<svg class="ico ico--sm" viewBox="0 0 20 20" aria-hidden="true">' +
      '<path d="M10 3.4 2.6 16.2h14.8L10 3.4ZM10 8.2v3.4M10 13.6v.05" fill="none" ' +
      'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '<span>Gambar peta tidak bisa diunduh (jaringan). Penanda dan urutan rute tetap akurat — ' +
      'hanya latar petanya yang kosong.</span>';
    container.appendChild(note);
  }

  function leafletAvailable() {
    /* Halaman artifact memblokir ubin peta dari host luar, jadi Leaflet
       hanya akan memberi kanvas kosong yang bisa digeser. Peta skematik
       yang digambar sendiri lebih berguna di sana. */
    if (window.RUTE_ARTIFACT) return false;
    return typeof window.L !== 'undefined' && !window.__leafletFailed;
  }

  function dayColor(i) {
    var css = getComputedStyle(document.documentElement);
    var v = css.getPropertyValue('--day-' + (((i) % 7) + 1)).trim();
    return v || '#026a5b';
  }

  function dayInk(i) {
    var css = getComputedStyle(document.documentElement);
    var v = css.getPropertyValue('--day-' + (((i) % 7) + 1) + '-ink').trim();
    return v || '#ffffff';
  }

  function init(node, selectHandler) {
    container = node;
    onSelect = selectHandler;

    if (!leafletAvailable()) { failed = true; return false; }

    try {
      map = L.map(node, {
        zoomControl: true,
        attributionControl: true,
        preferCanvas: false
      }).setView([-7.7956, 110.3695], 11);

      var tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      /* Leaflet bisa termuat sementara ubin petanya tidak — hasilnya
         kanvas abu-abu tanpa penjelasan. Beberapa kegagalan berturut
         cukup untuk memberi tahu penggunanya. */
      var tileErrors = 0;
      tiles.on('tileerror', function () {
        if (++tileErrors === 6 && !tilesWarned) {
          tilesWarned = true;
          showTileNotice();
        }
      });
      tiles.on('tileload', function () { tileErrors = 0; });

      layer = L.layerGroup().addTo(map);
      ready = true;
      return true;
    } catch (e) {
      failed = true;
      return false;
    }
  }

  function invalidate() {
    if (ready && map) { setTimeout(function () { map.invalidateSize(); }, 60); return; }
    /* Skematik digambar untuk ukuran kontainer saat itu, jadi ia
       harus digambar ulang setelah panelnya berubah ukuran. */
    if (lastModel) setTimeout(function () { renderSchematic(lastModel); }, 60);
  }

  /**
   * @param {object} model
   *   days: [{ index, label, mode, points: [{place, order}], legs: [{from,to,geometry}] }]
   *   focusIndex: hari yang disorot, null = semua setara
   */
  function render(model) {
    var sig = JSON.stringify({
      f: model.focusIndex,
      d: model.days.map(function (d) {
        return d.index + ':' + d.points.map(function (p) { return p.place.id; }).join(',') +
               ':' + d.legs.map(function (l) { return l.geometry ? 'g' : '-'; }).join('');
      })
    }) + ':' + document.documentElement.getAttribute('data-theme');

    lastModel = model;

    if (ready) {
      renderLeaflet(model);
      lastSignature = sig;
      return;
    }
    if (sig !== lastSignature) {
      renderSchematic(model);
      lastSignature = sig;
    }
  }

  /* ---------- Leaflet ---------- */

  function renderLeaflet(model) {
    layer.clearLayers();

    /* `all` mengumpulkan titik untuk fitBounds. Saat satu hari
       disorot, hanya titik hari itu yang dipakai — kalau tidak,
       peta menjauh untuk memuat seluruh trip dan perhentian yang
       berdekatan (Keraton, Taman Sari, Malioboro) menumpuk jadi
       satu gumpalan yang tak terbaca. */
    var all = [];
    var focusPoints = [];

    model.days.forEach(function (d) {
      var focused = model.focusIndex === null || model.focusIndex === d.index;
      var color = focused ? dayColor(d.index) : null;
      var ink = dayInk(d.index);

      /* Garis rute: pakai geometri asli kalau ada, kalau tidak
         tarik garis lurus putus-putus supaya jelas itu perkiraan. */
      d.legs.forEach(function (lg) {
        var pts, dashed;
        if (lg.geometry && lg.geometry.length) {
          pts = lg.geometry.map(function (c) { return [c[1], c[0]]; });
          dashed = false;
        } else {
          pts = [[lg.from.lat, lg.from.lng], [lg.to.lat, lg.to.lng]];
          dashed = true;
        }
        L.polyline(pts, {
          color: focused ? color : '#9aa8a4',
          weight: focused ? 3.5 : 2,
          opacity: focused ? 0.9 : 0.35,
          dashArray: dashed ? '7 6' : null,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(layer);
      });

      d.points.forEach(function (pt) {
        var marker;

        if (focused) {
          marker = L.marker([pt.place.lat, pt.place.lng], {
            icon: L.divIcon({
              className: 'pinwrap',
              html: '<div class="pin" style="--pinColor:' + color + ';--pinInk:' + ink + '">' +
                    '<span>' + pt.order + '</span></div>',
              iconSize: [26, 26],
              iconAnchor: [13, 24],
              popupAnchor: [0, -22]
            }),
            zIndexOffset: 400,
            keyboard: true,
            alt: 'Hari ' + (d.index + 1) + ' perhentian ' + pt.order + ': ' + pt.place.name
          });
          focusPoints.push([pt.place.lat, pt.place.lng]);
        } else {
          /* Hari lain hadir sebagai titik kecil: cukup untuk tahu
             ada apa di sekitar, tidak cukup untuk berebut perhatian. */
          marker = L.circleMarker([pt.place.lat, pt.place.lng], {
            radius: 4.5, color: '#ffffff', weight: 1.5,
            fillColor: '#8a9793', fillOpacity: 0.75, opacity: 0.75
          });
        }

        marker.bindPopup(popupHtml(pt, d));
        marker.on('click', function () {
          if (onSelect) onSelect(pt.place.id, d.index);
        });
        marker.addTo(layer);
        all.push([pt.place.lat, pt.place.lng]);
      });
    });

    if (model.hub) {
      L.circleMarker([model.hub.lat, model.hub.lng], {
        radius: 6, color: '#505b58', weight: 2, fillColor: '#ffffff', fillOpacity: 1
      }).bindPopup('<b>Titik awal</b><br>' + escapeHtml(model.hub.name)).addTo(layer);
      all.push([model.hub.lat, model.hub.lng]);
      if (focusPoints.length) focusPoints.push([model.hub.lat, model.hub.lng]);
    }

    var fit = focusPoints.length ? focusPoints : all;
    if (fit.length === 1) {
      map.setView(fit[0], 14);
    } else if (fit.length > 1) {
      map.fitBounds(L.latLngBounds(fit).pad(0.18), { animate: false, maxZoom: 15 });
    }
  }

  function popupHtml(pt, d) {
    var p = pt.place;
    var bits = [
      '<b>' + escapeHtml(p.name) + '</b>',
      '<div style="color:#505b58;font-size:12px;margin-top:2px">Hari ' + (d.index + 1) +
        ' · perhentian ' + pt.order + ' · ' + escapeHtml(p.area) + '</div>'
    ];
    if (pt.arrive !== undefined) {
      bits.push('<div style="font-size:12px;margin-top:6px">' +
        U.toHHMM(pt.arrive) + '–' + U.toHHMM(pt.depart) + '</div>');
    }
    bits.push('<a href="' + Geo.mapsPlaceUrl(p) + '" target="_blank" rel="noopener" ' +
      'style="font-size:12px;display:inline-block;margin-top:6px">Buka di Google Maps</a>');
    return bits.join('');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- peta skematik cadangan ---------- */

  /**
   * Peta skematik: proyeksi equirectangular terkoreksi lintang, jadi
   * posisi relatif dan perbandingan jaraknya benar. Yang tidak ada
   * hanya jalan dan nama tempat dari peta asli — karena itu ada
   * batang skala, supaya "seberapa jauh" tetap bisa dibaca.
   */
  function renderSchematic(model) {
    U.clear(container);
    container.style.position = 'relative';

    var focusPts = [];
    var allPts = [];
    model.days.forEach(function (d) {
      var focused = model.focusIndex === null || model.focusIndex === d.index;
      d.points.forEach(function (p) {
        allPts.push({ lat: p.place.lat, lng: p.place.lng });
        if (focused) focusPts.push({ lat: p.place.lat, lng: p.place.lng });
      });
    });
    if (model.hub) {
      allPts.push({ lat: model.hub.lat, lng: model.hub.lng });
      if (focusPts.length) focusPts.push({ lat: model.hub.lat, lng: model.hub.lng });
    }

    if (!allPts.length) {
      container.appendChild(U.el('div', { class: 'schematic-empty' }, [
        U.el('p', { class: 'field__hint', text: 'Tambahkan tempat untuk melihat rutenya di peta.' })
      ]));
      return;
    }

    /* Sama seperti Leaflet: satu hari disorot berarti bingkainya
       mengikuti hari itu saja, supaya perhentian yang berdekatan
       tidak menumpuk. */
    var frame = focusPts.length > 1 ? focusPts : allPts;

    var W = container.clientWidth || 380;
    var H = container.clientHeight || 420;
    var pad = 40;
    var bb = Geo.bounds(frame, 0.16);

    var latRange = bb.n - bb.s || 0.02;
    var lngRange = bb.e - bb.w || 0.02;
    var cosLat = Math.cos((bb.n + bb.s) / 2 * Math.PI / 180);
    var scale = Math.min((W - pad * 2) / (lngRange * cosLat), (H - pad * 2) / latRange);
    var offX = (W - lngRange * cosLat * scale) / 2;
    var offY = (H - latRange * scale) / 2;

    function X(lng) { return offX + (lng - bb.w) * cosLat * scale; }
    function Y(lat) { return offY + (bb.n - lat) * scale; }

    var NS = 'http://www.w3.org/2000/svg';
    function mk(tag, attrs) {
      var n = document.createElementNS(NS, tag);

          x1: X(lg.from.lng), y1: Y(lg.from.lat), x2: X(lg.to.lng), y2: Y(lg.to.lat),

          'stroke-dasharray': '5 5', 'stroke-linecap': 'round'
        }));
      });
      d.points.forEach(function (pt) {
        var c = mk('circle', {
          cx: X(pt.place.lng), cy: Y(pt.place.lat), r: 4.5,
          fill: '#8a9793', 'fill-opacity': 0.75, stroke: 'var(--bg)', 'stroke-width': 1.5
        });
        c.appendChild(titleFor('Hari ' + (d.index + 1) + ' · ' + pt.order + '. ' + pt.place.name));

      t.textContent = text;

    if (model.hub) {
      var hg = mk('g', {});
      hg.appendChild(mk('circle', {
        cx: X(model.hub.lng), cy: Y(model.hub.lat), r: 6,
        fill: 'var(--bg)', stroke: 'var(--ink-muted)', 'stroke-width': 2

    model.days.forEach(function (d) {
      var focused = model.focusIndex === null || model.focusIndex === d.index;
      if (!focused) return;
      var color = dayColor(d.index);
      var ink = dayInk(d.index);

      d.legs.forEach(function (lg) {
        s.appendChild(mk('line', {
          x1: X(lg.from.lng), y1: Y(lg.from.lat), x2: X(lg.to.lng), y2: Y(lg.to.lat),
          stroke: color, 'stroke-width': 2.5, 'stroke-opacity': 0.9,
          'stroke-dasharray': '6 5', 'stroke-linecap': 'round'
        }));
      });

      /* Nama tempat hanya ditulis saat satu hari disorot. Dalam mode
         "semua hari" ada puluhan titik dan labelnya akan saling
         menimpa — di sana nomor penanda dan legenda yang bekerja. */
      var showLabels = model.focusIndex !== null && d.points.length <= 8 && W >= 300;

      /* Perhentian di pusat kota bisa berjarak 200 m dan penandanya
         nyaris menumpuk, jadi labelnya harus digeser agar tidak saling
         menimpa. Dihitung dulu untuk semua titik, baru digambar. */
      var placed = d.points.map(function (pt) {
        var cx = X(pt.place.lng), cy = Y(pt.place.lat);
        return { pt: pt, cx: cx, cy: cy, tx: cx, ty: cy, moved: false, right: cx < W * 0.6, ly: cy + 4 };
      });

      spread(placed);
      placed.forEach(function (q) { q.right = q.cx < W * 0.6; q.ly = q.cy + 4; });

      if (showLabels) {
        ['right', 'left'].forEach(function (side) {
          var col = placed
            .filter(function (q) { return (side === 'right') === q.right; })
            .sort(function (a, b) { return a.ly - b.ly; });
          for (var i = 1; i < col.length; i++) {
            var gap = col[i].ly - col[i - 1].ly;
            if (gap < 14) col[i].ly = col[i - 1].ly + 14;
          }
          /* Kalau geseran mendorong label keluar kanvas, tarik semuanya
             ke atas secukupnya. */
          var last = col[col.length - 1];
          if (last && last.ly > H - 24) {
            var shift = last.ly - (H - 24);
            col.forEach(function (q) { q.ly -= shift; });
          }
        });
      }

      placed.forEach(function (q) {
        var pt = q.pt;
        var g = mk('g', { class: 'schematic__pt', tabindex: '0', role: 'button' });

        if (q.moved) {

            stroke: 'var(--line-strong)', 'stroke-width': 1
          }));
          g.appendChild(mk('circle', {
            cx: q.tx, cy: q.ty, r: 1.8, fill: 'var(--ink-muted)'
          }));
        }

        if (showLabels && Math.abs(q.ly - (q.cy + 4)) > 3) {
          /* Label yang digeser butuh garis penghubung ke penandanya. */
          g.appendChild(mk('line', {
            x1: q.cx + (q.right ? 13 : -13), y1: q.cy,
            x2: q.cx + (q.right ? 16 : -16), y2: q.ly - 4,
            stroke: 'var(--line-strong)', 'stroke-width': 1
          }));
        }

        g.appendChild(mk('circle', {
          cx: q.cx, cy: q.cy, r: 12, fill: color, stroke: 'var(--bg)', 'stroke-width': 2
        }));

        var t = mk('text', {
          x: q.cx, y: q.cy + 4, 'text-anchor': 'middle', 'font-size': '11',
          'font-weight': '700', fill: ink, 'font-family': 'system-ui, sans-serif',
          'pointer-events': 'none'
        });
        t.textContent = pt.order;
        g.appendChild(t);

        if (showLabels) {
          var lbl = mk('text', {
            x: q.cx + (q.right ? 17 : -17), y: q.ly,
            'text-anchor': q.right ? 'start' : 'end',
            'font-size': '11', 'font-weight': '600', fill: 'var(--ink-2)',
            'font-family': 'system-ui, sans-serif',
            'paint-order': 'stroke', stroke: 'var(--bg)', 'stroke-width': '3.5',
            'stroke-linejoin': 'round', 'pointer-events': 'none'

          lbl.textContent = shorten(pt.place.name, 20);
          g.appendChild(lbl);
        }

        g.appendChild(titleFor(pt.place.name + ' · ' + U.toHHMM(pt.arrive) + '–' + U.toHHMM(pt.depart)));
        g.addEventListener('click', function () { if (onSelect) onSelect(pt.place.id, d.index); });
        g.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (onSelect) onSelect(pt.place.id, d.index); }
        });
        s.appendChild(g);
      });
    });

    /* Batang skala — tanpa ini "jauh" cuma soal rasa. */
    var kmPerPx = 111.32 / scale;
    var target = Math.min(150, Math.max(70, W * 0.26));
    var rawKm = target * kmPerPx;
    var niceKm = niceRound(rawKm);
    var barPx = niceKm / kmPerPx;
    var bx = 14, by = 22;

    var bar = mk('g', {});
    bar.appendChild(mk('line', {
      x1: bx, y1: by, x2: bx + barPx, y2: by,
      stroke: 'var(--ink-2)', 'stroke-width': '2', 'stroke-linecap': 'butt'
    }));
    bar.appendChild(mk('line', { x1: bx, y1: by - 4, x2: bx, y2: by + 4, stroke: 'var(--ink-2)', 'stroke-width': '2' }));
    bar.appendChild(mk('line', { x1: bx + barPx, y1: by - 4, x2: bx + barPx, y2: by + 4, stroke: 'var(--ink-2)', 'stroke-width': '2' }));
    var st = mk('text', {
      x: bx, y: by + 16, 'font-size': '11', 'font-weight': '600',
      fill: 'var(--ink-2)', 'font-family': 'system-ui, sans-serif',
      'paint-order': 'stroke', stroke: 'var(--bg)', 'stroke-width': '3.5', 'stroke-linejoin': 'round'
    });
    st.textContent = (niceKm < 1 ? (niceKm * 1000) + ' m' : niceKm + ' km');
    bar.appendChild(st);
    s.appendChild(bar);

    container.appendChild(s);

    container.appendChild(U.el('div', { class: 'schematic__note' }, [
      U.icon('info', 'ico--sm'),
      U.el('span', {
        text: schematicNote
      })
    ]));
  }

  /**
   * Perhentian di pusat kota bisa berjarak 200 meter dan penandanya
   * saling menutupi sampai ada yang hilang sama sekali. Titik yang
   * bertumpuk disebar merata pada lingkaran kecil di sekitar pusat
   * gerombolannya; posisi aslinya tetap ditandai titik kecil.
   *
   * Deterministik: sudutnya diturunkan dari urutan, bukan diacak.
   */
  function spread(points) {
    var MIN = 24;
    var used = [];

    points.forEach(function (p) { p._c = -1; });

    points.forEach(function (p, i) {
      if (p._c >= 0) return;
      var cluster = [p];
      p._c = used.length;
      for (var j = i + 1; j < points.length; j++) {
        var q = points[j];
        if (q._c >= 0) continue;
        var dx = q.tx - p.tx, dy = q.ty - p.ty;
        if (Math.sqrt(dx * dx + dy * dy) < MIN) { cluster.push(q); q._c = used.length; }
      }
      used.push(cluster);
    });

    used.forEach(function (cluster) {
      if (cluster.length < 2) return;
      var mx = 0, my = 0;
      cluster.forEach(function (q) { mx += q.tx; my += q.ty; });
      mx /= cluster.length; my /= cluster.length;

      var radius = Math.max(15, 4.2 * cluster.length + 9);
      cluster.forEach(function (q, k) {
        var angle = (Math.PI * 2 * k) / cluster.length - Math.PI / 2;
        q.cx = mx + Math.cos(angle) * radius;
        q.cy = my + Math.sin(angle) * radius;
        q.moved = true;
      });
    });

    points.forEach(function (p) { delete p._c; });
  }

  function niceRound(v) {
    var pow = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
    var n = v / pow;
    var step = n >= 5 ? 5 : (n >= 2 ? 2 : 1);
    return step * pow;
  }

  function shorten(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  function isFallback() { return !ready; }

  return { init: init, render: render, invalidate: invalidate, isFallback: isFallback, dayColor: dayColor };
})();

/* ============================================================

window.Shell = (function () {
  'use strict';

  var toastHost, modal, modalTitle, modalBody;
  var lastFocus = null;

  /* ---------- tema ---------- */

  /* Penampil artifact menandai <html data-theme="..."> sesuai pilihan
     pembacanya. Kalau pengaturan aplikasi masih "ikuti perangkat",
     tanda itu milik pembaca — jangan dicabut, karena mencabutnya
     berarti mengabaikan pilihan yang sudah dia buat. */
  var hostTheme = document.documentElement.getAttribute('data-theme');

  function applyTheme(pref) {
    var root = document.documentElement;
    if (pref === 'auto') {
      if (hostTheme) root.setAttribute('data-theme', hostTheme);
      else root.removeAttribute('data-theme');
    } else {
      root.setAttribute('data-theme', pref);
    }
  }

  function currentEffectiveTheme() {
    var stamped = document.documentElement.getAttribute('data-theme');
    if (stamped) return stamped;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark' : 'light';
  }

  function toggleTheme() {
    var next = currentEffectiveTheme() === 'dark' ? 'light' : 'dark';
    Store.setPref('theme', next);
    applyTheme(next);
    return next;
  }

  /* ---------- toast ---------- */

  function toast(message, action) {
    if (!toastHost) toastHost = U.qs('#toasts');
    var node = U.el('div', { class: 'toast' }, [
      U.el('span', { text: message }),
      action ? U.el('button', {
        class: 'toast__act', type: 'button', text: action.label,
        onclick: function () { action.run(); dismiss(); }
      }) : null
    ]);
    toastHost.appendChild(node);

    var timer = setTimeout(dismiss, action ? 7000 : 3800);
    function dismiss() {
      clearTimeout(timer);
      if (node.parentNode) node.parentNode.removeChild(node);
    }
    return dismiss;
  }

  /* ---------- modal ---------- */

  function openModal(title, contentNode) {
    if (!modal) {
      modal = U.qs('#modal');
      modalTitle = U.qs('#modalTitle');
      modalBody = U.qs('#modalBody');
      U.qs('#modalClose').addEventListener('click', closeModal);
      modal.addEventListener('cancel', function (e) { e.preventDefault(); closeModal(); });
      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeModal();
      });
    }
    lastFocus = document.activeElement;
    modalTitle.textContent = title;
    U.clear(modalBody).appendChild(contentNode);
    if (typeof modal.showModal === 'function') modal.showModal();
    else modal.setAttribute('open', '');
  }

  function closeModal() {
    if (!modal) return;
    if (typeof modal.close === 'function') modal.close();
    else modal.removeAttribute('open');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  var drawer, drawerBody, drawerBtn, drawerOpen = false;

  }

    drawer.hidden = !open;
