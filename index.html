<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rute — Perencana Itinerary</title>
<meta name="description" content="Susun itinerary liburan dengan jarak antar tempat, estimasi waktu tempuh, rincian biaya, dan ekspor ke Google Calendar.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070b0a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23026a5b'/%3E%3Cpath d='M9 23c0-5 6-3.5 6-7.5S9 13 9 9' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='9' r='2.6' fill='%23fff'/%3E%3Ccircle cx='22' cy='22' r='2.6' fill='%23fff'/%3E%3Cpath d='M15 22h4' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">

<!-- Leaflet dibundel di repo (bukan CDN) supaya peta tetap muncul
     tanpa internet dan tanpa bergantung pada layanan pihak ketiga.
     Ubin petanya sendiri tetap perlu jaringan; kalau gagal, aplikasi
     menggambar peta skematiknya sendiri. -->
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
</head>
<body>

<a class="skip-link" href="#main">Lewati ke konten utama</a>

<header class="topbar">
  <div class="topbar__brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path d="M9 23c0-5 6-3.5 6-7.5S9 13 9 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="9" cy="9" r="2.8" fill="currentColor"/>
      <circle cx="22" cy="22" r="2.8" fill="currentColor"/>
      <path d="M15 22h4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <span class="topbar__wordmark">Rute</span>
  </div>

  <div class="topbar__trip">
    <input id="tripName" class="topbar__title" aria-label="Nama trip" autocomplete="off" spellcheck="false">
    <p class="topbar__meta" id="tripMeta"></p>
  </div>

  <div class="topbar__actions">
    <button type="button" class="btn btn--ghost" id="btnSettings" aria-expanded="false" aria-controls="settingsPanel" aria-label="Pengaturan trip">
      <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="m16.5 12-.6-.4a6.3 6.3 0 0 0 0-3.2l.6-.4a1 1 0 0 0 .3-1.3l-1-1.7a1 1 0 0 0-1.2-.4l-.7.2a6.3 6.3 0 0 0-2.8-1.6l-.1-.7a1 1 0 0 0-1-.8H8a1 1 0 0 0-1 .8l-.1.7a6.3 6.3 0 0 0-2.8 1.6l-.7-.2a1 1 0 0 0-1.2.4l-1 1.7a1 1 0 0 0 .3 1.3l.6.4a6.3 6.3 0 0 0 0 3.2l-.6.4a1 1 0 0 0-.3 1.3l1 1.7a1 1 0 0 0 1.2.4l.7-.2a6.3 6.3 0 0 0 2.8 1.6l.1.7a1 1 0 0 0 1 .8h2a1 1 0 0 0 1-.8l.1-.7a6.3 6.3 0 0 0 2.8-1.6l.7.2a1 1 0 0 0 1.2-.4l1-1.7a1 1 0 0 0-.3-1.3Z"/></svg>
      <span>Pengaturan</span>
    </button>
    <button type="button" class="btn btn--ghost btn--icon" id="btnTheme" aria-label="Ganti tema gelap/terang" title="Ganti tema">
      <svg class="ico ico--sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4"/><path d="M10 1v2M10 17v2M3.2 3.2l1.4 1.4M15.4 15.4l1.4 1.4M1 10h2M17 10h2M3.2 16.8l1.4-1.4M15.4 4.6l1.4-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
      <svg class="ico ico--moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M17 12.3A7.5 7.5 0 0 1 7.7 3 7.5 7.5 0 1 0 17 12.3Z"/></svg>
    </button>
  </div>
</header>

<!-- Settings drawer -->
<div class="drawer" id="settingsPanel" hidden>
  <div class="drawer__inner">
    <div class="drawer__head">
      <h2 class="drawer__title">Pengaturan trip</h2>
      <button type="button" class="btn btn--ghost btn--icon" id="btnCloseSettings" aria-label="Tutup pengaturan">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <div class="drawer__body" id="settingsBody"><!-- rendered --></div>
  </div>
  <button type="button" class="drawer__scrim" id="drawerScrim" tabindex="-1" aria-hidden="true"></button>
</div>

<div class="shell">

  <nav class="rail" aria-label="Navigasi utama">
    <ul class="rail__views" role="list">
      <li><button type="button" class="rail__btn is-active" data-view="plan" aria-current="page">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4.5h14M3 10h14M3 15.5h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="16.5" cy="15.5" r="1.6"/></svg>
        <span>Rencana</span></button></li>
      <li><button type="button" class="rail__btn" data-view="explore">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m13.6 13.6 3.4 3.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Jelajah</span></button></li>
      <li><button type="button" class="rail__btn" data-view="budget">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16V9M8 16V4M13 16v-5M18 16V7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg>
        <span>Biaya</span></button></li>
      <li><button type="button" class="rail__btn" data-view="live">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="11" r="6.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 7.6V11l2.3 1.6M7.4 2.6 4.6 4.4M12.6 2.6l2.8 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        <span>Hari ini</span></button></li>
      <!-- Peta punya panelnya sendiri di layar lebar; di layar sempit
           ia jadi tab kelima, bukan tombol melayang yang menutupi teks. -->
      <li class="rail__mapitem"><button type="button" class="rail__btn" id="btnMapTab" aria-controls="mappane" aria-expanded="false">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.3 3.2 3 5v12l4.3-1.8 5.4 2L17 15.4V3.4l-4.3 1.8-5.4-2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7.3 3.2v12M12.7 5.2v12" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>Peta</span></button></li>
    </ul>

    <div class="rail__section">
      <h2 class="rail__label" id="railDaysLabel">Hari</h2>
      <ul class="rail__days" id="railDays" role="list" aria-labelledby="railDaysLabel"><!-- rendered --></ul>
      <button type="button" class="rail__add" id="btnAddDay">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"/></svg>
        Tambah hari
      </button>
    </div>

    <div class="rail__foot">
      <button type="button" class="rail__btn rail__btn--sm" id="btnExportIcs">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 8.5h14M7 2.8v3.2M13 2.8v3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>Ekspor kalender</span>
      </button>
      <button type="button" class="rail__btn rail__btn--sm" id="btnData">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.6v10M6.4 9.4 10 13l3.6-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M3.4 13.6v2a1.6 1.6 0 0 0 1.6 1.6h10a1.6 1.6 0 0 0 1.6-1.6v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Simpan / muat</span>
      </button>
    </div>
  </nav>

  <main class="content" id="main" tabindex="-1">
    <section class="view" id="view-plan" aria-label="Rencana perjalanan"></section>
    <section class="view" id="view-explore" aria-label="Jelajah tempat" hidden></section>
    <section class="view" id="view-budget" aria-label="Rincian biaya" hidden></section>
    <section class="view" id="view-live" aria-label="Pengatur waktu hari ini" hidden></section>
  </main>

  <aside class="mappane" id="mappane" aria-label="Peta rute">
    <div class="mappane__head">
      <div class="segmented" role="group" aria-label="Cakupan peta">
        <button type="button" class="segmented__btn is-active" data-mapscope="day">Hari aktif</button>
        <button type="button" class="segmented__btn" data-mapscope="all">Semua hari</button>
      </div>
      <button type="button" class="btn btn--ghost btn--icon mappane__close" id="btnCloseMap" aria-label="Tutup peta">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
    <div class="mappane__canvas" id="mapCanvas" role="region" aria-label="Peta interaktif rute perjalanan"></div>
    <div class="mappane__foot" id="mapLegend"><!-- rendered --></div>
  </aside>

</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<dialog class="modal" id="modal">
  <div class="modal__head">
    <h2 class="modal__title" id="modalTitle"></h2>
    <button type="button" class="btn btn--ghost btn--icon" id="modalClose" aria-label="Tutup">
      <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>
  <div class="modal__body" id="modalBody"></div>
</dialog>

<script src="assets/vendor/leaflet/leaflet.js" onerror="window.__leafletFailed=true"></script>

<script src="assets/js/data/destinations.js"></script>
<script src="assets/js/lib/util.js"></script>
<script src="assets/js/lib/geo.js"></script>
<script src="assets/js/lib/store.js"></script>
<script src="assets/js/lib/schedule.js"></script>
<script src="assets/js/lib/planner.js"></script>
<script src="assets/js/lib/calendar.js"></script>
<script src="assets/js/lib/charts.js"></script>
<script src="assets/js/lib/map.js"></script>
<script src="assets/js/ui/shell.js"></script>
<script src="assets/js/ui/plan.js"></script>
<script src="assets/js/ui/explore.js"></script>
<script src="assets/js/ui/budget.js"></script>
<script src="assets/js/ui/live.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
