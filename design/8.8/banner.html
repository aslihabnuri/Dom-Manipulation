<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>nomukita 8.8</title>
<style>
  /* Palette taken from the real brand assets: the wordmark's cyan leaf dot,
     the packaging's black, and the matcha greens of the product itself. */
  :root{
    --green:#4C7C2F;
    --green-dk:#365B1F;
    --green-lt:#8CBB4A;
    --cyan:#3FA9D4;
    --cream:#FFFDF4;
    --ink:#111111;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  /* Brand face: geometric rounded sans, matching the nomukita wordmark. */
  body{font-family:"Poppins",sans-serif;-webkit-font-smoothing:antialiased}
  .canvas{position:relative;width:1080px;height:1350px;overflow:hidden;background:#EAF3DF}
  .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  .logo{position:absolute;left:64px;top:52px;width:224px;z-index:9;
    filter:drop-shadow(0 2px 4px rgba(255,255,255,.85))}
  .jp-v{position:absolute;right:66px;top:50px;z-index:9;
    font-family:"IPAGothic","IPAPGothic",sans-serif;font-size:21px;letter-spacing:7px;
    color:var(--green);writing-mode:vertical-rl;line-height:1;
    text-shadow:0 2px 0 rgba(255,255,255,.9)}

  /* ── hero 8.8 ── */
  .eight{position:absolute;left:0;right:0;top:112px;z-index:8;text-align:center;height:250px}
  .eight span{position:absolute;left:0;right:0;top:0;
    font-weight:800;font-size:228px;line-height:1.06;letter-spacing:-4px;white-space:nowrap}
  .e-shadow{color:rgba(54,91,31,.30);-webkit-text-stroke:44px rgba(54,91,31,.30);transform:translateY(14px)}
  .e-out{color:var(--green-dk);-webkit-text-stroke:42px var(--green-dk)}
  .e-mid{color:#fff;-webkit-text-stroke:25px #fff}
  .e-fill{background:linear-gradient(180deg,#A6D45F 0%,#79AF3E 60%,#5E8C2B 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

  /* ── campaign name ── */
  .name{position:absolute;left:0;right:0;top:372px;z-index:8;
    display:flex;align-items:center;justify-content:center;gap:22px}
  .name b{font-weight:700;font-size:49px;letter-spacing:5px;color:var(--green-dk);line-height:1;
    text-shadow:0 3px 0 rgba(255,255,255,.95)}
  .name i{display:block;width:62px;height:3px;background:var(--green-lt);border-radius:2px}
  .sub{position:absolute;left:0;right:0;top:440px;z-index:8;text-align:center;
    font-weight:500;font-size:29px;color:var(--green);letter-spacing:.3px;
    text-shadow:0 2px 0 rgba(255,255,255,.92)}

  /* ── offer ── */
  .upto{position:absolute;left:74px;top:516px;z-index:9;transform:rotate(-12deg);
    font-weight:800;font-size:36px;letter-spacing:4px;color:var(--green-dk);line-height:1;
    text-shadow:0 3px 0 rgba(255,255,255,.95)}
  .num{position:absolute;left:56px;top:560px;width:800px;z-index:6;
    filter:drop-shadow(0 26px 28px rgba(70,110,45,.30))}

  /* Real product packaging, overlapping the number's lower-right. */
  .pack{position:absolute;right:38px;top:796px;width:252px;z-index:7;
    filter:drop-shadow(0 22px 26px rgba(40,60,25,.42))}

  /* ── free shipping: brand cyan so it reads as the second offer ── */
  .ongkir{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:9;
    display:inline-flex;align-items:center;gap:17px;padding:19px 52px 21px;
    border-radius:999px;background:var(--cyan);
    border:4px solid var(--cream);
    box-shadow:0 0 0 4px rgba(63,169,212,.42),0 12px 26px rgba(30,80,100,.30)}
  .ongkir b{font-weight:700;font-size:35px;letter-spacing:2.6px;color:#fff;line-height:1.2}
  .ongkir svg{flex:none}
</style>
</head>
<body>
<div class="canvas">
  <img class="scene" src="assets/scene-jp.jpg" alt="">

  <img class="logo" src="assets/logo.png" alt="nomukita">
  <div class="jp-v">八月八日</div>

  <div class="eight">
    <span class="e-shadow">8.8</span>
    <span class="e-out">8.8</span>
    <span class="e-mid">8.8</span>
    <span class="e-fill">8.8</span>
  </div>

  <div class="name"><i></i><b>MATCHA-FULL DAY</b><i></i></div>
  <p class="sub">nikmati setiap detik matcha-full day-mu</p>

  <div class="upto">DISC UP TO</div>
  <img class="num" src="assets/num50.png" alt="">
  <img class="pack" src="assets/pack.png" alt="">

  <div class="ongkir">
    <svg width="38" height="27" viewBox="0 0 30 22" fill="none">
      <path d="M1.6 4.2h14.2v11.4H1.6zM15.8 8.1h5.4l3.6 3.7v3.8h-9z"
            stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="8" cy="17.6" r="2.6" stroke="#fff" stroke-width="2.2"/>
      <circle cx="21.4" cy="17.6" r="2.6" stroke="#fff" stroke-width="2.2"/>
    </svg>
    <b>GRATIS ONGKIR</b>
  </div>
</div>
</body>
</html>
