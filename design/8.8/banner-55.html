<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>nomukita 8.8</title>
<style>
  /* Type and colour follow "NOMUKITA - DESIGN SYSTEM CAROUSEL MARKETPLACE"
     (locked 24 July 2026). Swap --brand-display / --brand-label for the
     licensed cut of All Round Gothic when it is bought — nothing else needs
     to change. */
  :root{
    --brand-display:"FONTSPRING DEMO - All Round Gothic Bold";
    --brand-label:"FONTSPRING DEMO - All Round Gothic Demi";
    --brand-body:"Comfortaa";
    --brand-kanji:"Shippori Mincho";

    --bone:#F1F0EB;
    --matcha:#7A9A3F;
    --charcoal:#1C1C1C;
    --nomu-blue:#A8C4D8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{font-family:var(--brand-body),sans-serif;-webkit-font-smoothing:antialiased}
  .canvas{position:relative;width:1080px;height:1350px;overflow:hidden;background:#8E9384}
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  /* Only enough shading for bone-white type to hold over the bright dapples. */
  .scrim{position:absolute;inset:0 0 auto 0;height:56%;
    background:linear-gradient(180deg,rgba(34,40,28,.50) 0%,rgba(34,40,28,.34) 42%,rgba(34,40,28,.06) 84%,rgba(34,40,28,0) 100%)}

  /* Design system: logo 300px wide, centred, y=52. */
  .logo{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:300px;z-index:9;
    filter:brightness(0) invert(1) opacity(.95)}

  .top{position:absolute;left:0;right:0;top:138px;z-index:8;text-align:center;color:var(--bone)}
  .eight{font-family:var(--brand-display);font-size:112px;line-height:1;
    text-shadow:0 5px 24px rgba(18,24,14,.45)}
  .day{margin-top:16px;font-family:var(--brand-label);font-size:26px;letter-spacing:7px;
    text-indent:7px;text-shadow:0 3px 14px rgba(18,24,14,.5)}

  /* ── the discount: the loudest element on the banner ── */
  .save{position:absolute;left:0;right:0;top:334px;z-index:8;text-align:center;color:var(--bone);
    font-family:var(--brand-label);font-size:30px;letter-spacing:7px;text-indent:7px;
    text-shadow:0 3px 14px rgba(18,24,14,.5)}
  .pct{position:absolute;left:0;right:0;top:370px;z-index:8;
    display:flex;align-items:flex-start;justify-content:center;gap:10px;color:var(--bone)}
  .pct b{font-family:var(--brand-display);font-size:222px;line-height:1;
    text-shadow:0 8px 30px rgba(18,24,14,.45)}
  /* The DEMO cut locks '%', '-', '°' and the digit 4 behind a watermark, so the
     percent is drawn as a vector with its stroke matched to the digits. */
  .pct svg{margin-top:24px;filter:drop-shadow(0 8px 30px rgba(18,24,14,.45))}

  /* ── foot, set into the lit concrete ── */
  .foot{position:absolute;left:0;right:0;bottom:112px;z-index:9;
    display:flex;align-items:center;justify-content:center;gap:26px}
  .foot i{display:block;width:128px;height:1.5px;background:rgba(28,28,28,.36)}
  .foot b{font-family:var(--brand-label);font-size:30px;letter-spacing:7px;text-indent:7px;
    color:var(--charcoal)}
  .tagline{position:absolute;left:0;right:0;bottom:58px;z-index:9;text-align:center;
    font-family:var(--brand-body);font-size:23px;letter-spacing:1px;color:rgba(28,28,28,.62)}

  .doodle{position:absolute;z-index:7;pointer-events:none}
  .girl{left:88px;top:762px;width:262px;opacity:.86}
  .cat{left:566px;top:1086px;width:86px;opacity:.9}
</style>
</head>
<body>
<div class="canvas">
  <img class="photo" src="assets/photo.jpg" alt="">
  <div class="scrim"></div>

  <img class="logo" src="assets/logo.png" alt="nomukita">

  <div class="top">
    <div class="eight">8.8</div>
    <div class="day">MATCHA DAY</div>
  </div>

  <div class="save">HEMAT HINGGA</div>
  <div class="pct">
    <b>55</b>
    <svg width="114" height="170" viewBox="0 0 64 96" fill="none" aria-label="persen">
      <g stroke="#F1F0EB" stroke-width="11.5" fill="none">
        <circle cx="16.5" cy="28" r="10.5"/>
        <circle cx="47.5" cy="68" r="10.5"/>
        <path d="M53 18 L11 78" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <img class="doodle girl" src="assets/girl.png" alt="">
  <img class="doodle cat"  src="assets/cat.png"  alt="">

  <!-- ribbon on the strawberry glass, as in the concept reference -->
  <svg class="doodle" style="left:730px;top:846px;z-index:9" width="140" height="98" viewBox="0 0 150 104" fill="none">
    <path d="M74 44c-10-15-31-24-42-14-9 8-2 24 12 26 13 2 26-6 30-12Z" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" opacity=".92"/>
    <path d="M76 44c10-15 31-24 42-14 9 8 2 24-12 26-13 2-26-6-30-12Z" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" opacity=".92"/>
    <path d="M75 46c-4 14-9 30-14 44M75 46c5 14 12 28 19 41" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".92"/>
    <circle cx="75" cy="44" r="5" stroke="#fff" stroke-width="2.6" opacity=".92"/>
  </svg>

  <div class="foot"><i></i><b>GRATIS ONGKIR</b><i></i></div>
  <div class="tagline">bring the cafe home</div>
</div>
</body>
</html>
