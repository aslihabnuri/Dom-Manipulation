<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ads Command Center — Sophie Martin</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --tiktok:#2a78d6; --shopee:#eb6834; --meta:#1baf7a; --lazada:#4a3aa7;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300;
  --shadow:0 1px 2px rgba(11,11,11,.05),0 4px 14px rgba(11,11,11,.05);
}
:root[data-theme="dark"], :root:not([data-theme="light"])[data-osdark="1"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --tiktok:#3987e5; --shopee:#d95926; --meta:#199e70; --lazada:#9085e9;
  --good-ink:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--page); color:var(--ink);
  font-size:14px; line-height:1.45;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;padding:0 20px 64px}
header.top{
  position:sticky;top:0;z-index:50;background:var(--page);
  border-bottom:1px solid var(--grid);
  margin:0 -20px;padding:0 20px;
}
.top-row{display:flex;align-items:center;gap:14px;padding:14px 0 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--tiktok),var(--lazada));
  color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px;
}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted)}
.badge-month{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--ink-2);
}
.badge-month .pill{
  background:var(--surface);border:1px solid var(--ring);border-radius:99px;
  padding:4px 12px;font-weight:600;
}
.theme-btn{
  border:1px solid var(--ring);background:var(--surface);border-radius:99px;
  width:32px;height:32px;cursor:pointer;display:grid;place-items:center;font-size:14px;
}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0}
nav.tabs button{
  border:0;background:none;cursor:pointer;white-space:nowrap;
  padding:9px 14px;font-size:13.5px;font-weight:550;color:var(--ink-2);
  border-bottom:2px solid transparent;border-radius:8px 8px 0 0;
}
nav.tabs button:hover{background:var(--surface-2)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:650}
nav.tabs button .n{
  display:inline-block;min-width:17px;text-align:center;margin-left:5px;
  background:var(--critical);color:#fff;border-radius:99px;font-size:10.5px;
  padding:1px 4px;vertical-align:1px;
}

/* ---------- generic ---------- */
h2.sec{font-size:15px;font-weight:700;margin:26px 0 12px;letter-spacing:-.01em}
h2.sec .hint{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.grid{display:grid;gap:12px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.g-2,.g-3{grid-template-columns:1fr}}
.card{
  background:var(--surface);border:1px solid var(--ring);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);
}
.card h3{font-size:13px;font-weight:650;color:var(--ink-2);margin-bottom:8px}
.card h3 .hint{font-weight:400;color:var(--muted);font-size:11.5px}

/* KPI tiles */
.kpi .lbl{font-size:12px;color:var(--ink-2);font-weight:550;display:flex;gap:6px;align-items:center}
.kpi .dot{width:8px;height:8px;border-radius:99px;flex:none}
.kpi .val{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .delta{font-size:12px;color:var(--muted)}
.kpi .delta b.up{color:var(--good-ink);font-weight:650}
.kpi .delta b.dn{color:var(--critical);font-weight:650}
.kpi svg.spark{display:block;margin-top:8px;width:100%}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--ring);border-radius:12px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th{font-weight:650;color:var(--ink-2);font-size:11.5px;background:var(--surface-2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2}
thead th:first-child{background:var(--surface-2);z-index:3}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:var(--surface-2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.plat-chip{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.plat-chip .dot{width:9px;height:9px;border-radius:3px}

/* charts */
.chart-box{position:relative}
.chart-box svg{display:block;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
#tip{
  position:fixed;z-index:99;pointer-events:none;display:none;
  background:var(--surface);border:1px solid var(--ring);border-radius:10px;
  box-shadow:var(--shadow);padding:8px 11px;font-size:12px;max-width:280px;
}
#tip .t{font-weight:650;margin-bottom:4px}
#tip .r{display:flex;justify-content:space-between;gap:14px}
#tip .r i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
#tip .r .v{font-variant-numeric:tabular-nums;font-weight:600}

/* alerts */
.alert{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--ring);border-left-width:4px;
  border-radius:12px;padding:13px 15px;margin-bottom:10px;
}
.alert .ic{font-size:16px;line-height:1.3}
.alert .bd{flex:1;min-width:0}
.alert .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:2px}
.alert .hd b{font-size:13.5px}
.alert .sev{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;color:#fff}
.alert .why{color:var(--ink-2);font-size:12.5px;margin:3px 0 6px}
.alert .acts{margin:6px 0 0;padding-left:18px;font-size:12.5px}
.alert .acts li{margin-bottom:3px}
.alert .acts .tag{font-weight:650}
.alert.crit{border-left-color:var(--critical)} .alert.crit .sev{background:var(--critical)}
.alert.ser{border-left-color:var(--serious)} .alert.ser .sev{background:var(--serious);color:#3d1600}
.alert.warn{border-left-color:var(--warning)} .alert.warn .sev{background:var(--warning);color:#4a3200}
.alert.info{border-left-color:var(--axis)} .alert.info .sev{background:var(--surface-2);color:var(--ink-2)}
.alert.opp{border-left-color:var(--good)} .alert.opp .sev{background:var(--good)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.controls label{font-size:12px;color:var(--ink-2);font-weight:550}
select,input[type=date],input[type=number],input[type=text]{
  background:var(--surface);border:1px solid var(--ring);border-radius:9px;
  padding:7px 10px;font-size:13px;
}
textarea{
  width:100%;background:var(--surface);border:1px solid var(--ring);border-radius:10px;
  padding:10px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:130px;
}
.btn{
  background:var(--ink);color:var(--page);border:0;border-radius:9px;
  padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;
}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--ring)}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.pill-stat{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;border-radius:99px;padding:2px 9px}
.pill-stat.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-ink)}
.pill-stat.bad{background:color-mix(in srgb,var(--critical) 12%,transparent);color:var(--critical)}
.pill-stat.mid{background:color-mix(in srgb,var(--warning) 16%,transparent);color:#7a5200}
:root[data-theme="dark"] .pill-stat.mid, :root:not([data-theme="light"])[data-osdark="1"] .pill-stat.mid{color:var(--warning)}
.bar-track{background:var(--surface-2);border-radius:99px;height:7px;overflow:hidden;min-width:70px}
.bar-fill{height:100%;border-radius:99px}
.foot{color:var(--muted);font-size:11.5px;margin-top:34px;border-top:1px solid var(--grid);padding-top:12px}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:13px}
</style>
</head>

const nf0 = new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('id-ID',{maximumFractionDigits:1});

const fmtRpC  = v => { if(v==null) return '–'; const a=Math.abs(v), s=v<0?'-':'';
  if(a>=1e9) return s+'Rp'+nf1.format(a/1e9)+' M';
  if(a>=1e6) return s+'Rp'+nf1.format(a/1e6)+' jt';
  if(a>=1e3) return s+'Rp'+nf0.format(a/1e3)+' rb';
  return s+'Rp'+nf0.format(a); };
const fmtN  = v => v==null?'–':nf0.format(Math.round(v));
const fmtNC = v => { if(v==null) return '–'; const a=Math.abs(v);
  if(a>=1e6) return nf1.format(v/1e6)+' jt';

/* ---------- data model ---------- */
const sum = a => a.reduce((x,y)=>x+(y||0),0);
const div = (a,b) => (b&&b!==0)? a/b : null;

function channelDays(ch){                       // merged base + overlay
  const out={};
  const keys=new Set([...Object.keys(ch.days||{}),...Object.keys(overlay[ch.id]||{})]);
  for(const k of keys){
    const base=(ch.days&&ch.days[k])?ch.days[k].slice():Array(DIM).fill(null);
    while(base.length<DIM) base.push(null);
    const ov=(overlay[ch.id]||{})[k]||{};
    for(const d in ov) base[+d]=ov[d];
    out[k]=base;
  }
  return out;
}

const CH = RAW.channels.map(c=>{
  const days=channelDays(c);
  const cost=days.cost||[], gmv=days.gmv||[], orders=days.orders||[];
  const imp=days.impressions||[], clk=days.clicks||[];
  let last=0; for(let d=0;d<DIM;d++) if((cost[d]||0)>0||(gmv[d]||0)>0||(orders[d]||0)>0) last=d+1;

});

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');

const SVGNS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function niceTicks(max,n=4){
  if(!(max>0)) return [0,1];
  const step0=max/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0);

}

function lineChart(container, series, labels, opts={}){

    tx.textContent=lb;}});
  for(const s of series){
    const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]);
    let dPath='', started=false;
    pts.forEach(p=>{ if(!p){started=false;return;} dPath+=(started?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); started=true;});

    let i=Math.round((sx-PADL)/(n<=1?1:iw/(n-1))); i=Math.max(0,Math.min(n-1,i));
    cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i)); cross.setAttribute('opacity',1);
    const rows=series.map(s=>s.values[i]==null?'':`<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><span class="v">${fmt(s.values[i])}</span></div>`).join('');
    showTip(`<div class="t">${esc(opts.tipTitle?opts.tipTitle(i):labels[i])}</div>${rows}`,ev.clientX,ev.clientY);
  });
  hot.addEventListener('pointerleave',()=>{cross.setAttribute('opacity',0);hideTip();});
  if(series.length>1 && !opts.noLegend){
    const lg=document.createElement('div');lg.className='legend';
    lg.innerHTML=series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
    box.appendChild(lg);
  }
  return box;
}
/* horizontal bars: items=[{name,value,color,extra}] */
function hBars(container, items, opts={}){
  const fmt=opts.fmt||fmtRpC;
  const max=Math.max(...items.map(i=>i.value||0),1);
  const div0=document.createElement('div');
  div0.innerHTML=items.map(it=>{
    const w=Math.max(1.2,100*(it.value||0)/max);
    return `<div style="display:flex;align-items:center;gap:10px;margin:7px 0">
      <span style="width:148px;flex:none;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}</span>
      <div style="flex:1"><div style="background:${it.color};height:16px;border-radius:0 4px 4px 0;width:${w}%;min-width:3px"></div></div>
      <span style="width:86px;flex:none;text-align:right;font-size:12px;font-weight:650;font-variant-numeric:tabular-nums">${fmt(it.value)}</span>
      ${it.extra?`<span style="width:64px;flex:none;text-align:right;font-size:11.5px;color:var(--muted)">${esc(it.extra)}</span>`:''}
    </div>`;}).join('');
  container.appendChild(div0);
}
/* grouped/stacked monthly bars: series=[{name,color,values[12]}] over month idxs */
function stackBars(container, series, mIdx, opts={}){
  const H=opts.height||200, PADL=46,PADR=12,PADT=12,PADB=22;
  const box=document.createElement('div');box.className='chart-box';container.appendChild(box);
  const W=Math.max(box.clientWidth||600,320);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H});box.appendChild(svg);
  const iw=W-PADL-PADR, ih=H-PADT-PADB;
  const totals=mIdx.map(m=>sum(series.map(s=>s.values[m]||0)));
  const ticks=niceTicks(Math.max(...totals,1)); const ymax=ticks[ticks.length-1]||1;
  const fmt=opts.fmt||fmtRpC;
  for(const t of ticks){
    el('line',{x1:PADL,x2:W-PADR,y1:PADT+ih-(t/ymax)*ih,y2:PADT+ih-(t/ymax)*ih,stroke:'var(--grid)'},svg);
    const tx=el('text',{x:PADL-7,y:PADT+ih-(t/ymax)*ih+3.5,'text-anchor':'end','font-size':10,fill:'var(--muted)'},svg);
    tx.textContent=fmt(t).replace('Rp','');
  }
  const bw=Math.min(46, iw/mIdx.length*0.55);
  mIdx.forEach((m,k)=>{
    const cx=PADL+iw*(k+0.5)/mIdx.length;
    let y=PADT+ih;
    const segs=[];
    series.forEach(s=>{
      const v=s.values[m]||0; if(v<=0)return;
      const h=Math.max(0,(v/ymax)*ih - 2);        // 2px surface gap between segments
      y-=h; segs.push({s,v,y,h}); y-=2;
    });
    segs.forEach((sg,si)=>{
      const isTop=si===segs.length-1;
      el('rect',{x:cx-bw/2,y:sg.y,width:bw,height:sg.h,fill:sg.s.color,rx:isTop?4:0},svg);
    });
    const tx=el('text',{x:cx,y:H-6,'text-anchor':'middle','font-size':10,fill:'var(--muted)'},svg);
    tx.textContent=MONTHS_S[m];
    const hot=el('rect',{x:cx-bw/2-4,y:PADT,width:bw+8,height:ih,fill:'transparent'},svg);
    hot.addEventListener('pointermove',ev=>{
      const rows=series.map(s=>{const v=s.values[m];return v?`<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><span class="v">${fmt(v)}</span></div>`:''}).join('');
      showTip(`<div class="t">${MONTHS[m]}</div>${rows}<div class="r" style="margin-top:3px;border-top:1px solid var(--grid);padding-top:3px"><span>Total</span><span class="v">${fmt(totals[k])}</span></div>`,ev.clientX,ev.clientY);
    });
    hot.addEventListener('pointerleave',hideTip);
  });
  el('line',{x1:PADL,x2:W-PADR,y1:PADT+ih,y2:PADT+ih,stroke:'var(--axis)'},svg);
  const lg=document.createElement('div');lg.className='legend';
  lg.innerHTML=series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  box.appendChild(lg);
  return box;
}
function spark(values,color,w=140,h=34){
  const vals=values.filter(v=>v!=null); if(!vals.length) return '';
  const max=Math.max(...vals),min=Math.min(...vals),n=values.length;
  const X=i=>2+(w-4)*i/(n-1||1), Y=v=>h-4-(h-8)*((v-min)/((max-min)||1));
  let d='',st=false;
  values.forEach((v,i)=>{if(v==null){st=false;return}d+=(st?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);st=true;});
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" height="${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
}
</script>
<script>
'use strict';
/* =================== ANALYTICS ENGINE =================== */
const avg=(a)=>{const v=a.filter(x=>x!=null);return v.length?sum(v)/v.length:null};
const median=(a)=>{const v=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!v.length)return null;
  const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2;};
function windowVals(arr, endDay, len){ // endDay = 1-based inclusive
  const s=Math.max(0,endDay-len); return (arr||[]).slice(s,endDay);
}
function dailyRoas(ch){
  const c=ch.days.cost||[],g=ch.days.gmv||[];
  return c.map((v,i)=> (v&&g[i]!=null)? (g[i]/v) : null);
}
const SEV={critical:0,serious:1,warning:2,info:3};
const SEV_LBL={critical:'KRITIS',serious:'SERIUS',warning:'PERHATIAN',info:'INFO',opp:'PELUANG'};
const SEV_CLS={critical:'crit',serious:'ser',warning:'warn',info:'info',opp:'opp'};
const SEV_IC={critical:'⛔',serious:'🔻',warning:'⚠️',info:'ℹ️',opp:'🚀'};

const SOP={
  shopeeTurunModal:'Turunkan modal harian campaign ber-ROAS <10 ke level “ROAS Kecil” (Rp40.008–Rp60.012) sesuai SOP Budget Shopee Ads.',
  shopeeGeser:'Geser budget ke 5 campaign ROAS tertinggi (GMV Max ROAS) — jangan matikan campaign learning <7 hari.',
  shopeeStok:'Cek stok, harga & voucher produk utama di Seller Center — penurunan ROAS sering dipicu stok habis / voucher berakhir.',
  ttCreative:'Rotasi 2–3 kreatif video baru; matikan video dengan CTR di bawah rata-rata channel. Fatigue umumnya muncul hari ke-7–14.',
  ttRoi:'Tinjau target ROI GMV Max — ubah bertahap (maks 1× per hari) agar learning tidak reset.',
  metaAudiens:'Cek overlap audiens RMK vs PTR di Ads Manager; pisahkan exclusion agar tidak saling kanibal.',
  metaKatalog:'Refresh product set CPAS: keluarkan produk stok habis, prioritaskan produk AOV tinggi.',
  scaling:'Scaling sehat: naikkan modal bertahap maks 20–30% per 2 hari supaya CPP tidak melonjak.',
  peak:'Menjelang tanggal kembar/payday: naikkan modal ke level Peak pada H-1, H, dan H+1 sesuai SOP.',
};

function computeAlerts(){
  const alerts=[], opps=[];
  const push=(sev,ch,title,why,actions,metric)=>alerts.push({sev,ch,title,why,actions,metric});
  for(const ch of CH){
    const isSales=ch.objective==='sales';
    const T=targets[ch.id]||8;
    const cost=ch.days.cost||[], gmv=ch.days.gmv||[];
    /* -- data availability -- */
    if(ch.last===0){
      if((ch.budget||0)>0) push('info',ch,'Belum ada data '+RAW.meta.month.split(' ')[0],
        `Budget ${fmtRpC(ch.budget)} sudah dialokasikan tetapi belum ada biaya/pesanan tercatat.`,
        ['Tarik data dari platform (ekspor harian) lalu masukkan lewat tab Data ▸ Import.',
         'Jika campaign memang belum jalan, pastikan jadwal aktivasi & materi sudah siap.']);
      continue;
    }
    if(ch.last < GLOBAL_LAST-1)
      push('info',ch,`Data tertinggal ${GLOBAL_LAST-ch.last} hari`,
        `Data terakhir hari ke-${ch.last}, sementara channel lain sudah sampai hari ke-${GLOBAL_LAST}.`,
        ['Tarik ulang laporan periode yang kosong lalu import di tab Data.']);
    if(!isSales) continue;

    /* -- ROAS vs target (MTD) -- */
    if(ch.roas!=null){
      if(ch.roas < T*0.7)
        push('serious',ch,`ROAS ${fmtX(ch.roas)} jauh di bawah target ${fmtX(T)}`,
          `Sepanjang bulan berjalan, setiap Rp1 iklan hanya menghasilkan ${nf1.format(ch.roas)} — target ${nf1.format(T)}.`,
          actionRoas(ch), {k:'ROAS MTD', v:fmtX(ch.roas), t:'Target '+fmtX(T)});
      else if(ch.roas < T)
        push('warning',ch,`ROAS ${fmtX(ch.roas)} di bawah target ${fmtX(T)}`,
          `Selisih ${nf1.format(100*(1-ch.roas/T))}% dari target — masih bisa dikejar dengan optimasi campaign.`,
          actionRoas(ch), {k:'ROAS MTD', v:fmtX(ch.roas), t:'Target '+fmtX(T)});
    }
    /* -- tren turun: bandingkan 3 hari terakhir vs 7 hari sebelumnya -- */
    if(ch.last>=6){
      const roasD=dailyRoas(ch);
      const trend=(arr,name,fmt)=>{
        const rec=avg(windowVals(arr,ch.last,3));
        /* median 7-hari agar baseline tidak terdistorsi lonjakan tanggal kembar/payday */
        const base=median(windowVals(arr,Math.max(0,ch.last-3),7));
        if(rec==null||base==null||base<=0) return null;
        return {rec,base,drop:100*(1-rec/base),name,fmt};
      };
      const tR=trend(roasD,'ROAS',fmtX), tG=trend(gmv,'GMV harian',fmtRpC), tC=trend(cost,'Spend harian',fmtRpC);
      if(tR && tR.drop>=20)
        push(tR.drop>=35?'critical':'serious',ch,
          `ROAS turun ${nf0.format(tR.drop)}% dalam 3 hari terakhir`,
          `Rata-rata 3 hari terakhir ${fmtX(tR.rec)} vs baseline 7 hari ${fmtX(tR.base)}.`,
          actionRoas(ch), {k:'ROAS 3 hari', v:fmtX(tR.rec), t:'Baseline '+fmtX(tR.base)});
      if(tG && tG.drop>=25 && !(tC && tC.drop>=25))
        push('serious',ch,`GMV harian turun ${nf0.format(tG.drop)}% padahal spend stabil`,
          `GMV 3 hari terakhir rata-rata ${fmtRpC(tG.rec)} vs baseline ${fmtRpC(tG.base)}; biaya tidak turun sebanyak itu → efisiensi memburuk.`,
          actionRoas(ch));
      else if(tG && tG.drop>=25 && tC && tC.drop>=25)
        push('warning',ch,`Spend & GMV sama-sama turun ${nf0.format(tC.drop)}%`,
          `Penurunan seiring — kemungkinan budget dikurangi/limit tercapai, bukan masalah performa.`,
          ['Kembalikan modal harian ke level BAU bila penurunan tidak disengaja.', SOP.scaling]);
      /* creative fatigue: CTOR turun */
      const clk=ch.days.clicks||[], ord=ch.days.orders||[];
      const ctorD=clk.map((v,i)=> v? 100*(ord[i]||0)/v : null);
      const tCt=trend(ctorD,'CTOR',fmtPct);
      if(tCt && tCt.drop>=20 && (ch.tot.clk||0)>500)
        push('warning',ch,`CTOR melemah ${nf0.format(tCt.drop)}% — indikasi klik tidak jadi beli`,
          `CTOR 3 hari terakhir ${fmtPct(tCt.rec)} vs baseline ${fmtPct(tCt.base)}. Traffic masih datang tapi konversinya menurun.`,
          [SOP.shopeeStok,'Cek halaman produk: rating terbaru, ulasan negatif, dan kecepatan respon chat.',
           ch.platform==='tiktok'?SOP.ttCreative:'Refresh kreatif/thumbnail utama & judul produk.']);
    }
    /* -- pacing budget -- */
    if((ch.budget||0)>0 && ch.last>=3){
      const proj = ch.tot.cost/ch.last*DIM;
      const pace = ch.tot.cost/(ch.budget*ch.last/DIM);
      if(pace>1.2 && ch.roas!=null && ch.roas>=T)
        push('info',ch,`Spend ${nf0.format((pace-1)*100)}% di atas pace budget — tapi ROAS sehat`,
          `Proyeksi habis bulan ${fmtRpC(proj)} vs budget ${fmtRpC(ch.budget)}. ROAS ${fmtX(ch.roas)} ≥ target, jadi overspend ini produktif.`,
          ['Ajukan penyesuaian budget bulanan bila ingin mempertahankan laju ini.',SOP.scaling]);
      else if(pace>1.2)
        push('warning',ch,`Overspend ${nf0.format((pace-1)*100)}% dengan ROAS di bawah target`,
          `Proyeksi ${fmtRpC(proj)} vs budget ${fmtRpC(ch.budget)}, sementara ROAS ${fmtX(ch.roas)} < target ${fmtX(T)}.`,
          ['Tahan dulu laju spend: kembalikan modal harian ke BAU.',...actionRoas(ch).slice(0,2)]);
      else if(pace<0.6)
        push('warning',ch,`Budget terpakai lambat (${nf0.format(pace*100)}% dari pace)`,
          `Baru ${fmtRpC(ch.tot.cost)} dari budget ${fmtRpC(ch.budget)} — sisa ${fmtRpC(ch.budget-ch.tot.cost)} berisiko hangus di akhir bulan.`,
          ['Naikkan modal harian bertahap 20–30% per 2 hari pada campaign ROAS terbaik.',
           ch.platform==='shopee'?'Tambah kampanye produk baru (modal awal Rp75.015 sesuai SOP).':SOP.scaling]);
    }
    /* -- peluang scale-up -- */
    if(ch.roas!=null && ch.roas>=T*1.2 && ch.last>=5){
      const pace=(ch.budget||0)>0? ch.tot.cost/(ch.budget*ch.last/DIM) : 0;
      if(pace<=1.05)
        opps.push({ch,title:`ROAS ${fmtX(ch.roas)} — ${nf0.format(100*ch.roas/T-100)}% di atas target. Kandidat scale-up.`,
          why:`Spend masih ${pace?nf0.format(pace*100)+'% dari pace budget':'di bawah pace'}; ruang naik tanpa mengorbankan efisiensi.`,
          actions:[SOP.scaling, ch.platform==='shopee'?SOP.shopeeGeser:(ch.platform==='tiktok'?SOP.ttRoi:SOP.metaKatalog), SOP.peak]});
    }
  }
  alerts.sort((a,b)=>SEV[a.sev]-SEV[b.sev]);
  /* maksimal 2 warning aktif per channel supaya daftar tetap actionable */
  const perCh={}, kept=[];
  for(const a of alerts){
    if(a.sev==='info'){kept.push(a);continue;}
    perCh[a.ch.id]=(perCh[a.ch.id]||0)+1;
    if(perCh[a.ch.id]<=2) kept.push(a);
  }
  return {alerts:kept,opps};
}
function actionRoas(ch){
  if(ch.platform==='shopee') return [SOP.shopeeTurunModal,SOP.shopeeGeser,SOP.shopeeStok];
  if(ch.platform==='tiktok') return [SOP.ttCreative,SOP.ttRoi,'Cek harga & voucher vs kompetitor pada produk hero.'];
  if(ch.platform==='meta')   return [SOP.metaAudiens,SOP.metaKatalog,'Uji kreatif carousel vs collection; pindahkan budget ke adset ROAS terbaik.'];
  return ['Audit kata kunci & penawaran; alihkan budget ke SKU dengan konversi terbaik.'];
}
let ALERTS=computeAlerts();

/* =================== VIEW HELPERS =================== */
const view=document.getElementById('view');
const dayLabels=Array.from({length:DIM},(_,i)=>String(i+1));
const daysShown=GLOBAL_LAST;
const platChip=p=>`<span class="plat-chip"><span class="dot" style="background:${pcolor(p)}"></span>${PLATFORMS[p].name}</span>`;
function pill(roas,t){
  if(roas==null) return '<span class="pill-stat mid">n/a</span>';
  if(roas>=t) return `<span class="pill-stat ok">✓ ${fmtX(roas)}</span>`;
  if(roas>=t*0.7) return `<span class="pill-stat mid">△ ${fmtX(roas)}</span>`;
  return `<span class="pill-stat bad">✕ ${fmtX(roas)}</span>`;
}
function deltaHtml(cur,prev,goodUp=true,fmt=fmtRpC){
  if(cur==null||prev==null||prev===0) return '<span class="delta">vs Jun: –</span>';
  const d=100*(cur-prev)/Math.abs(prev);
  const up=d>=0, good=(up===goodUp);
  return `<span class="delta"><b class="${good?'up':'dn'}">${up?'▲':'▼'} ${nf1.format(Math.abs(d))}%</b> vs ${MONTHS_S[PREV_M]}</span>`;
}
function kpiTile(lbl,val,extra,sparkHtml,color){
  return `<div class="card kpi">
    <div class="lbl">${color?`<span class="dot" style="background:${color}"></span>`:''}${esc(lbl)}</div>
    <div class="val">${val}</div>
    ${extra||''}
    ${sparkHtml||''}
  </div>`;
}
function alertHtml(a,sevKey){
  const sev=sevKey||a.sev;
  return `<div class="alert ${SEV_CLS[sev]}">
    <div class="ic">${SEV_IC[sev]}</div>
    <div class="bd">
      <div class="hd"><span class="sev">${SEV_LBL[sev]}</span> ${platChip(a.ch.platform)} <b>${esc(a.ch.name)}</b>
        ${a.metric?`<span style="font-size:11.5px;color:var(--muted)">${esc(a.metric.k)}: <b style="color:var(--ink)">${a.metric.v}</b> · ${esc(a.metric.t)}</span>`:''}</div>
      <div style="font-weight:650;font-size:13.5px">${esc(a.title)}</div>
      <div class="why">${esc(a.why)}</div>
      ${a.actions&&a.actions.length?`<ul class="acts"><span class="tag" style="font-size:11.5px;color:var(--muted)">ACTION PLAN</span>${a.actions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    </div></div>`;
}

/* =================== VIEWS =================== */
function renderOverview(){
  const A=AGG.all, last=GLOBAL_LAST;
  const mtd={cost:sum(A.cost),gmv:sum(A.gmv),orders:sum(A.orders)};

  ALERTS.alerts.forEach(a=>sevCount[a.sev]++);
  view.innerHTML=`
  <h2 class="sec">Ringkasan All Platform <span class="hint">MTD ${RAW.meta.month} · data s/d hari ke-${last}</span></h2>

    ${kpiTile('Total Spend (Sales)',fmtRpC(mtd.cost),deltaHtml(mtd.cost,prevPro('salesCost'),false),spark(A.cost.slice(0,last),'var(--ink-2)'))}

    ${kpiTile('Cost / Order',fmtRpC(cpo),deltaHtml(cpo,MON.cpo[jn],false))}
    ${kpiTile('AOV',fmtRpC(aov),deltaHtml(aov,MON.aov[jn]))}
  </div>
  ${ALERTS.alerts.length?`<div class="card" style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center">
    <b style="font-size:13px">🔎 Health check:</b>

    ${ALERTS.opps.length?`<span class="pill-stat ok">🚀 ${ALERTS.opps.length} peluang</span>`:''}
    <a href="#/analisis" style="margin-left:auto;font-size:12.5px;font-weight:650">Lihat analisis & action plan →</a>
  </div>`:''}
  <div class="grid g-2" style="margin-top:12px">
    <div class="card"><h3>GMV Harian per Platform <span class="hint">· Rp</span></h3><div id="ovGmv"></div></div>
    <div class="card"><h3>Spend Harian per Platform <span class="hint">· Rp</span></h3><div id="ovCost"></div></div>
  </div>
  <div class="grid g-2" style="margin-top:12px">
    <div class="card"><h3>Kontribusi GMV per Platform <span class="hint">· MTD</span></h3><div id="ovShare"></div></div>
    <div class="card"><h3>Top Channel by GMV <span class="hint">· MTD</span></h3><div id="ovTop"></div></div>
  </div>
  <h2 class="sec">Ringkasan per Platform</h2>
  <div class="tbl-wrap"><table><thead><tr>
    <th>Platform</th><th>Spend</th><th>GMV</th><th>ROAS</th><th>Orders</th><th>CPO</th><th>AOV</th><th>Channel aktif</th>
  </tr></thead><tbody>${Object.keys(PLATFORMS).map(p=>{
    const c=sum(AGG[p].cost),g=sum(AGG[p].gmv),o=sum(AGG[p].orders);
    const act=SALES.filter(x=>x.platform===p&&x.last>0).length, tot=SALES.filter(x=>x.platform===p).length;
    return `<tr class="click" data-nav="#/platform"><td>${platChip(p)}</td><td class="num">${fmtRpC(c)}</td><td class="num">${fmtRpC(g)}</td>

/* ---------- Data / Import ---------- */
function detectFormat(text){
  const first=text.slice(0,400);
  if(first.includes('Semua Laporan Iklan CPC')) return 'shopee_cpc';
  if(first.includes('Laporan Iklan Toko')) return 'shopee_toko';
  if(first.includes('Search Brand Ads Report')) return 'shopee_sba';
  if(/Campaign name/i.test(first) && /Day/i.test(first)) return 'meta';
  return null;
}
function csvParse(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else if(ch!=='\r') cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
const idnum=v=>{if(v==null)return null;v=String(v).trim().replace(/[Rp%\s]/g,'').replace(/\./g,'').replace(',', '.');
  if(v===''||v==='-')return null;const n=parseFloat(v);return isNaN(n)?null:n;};
const plainnum=v=>{if(v==null)return null;v=String(v).trim().replace(/[Rp%\s]/g,'').replace(/,/g,'');
  if(v===''||v==='-')return null;const n=parseFloat(v);return isNaN(n)?null:n;};
function parseImport(text){
  const kind=detectFormat(text);
  if(!kind) return {error:'Format tidak dikenali. Gunakan ekspor CSV Shopee (Iklan CPC / Iklan Toko / SBA) atau CSV Meta (kolom Campaign name + Day). Untuk file Excel Meta: buka lalu Save As CSV.'};
  const rows=csvParse(text);
  if(kind==='meta'){
    const hi=rows.findIndex(r=>r.join(',').includes('Campaign name'));
    const H=rows[hi].map(s=>s.trim());
    const col=n=>H.findIndex(h=>h.toLowerCase()===n.toLowerCase());
    const cDay=col('Day'), cSpent=H.findIndex(h=>/amount spent/i.test(h));
    const cPur=H.findIndex(h=>/^purchases with shared/i.test(h));
    const cVal=H.findIndex(h=>/^purchases conversion value/i.test(h));
    const cClk=H.findIndex(h=>/link clicks/i.test(h));
    const cReach=col('Reach'), cImp=col('Impressions');
    const daily={};
    for(const r of rows.slice(hi+1)){
      const d=(r[cDay]||'').slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
      const o=daily[d]??={cost:0,gmv:0,orders:0,clicks:0,reach:0,impressions:0};
      o.cost+=plainnum(r[cSpent])||0; o.gmv+=cVal>=0?plainnum(r[cVal])||0:0;
      o.orders+=cPur>=0?plainnum(r[cPur])||0:0; o.clicks+=cClk>=0?plainnum(r[cClk])||0:0;
      o.reach+=cReach>=0?plainnum(r[cReach])||0:0; o.impressions+=cImp>=0?plainnum(r[cImp])||0:0;
    }
    const days=Object.keys(daily).sort();
    if(!days.length) return {error:'Tidak ada baris harian valid (kolom Day format YYYY-MM-DD).'};
    return {kind,daily,label:`Meta CSV — ${days.length} hari (${days[0]} s/d ${days[days.length-1]})`,defaultCh:'meta_cpas'};
  }
  /* Shopee: satu periode per file */
  const perLine=rows.find(r=>r[0]&&r[0].trim()==='Periode');
  let date=null;
  if(perLine){const m=String(perLine[1]||'').match(/(\d{2})\/(\d{2})\/(\d{4})\s*-\s*(\d{2})\/(\d{2})\/(\d{4})/);
    if(m&&m[1]===m[4]&&m[2]===m[5]) date=`${m[3]}-${m[2]}-${m[1]}`;
    else if(m) date=`${m[6]}-${m[5]}-${m[4]}`;}
  const hi=rows.findIndex(r=>r[0]&&r[0].trim()==='Urutan');
  if(hi<0) return {error:'Header tabel (kolom "Urutan") tidak ditemukan.'};
  const H=rows[hi].map(s=>s.trim());
  const ix=n=>H.indexOf(n);
  const cBiaya=ix('Biaya'), cOmzet=ix('Omzet Penjualan'),
        cKonv=ix('Konversi')>=0?ix('Konversi'):ix('Pesanan'),
        cLihat=ix('Dilihat'), cKlik=ix('Jumlah Klik');
  let cost=0,gmv=0,orders=0,imp=0,clk=0,n=0,active=0;
  for(const r of rows.slice(hi+1)){
    if(!r[0]||!/^\d+$/.test(String(r[0]).trim())) continue;
    n++;
    const b=plainnum(r[cBiaya])||0;
    if(b<=0) continue;            // ambil campaign yang ada biaya, sesuai alur kerja
    active++;
    cost+=b; gmv+=plainnum(r[cOmzet])||0; orders+=plainnum(r[cKonv])||0;
    imp+=plainnum(r[cLihat])||0; clk+=plainnum(r[cKlik])||0;
  }
  const defaultCh=kind==='shopee_toko'?'sp_store':kind==='shopee_sba'?'sp_sba':'sp_pc';
  return {kind,date,single:{cost,gmv,orders,impressions:imp,clicks:clk},
    label:`${kind==='shopee_cpc'?'Shopee Iklan CPC':kind==='shopee_toko'?'Shopee Iklan Toko':'Shopee SBA'} — ${active}/${n} campaign berbiaya${date?' · '+date:''}`,defaultCh};
}
let pendingImport=null;
function renderData(){
  const ovEntries=[];
  for(const cid in overlay) for(const m in overlay[cid]) for(const d in overlay[cid][m])
    ovEntries.push({cid,m,d:+d,v:overlay[cid][m][d]});
  view.innerHTML=`
  <h2 class="sec">Data & Import <span class="hint">alur sama dengan tab RAW di Google Sheet Anda</span></h2>
  <div class="grid g-2">
    <div class="card">
      <h3>1 · Import Raw Data</h3>
      <p class="note" style="margin:0 0 8px">Tempel isi file CSV ekspor platform, atau pilih file. Format yang dikenali otomatis:
      Shopee <b>Iklan CPC</b> (produk / produk baru), <b>Iklan Toko</b>, <b>SBA</b>, dan <b>Meta CSV</b> (per hari).
      File Excel Meta: buka lalu <i>Save as CSV</i> dulu.</p>
      <input type="file" id="impFile" accept=".csv,.txt" style="margin-bottom:8px">
      <textarea id="impText" placeholder="…atau tempel isi CSV di sini"></textarea>
      <div style="margin-top:8px;display:flex;gap:8px"><button class="btn" id="impParse">Deteksi & preview</button></div>
      <div id="impPrev" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h3>2 · Input Manual Harian</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <label>Channel<br><select id="mCh" style="width:100%">${dailyOptions(false)}</select></label>
        <label>Tanggal<br><input type="date" id="mDate" style="width:100%" min="${RAW.meta.year}-07-01" max="${RAW.meta.year}-07-31" value="${RAW.meta.year}-07-${String(Math.min(GLOBAL_LAST+1,DIM)).padStart(2,'0')}"></label>
        <label>Ads Cost (Rp)<br><input type="number" id="mCost" style="width:100%"></label>
        <label>GMV (Rp)<br><input type="number" id="mGmv" style="width:100%"></label>
        <label>Orders<br><input type="number" id="mOrd" style="width:100%"></label>
        <label>Impressions<br><input type="number" id="mImp" style="width:100%"></label>
        <label>Product Clicks<br><input type="number" id="mClk" style="width:100%"></label>
      </div>
      <div style="margin-top:10px"><button class="btn" id="mSave">Simpan ke database</button></div>
      <p class="note">Data tersimpan sebagai overlay di browser (localStorage) di atas data dasar dari Google Sheet — tidak mengubah sheet aslinya.</p>
    </div>
  </div>
  <h2 class="sec">Overlay aktif <span class="hint">${ovEntries.length} sel diubah/ditambah</span></h2>
  <div class="card">
    ${ovEntries.length?`<div class="tbl-wrap" style="border:0;max-height:260px;overflow:auto"><table><thead><tr><th>Channel</th><th>Metrik</th><th>Tanggal</th><th>Nilai</th></tr></thead>
      <tbody>${ovEntries.sort((a,b)=>a.cid.localeCompare(b.cid)||a.d-b.d).map(e=>`<tr><td>${esc(chById(e.cid)?.name||e.cid)}</td><td>${e.m}</td><td class="num">${e.d+1} Jul</td><td class="num">${['cost','gmv','atcValue'].includes(e.m)?fmtRp(e.v):fmtN(e.v)}</td></tr>`).join('')}</tbody></table></div>`:
      '<div class="empty">Belum ada perubahan — dashboard memakai data dasar dari Google Sheet + raw upload.</div>'}
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" id="expJson">⬇ Export JSON gabungan</button>
      ${ovEntries.length?'<button class="btn ghost" id="clrOv" style="color:var(--critical)">Hapus semua overlay</button>':''}
    </div>
  </div>
  <h2 class="sec">Struktur database</h2>
  <div class="card"><div class="tbl-wrap" style="border:0"><table>
    <thead><tr><th>Sumber raw (sheet)</th><th>Channel di dashboard</th><th>Platform</th><th>Metrik utama</th></tr></thead><tbody>
    <tr><td>RS Prod &amp; Toko</td><td>Iklan Produk · Iklan Toko</td><td>${platChip('shopee')}</td><td>Biaya, Omzet, Konversi, Dilihat, Klik</td></tr>
    <tr><td>RS Prod Baru</td><td>Iklan Produk Baru</td><td>${platChip('shopee')}</td><td>Biaya, Omzet, Konversi</td></tr>
    <tr><td>RS Live</td><td>Live Shopee Ads (LSA)</td><td>${platChip('shopee')}</td><td>Biaya, Omzet, Pesanan, Penonton</td></tr>
    <tr><td>LS SBA</td><td>Search Brand Ads (Banner)</td><td>${platChip('shopee')}</td><td>Biaya, Omzet, Pesanan, Dilihat</td></tr>
    <tr><td>RT Product Ads</td><td>VSA / VSA NS / Product Card (NS)</td><td>${platChip('tiktok')}</td><td>Biaya, Pendapatan kotor, Pesanan SKU, Impresi, Klik</td></tr>
    <tr><td>RT Live Ads + Produk Klik Live</td><td>Live Streaming SMO/SID/SMV/Aff</td><td>${platChip('tiktok')}</td><td>Biaya, Pendapatan, Pesanan, Tayangan LIVE, Produk Klik</td></tr>
    <tr><td>RT Upper Funnel</td><td>Awareness / Consideration / CI</td><td>${platChip('tiktok')}</td><td>Cost, Reach, Impressions, Follows</td></tr>
    <tr><td>RAW Meta</td><td>CPAS Sales · Awareness · Traffic</td><td>${platChip('meta')}</td><td>Spent, Purchases, Conv. Value, Link Clicks</td></tr>
  </tbody></table></div></div>`;
  const fileEl=document.getElementById('impFile');
  fileEl.onchange=()=>{const f=fileEl.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{document.getElementById('impText').value=rd.result;doParse();};rd.readAsText(f);};
  document.getElementById('impParse').onclick=doParse;
  function doParse(){
    const text=document.getElementById('impText').value;
    if(!text.trim())return;
    const res=parseImport(text); pendingImport=res;
    const prev=document.getElementById('impPrev');
    if(res.error){prev.innerHTML=`<div class="alert warn" style="margin:0"><div class="ic">⚠️</div><div class="bd">${esc(res.error)}</div></div>`;return;}
    const chOpts=CH.map(c=>`<option value="${c.id}" ${c.id===res.defaultCh?'selected':''}>${PLATFORMS[c.platform].name} — ${esc(c.name)}</option>`).join('');
    if(res.kind==='meta'){
      const days=Object.keys(res.daily).sort();
      prev.innerHTML=`<div class="alert opp" style="margin:0"><div class="ic">✓</div><div class="bd">
        <b>${esc(res.label)}</b>
        <div class="why">Total: ${fmtRpC(sum(days.map(d=>res.daily[d].cost)))} spend · ${fmtRpC(sum(days.map(d=>res.daily[d].gmv)))} GMV · ${fmtN(sum(days.map(d=>res.daily[d].orders)))} orders</div>
        <div class="controls" style="margin:8px 0 0"><label>Masukkan ke:</label><select id="impCh">${chOpts}</select>
        <button class="btn" id="impSave">Simpan</button></div></div></div>`;
    } else {
      prev.innerHTML=`<div class="alert opp" style="margin:0"><div class="ic">✓</div><div class="bd">
        <b>${esc(res.label)}</b>
        <div class="why">Agregat campaign berbiaya: ${fmtRpC(res.single.cost)} spend · ${fmtRpC(res.single.gmv)} omzet · ${fmtN(res.single.orders)} konversi</div>
        <div class="controls" style="margin:8px 0 0">
          <label>Channel:</label><select id="impCh">${chOpts}</select>
          <label>Tanggal:</label><input type="date" id="impDate" value="${res.date||''}" min="${RAW.meta.year}-07-01" max="${RAW.meta.year}-07-31">
          <button class="btn" id="impSave">Simpan</button></div></div></div>`;
    }
    document.getElementById('impSave').onclick=()=>{
      const cid=document.getElementById('impCh').value;
      const put=(dateIso,vals)=>{
        const d=new Date(dateIso+'T00:00:00');
        if(d.getMonth()!==CUR_M||d.getFullYear()!==RAW.meta.year){alert('Tanggal di luar '+RAW.meta.month+' — dashboard versi ini menyimpan data harian '+RAW.meta.month+'.');return false;}
        const di=d.getDate()-1;
        overlay[cid]??={};
        for(const k in vals){ if(vals[k]==null)continue; (overlay[cid][k]??={})[di]=vals[k]; }
        return true;
      };
      let ok=true;
      if(res.kind==='meta'){ for(const d in res.daily) ok=put(d,res.daily[d])&&ok; }
      else{ const dt=document.getElementById('impDate').value;
        if(!dt){alert('Isi tanggal data (Periode ekspor Shopee).');return;}
        ok=put(dt,res.single); }
      if(ok){store.set(LS_O,overlay);location.reload();}
    };
  }
  document.getElementById('mSave').onclick=()=>{
    const cid=document.getElementById('mCh').value, dt=document.getElementById('mDate').value;
    if(!cid||!dt||cid==='all'||cid.startsWith('agg:'))return;
    const d=new Date(dt+'T00:00:00'); if(d.getMonth()!==CUR_M){alert('Tanggal harus di bulan '+RAW.meta.month);return;}
    const di=d.getDate()-1, vals={cost:'mCost',gmv:'mGmv',orders:'mOrd',impressions:'mImp',clicks:'mClk'};
    overlay[cid]??={};
    let any=false;
    for(const k in vals){const v=document.getElementById(vals[k]).value;
      if(v!==''){(overlay[cid][k]??={})[di]=parseFloat(v);any=true;}}
    if(!any)return;
    store.set(LS_O,overlay);location.reload();
  };
  document.getElementById('expJson').onclick=()=>{
    const out={meta:RAW.meta,exportedAt:new Date().toISOString(),channels:CH.map(c=>({id:c.id,platform:c.platform,name:c.name,budget:c.budget,days:c.days,totals:c.tot,roas:c.roas}))};
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
    a.download='ads-database-juli-2026.json';a.click();
  };
  const clr=document.getElementById('clrOv');
  if(clr)clr.onclick=()=>{if(confirm('Hapus semua data overlay? Dashboard kembali ke data dasar.')){overlay={};store.set(LS_O,overlay);location.reload();}};
}

/* =================== ROUTER & BOOT =================== */
const TABS=[
  ['ringkasan','Ringkasan',renderOverview],
  ['harian','Harian',renderDaily],
  ['bulanan','Bulanan',renderMonthly],
  ['platform','Platform',renderPlatforms],
  ['analisis','Analisis',renderAnalytics],
  ['data','Data',renderData],
];
let curTab='ringkasan';
function updateBadge(){
  ALERTS=computeAlerts();
  const n=ALERTS.alerts.filter(a=>a.sev==='critical'||a.sev==='serious'||a.sev==='warning').length;
  const b=document.querySelector('nav.tabs button[data-tab="analisis"]');
  if(b) b.innerHTML='Analisis'+(n?`<span class="n">${n}</span>`:'');
}
function nav(){
  const h=(location.hash||'#/ringkasan').replace('#/','');
  const t=TABS.find(t=>t[0]===h)||TABS[0];
  curTab=t[0];
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===curTab));
  view.innerHTML=''; t[2]();
  window.scrollTo({top:0});
}
function boot(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML=TABS.map(t=>`<button data-tab="${t[0]}">${t[1]}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>location.hash='#/'+b.dataset.tab);
  document.getElementById('asOfPill').textContent='Data s/d '+GLOBAL_LAST+' Jul';
  /* theme */
  const mq=matchMedia('(prefers-color-scheme: dark)');
  const applyOs=()=>document.documentElement.dataset.osdark=mq.matches?'1':'0';
  applyOs(); mq.addEventListener('change',applyOs);
  const saved=store.get(LS_TH,null);
  if(saved) document.documentElement.dataset.theme=saved;
  document.getElementById('themeBtn').onclick=()=>{
    const cur=document.documentElement.dataset.theme;
    const isDark=cur? cur==='dark' : mq.matches;
    const next=isDark?'light':'dark';
    document.documentElement.dataset.theme=next; store.set(LS_TH,next);
    nav();
  };
  updateBadge();
  addEventListener('hashchange',nav);
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(nav,220);});
  document.body.addEventListener('click',e=>{
    const tr=e.target.closest('tr[data-nav]'); if(tr) location.hash=tr.dataset.nav;
  });
  nav();
}
boot();
