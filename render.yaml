# Deploy satu klik ke Render (https://render.com): New > Blueprint > pilih repo ini.
services:
  - type: web
    name: idx-swing-engine
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: REFRESH_MINUTES
        value: "15"
