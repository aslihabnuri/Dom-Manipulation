/* =================== PARSER "Puresia Worksheet (Ads)" ===================
   Membaca dump teks Google Sheet (hasil read_file_content connector Drive):
   tabel-tabel markdown dipisah baris kosong. Dipakai dua arah:
   - build data dasar dashboard (node), dan
   - tombol "Sinkron dari Drive" di artifact (browser).
   Mengembalikan {months, mom, warnings}. */
function parsePuresiaDump(text){
  const warnings=[];
  const MONTH_NUM={jan:1,feb:2,mar:3,mrt:3,apr:4,may:5,mei:5,jun:6,jul:7,aug:8,agu:8,agt:8,sep:9,oct:10,okt:10,nov:11,dec:12,des:12,januari:1,january:1,februari:2,february:2,maret:3,march:3,april:4,june:6,juni:6,july:7,juli:7,august:8,agustus:8,september:9,october:10,oktober:10,november:11,december:12,desember:12};
  const daysIn=(y,m)=>[31,(y%4===0&&y%100!==0)||y%400===0?29:28,31,30,31,30,31,31,30,31,30,31][m-1];
  const clean=s=>String(s==null?'':s).replace(/\\\[merged\\\]\s*/g,'').replace(/\[merged\]\s*/g,'').trim();
  function num(s){
    if(s==null)return null;
    s=clean(s).replace(/\\-/g,'-');
    if(!s||s==='-'||/#DIV|#REF|#N\/A/i.test(s))return null;
    const m=s.match(/^-?\s*(?:Rp\s*)?(-?[\d.,]+)\s*%?x?$/i);
    if(!m)return null;
    let t=m[1];const neg=/^-/.test(s)||/^-/.test(t);
    t=t.replace(/-/g,'');
    // ribuan pakai koma, desimal pakai titik
    t=t.replace(/,/g,'');
    const v=parseFloat(t);
    if(!isFinite(v))return null;
    return neg?-v:v;
  }
  const monthOf=lbl=>{const m=String(lbl).trim().match(/^(\d{1,2})\s+([A-Za-z]+)/);if(!m)return null;
    const mo=MONTH_NUM[m[2].toLowerCase()];return mo?{day:+m[1],month:mo}:null;};

  // ---- pecah jadi blok tabel
  const lines=text.split(/\r?\n/);
  const blocks=[];let cur=null;
  for(const l of lines){
    if(l.trim()){ if(!cur){cur=[];blocks.push(cur);} cur.push(l); }
    else cur=null;
  }
  const rowsOf=b=>b.map(l=>l.split('|').map(c=>c.trim()));

  // ---- 1) rekap bulanan (mom): header 'Month'/'Metrics' + Januari..Desember
  const MONTH_HDR=/^(januari|january)$/i;
  const momByYear={}; // diisi setelah tahun diketahui
  const summaries=[]; // {rows:{name:[12]}, blockIndex}
  blocks.forEach((b,bi)=>{
    const rows=rowsOf(b);
    let hdr=-1,mcols=null;
    for(let i=0;i<rows.length&&i<6;i++){
      const c=rows[i].map(clean);
      const lab=c.find(x=>x);
      if((lab==='Month'||lab==='Metrics')){
        const idx=[];c.forEach((x,j)=>{const mo=MONTH_NUM[x.toLowerCase()];if(mo&&x.length>2)idx.push({j,mo});});
        if(idx.length>=6){hdr=i;mcols=idx;break;}
      }
    }
    if(hdr<0)return;
    const data={};let stop=false;
    for(let i=hdr+1;i<rows.length&&!stop;i++){
      const c=rows[i];const cc=c.map(clean);
      const li=cc.findIndex(x=>x);
      if(li<0)continue;
      const name=cc[li];
      if(cc.some(x=>/^Q[1-4]$/.test(x))){stop=true;continue;} // tabel kedua (Q1/Q2 dst.)
      if(name==='Metrics'||name==='Month'||name==='Value'||/^:?-+:?$/.test(name))continue;
      const arr=Array(12).fill(null);let any=false;
      for(const {j,mo} of mcols){ const v=num(c[j]); if(v!=null){arr[mo-1]=v;any=true;} }
      if(any&&!(name in data))data[name]=arr;
    }
    if(data['Total GMV From Ads'])summaries.push({rows:data,blockIndex:bi});
  });
  // tahun: rekap dgn 'Meta GMV' = 2025; dgn 'GMV by Meta CPAS' = 2026
  const hasJan=s=>{const t=s.rows['Total GMV From Ads']||[];return t[0]!=null&&t[0]>0;};
  for(const s of summaries){
    const y=hasJan(s)?'2026':'2025';
    if(!momByYear[y]){momByYear[y]=s.rows;s.year=+y;}
    else warnings.push('Rekap bulanan blok #'+s.blockIndex+' tidak dikenali tahunnya, dilewati');
  }
  // alias nama metrik 2025 -> gaya 2026 (dipakai tab MoM dashboard)
  const Y25=momByYear['2025'];
  if(Y25){
    if(Y25['Impressions']&&!Y25['Impression'])Y25['Impression']=Y25['Impressions'];
    if(Y25['Total GMV All MKP']&&!Y25['Total GMV All MP'])Y25['Total GMV All MP']=Y25['Total GMV All MKP'];
  }

  // ---- 2) tab harian LIVE SHOPPING ADS
  // seksi: judul (+subjudul) -> budget-hdr 'Product Type|Budget|..' -> baris nilai -> baris tracker 'LSA Tracker|1 Jan|..' -> baris metrik
  const METRIC_MAP={'ads cost':'cost','purchases conversion value':'gmv','orders':'orders','orders from ads':'orders','live views':'liveViews','product clicks':'clicks','cancel order':'cancel','reach':'reach','impression':'impressions','impressions':'impressions'};
  function routeSection(title){
    const t=title.toUpperCase();
    if(t.includes('OVERALL'))return null;
    if(t.includes('MONTHLY'))return null;
    if(t.includes('COMMUNITY INTERACTION'))return 'tt_ci_smv';
    if(t.includes('AFFI'))return 'tt_live_aff';
    if(t.includes('PURE'))return 'tt_live_smo';
    if(t.includes('BBW')||t.includes('SID'))return null;
    if(t.includes('BBO')||t.includes('SMO'))return 'tt_live_smo';
    if(t.includes('VIDEO SHOPPING ADS + PRODUCT')||t.includes('VSA & PSA'))return 'tt_vsa_psa';
    if(t.includes('PRODUCT CARD SHOPPING ADS')||t.includes('KARTU PRODUK'))return 'tt_psa';
    if(t.includes('VIDEO SHOPPING ADS'))return 'tt_vsa';
    if(t.includes('LIVE SHOPPING ADS'))return 'tt_live_all';
    return null;
  }
  const dailyTabs=[]; // {blockIndex, month, sections:[{ch,title,budget,metrics:{key:[..]},ncols}]}
  blocks.forEach((b,bi)=>{
    const rows=rowsOf(b);
    // apakah blok ini tab harian? cari baris tracker
    let isDaily=false;
    for(const c of rows){const cc=c.map(clean);const li=cc.findIndex(x=>x);
      if(li>=0&&/tracker$/i.test(cc[li])&&monthOf(cc.slice(li+1).find(x=>x)||''))
        {isDaily=true;break;}}
    if(!isDaily)return;
    const tab={blockIndex:bi,month:null,sections:[]};
    let title='',subtitle='',pendingBudget=null,expectBudgetVal=false;
    for(let i=0;i<rows.length;i++){
      const c=rows[i];const cc=c.map(clean);
      const li=cc.findIndex(x=>x);
      if(li<0)continue;
      const lab=cc[li];
      if(/^:?-+:?$/.test(lab))continue;
      const rest=cc.filter((x,j)=>j>li&&x);
      if(lab==='Product Type'){
        if(rest[0]==='Budget'){expectBudgetVal=true;continue;}
        if(expectBudgetVal){pendingBudget=num(rest[0]);expectBudgetVal=false;continue;}
        continue;
      }
      const dayLbl=monthOf(rest[0]||'');
      if(/tracker$/i.test(lab)&&dayLbl){
        // baris header hari -> mulai seksi data
        const ch=routeSection(title+' '+subtitle);
        const dayCols=[];// posisi kolom per tanggal
        c.forEach((x,j)=>{const d=monthOf(clean(x));if(d)dayCols.push({j,day:d.day});});
        const mo=dayLbl.month;
        if(tab.month&&tab.month!==mo)warnings.push('Blok #'+bi+': bulan campur ('+tab.month+' vs '+mo+')');
        tab.month=tab.month||mo;
        const sec={ch,title:(title+(subtitle?' / '+subtitle:'')).trim(),budget:pendingBudget,metrics:{},dayCols};
        pendingBudget=null;
        // baris metrik sampai judul seksi baru / tracker baru
        let j=i+1;
        for(;j<rows.length;j++){
          const rc=rows[j];const rcc=rc.map(clean);
          const rli=rcc.findIndex(x=>x);
          if(rli<0)continue;
          const rlab=rcc[rli];
          if(/^:?-+:?$/.test(rlab))continue;
          if(rlab==='Product Type'||/tracker$/i.test(rlab))break;
          const isMetric=METRIC_MAP[rlab.toLowerCase()];
          const hasNum=rc.some((x,k)=>k>rli&&num(x)!=null);
          if(!isMetric&&!hasNum)break; // judul seksi berikutnya
          if(isMetric){
            const vals=sec.dayCols.map(({j:cj})=>{const v=num(rc[cj]);return v==null?0:v;});
            sec.metrics[isMetric]=vals;
          }
          i=j;
        }
        if(ch&&Object.keys(sec.metrics).length)tab.sections.push(sec);
        else if(!ch&&!/overall|monthly/i.test(sec.title))warnings.push('Blok #'+bi+': seksi "'+sec.title+'" tidak dipetakan');
        title='';subtitle='';
        continue;
      }
      // baris teks polos = judul / subjudul seksi
      if(rest.length===0||rest.every(x=>x.startsWith('['))){
        if(!title)title=lab;else if(!subtitle)subtitle=lab;
        else {title=lab;subtitle='';}
        // judul baru menghapus subtitle lama jika sudah ada seksi jalan
        if(/LIVE SHOPPING|VIDEO SHOPPING|COMMUNITY|OVERALL|Monthly/i.test(lab)){title=lab;subtitle='';}
      } else if(/^LSA|^Live|^Video|^SBA/i.test(lab)&&rest.length<=1&&!num(rest[0])){
        subtitle=lab;
      }
    }
    if(tab.month&&tab.sections.length)dailyTabs.push(tab);
  });

  // ---- 3) tahun tab harian: cocokkan GMV live harian dgn baris 'GMV by Live Stream' rekap
  function tabCost(tab){let t=0;for(const s of tab.sections)for(const v of (s.metrics.cost||[]))t+=v;return t;}
  function tabLiveGmv(tab){let t=0;for(const s of tab.sections)
    if(['tt_live_all','tt_live_smo','tt_live_aff'].includes(s.ch))
      for(const v of (s.metrics.gmv||[]))t+=v;return t;}
  const sumIdx={};summaries.forEach(s=>{if(s.year)sumIdx[s.year]=s;});
  for(const tab of dailyTabs){
    const lg=tabLiveGmv(tab),c=tabCost(tab);
    let best=null,bestDiff=Infinity;
    for(const y of [2025,2026]){
      const s=momByYear[String(y)];if(!s)continue;
      const refL=(s['GMV by Live Stream']||[])[tab.month-1];
      const refC=(s['TikTok Ads Cost']||[])[tab.month-1];
      let diff=Infinity;
      if(refL&&lg)diff=Math.abs(refL-lg)/refL;
      else if(refC&&c)diff=Math.abs(refC-c)/refC;
      if(diff<bestDiff){bestDiff=diff;best=y;}
    }
    if(best!=null&&bestDiff<=0.5){tab.year=best;tab.__conf=true;}
    else{tab.year=best;tab.__conf=false;}
  }
  // fallback: tab tanpa kecocokan meyakinkan ikut tahun tab tetangga terdekat (blok berdekatan = era sama)
  for(const tab of dailyTabs){
    if(tab.__conf)continue;
    let near=null,nd=Infinity;
    for(const o of dailyTabs){if(!o.__conf)continue;const d=Math.abs(o.blockIndex-tab.blockIndex);if(d<nd){nd=d;near=o;}}
    if(near)tab.year=near.year;
    else if(tab.year==null)tab.year=2026;
  }
  // dedup bulan sama: pakai yang cost-nya terbesar
  const tabByMonth={};
  for(const tab of dailyTabs){
    const mk=tab.year+'-'+String(tab.month).padStart(2,'0');
    if(!tabByMonth[mk]||tabCost(tab)>tabCost(tabByMonth[mk])){
      if(tabByMonth[mk])warnings.push('Tab duplikat '+mk+' (blok #'+tabByMonth[mk].blockIndex+') dilewati');
      tabByMonth[mk]=tab;
    } else warnings.push('Tab duplikat '+mk+' (blok #'+tab.blockIndex+') dilewati');
  }

  // ---- 4) susun months dari tab harian
  const months={};
  const ensure=(mk,y,m)=>months[mk]||(months[mk]={days:daysIn(y,m),budgets:{},series:{}});
  for(const mk in tabByMonth){
    const tab=tabByMonth[mk];const y=tab.year,m=tab.month;
    const mo=ensure(mk,y,m);
    for(const sec of tab.sections){
      const tgt=mo.series[sec.ch]||(mo.series[sec.ch]={});
      for(const k in sec.metrics){
        let vals=sec.metrics[k];
        if(vals.length>mo.days){
          const extra=vals.slice(mo.days).reduce((a,b)=>a+b,0);
          if(extra>0)warnings.push(mk+' '+sec.ch+': nilai di kolom hari > '+mo.days+' diabaikan ('+extra+')');
          vals=vals.slice(0,mo.days);
        }
        while(vals.length<mo.days)vals.push(0);
        if(tgt[k])tgt[k]=tgt[k].map((v,i)=>v+vals[i]); // gabung (mis. dua seksi CI)
        else tgt[k]=vals;
      }
      if(sec.budget)mo.budgets[sec.ch]=(mo.budgets[sec.ch]||0)+sec.budget;
    }
    // buang seksi yang semuanya nol
    for(const cid in mo.series){
      const all=Object.values(mo.series[cid]).every(a=>a.every(v=>!v));
      if(all)delete mo.series[cid];
    }
  }

  // ---- 5) channel bulanan -> sebar rata harian (largest remainder, jumlah persis)
  function spread(total,days,integer){
    if(total==null)return null;
    const base=integer?Math.floor(total/days):Math.floor(total/days);
    const arr=Array(days).fill(base);
    let rem=Math.round(total-base*days);
    for(let i=0;rem>0&&i<days;i++){arr[i]+=1;rem--;}
    // untuk nilai non-integer besar (rupiah) pembulatan ke rupiah utuh sudah cukup
    return arr;
  }
  // per metrik: isi dari rekap bulanan hanya bila metrik itu tidak ada dari data harian.
  // requireExisting: hanya melengkapi channel yang sudah punya data harian (jangan bikin dobel
  // dgn tt_vsa_psa gabungan di awal 2025).
  const FLAT=[
    {ch:'meta_cpas',y:2025,gmv:'Meta GMV',orders:'QTY Orders From Meta',cost:'Meta Ads Cost'},
    {ch:'meta_cpas',y:2026,gmv:'GMV by Meta CPAS',orders:'QTY Orders by CPAS',cost:'Meta Ads Cost'},
    {ch:'sp_live',y:0,gmv:'GMV by Live Shopee Ads',orders:'QTY Orders by Live Shopee Ads',cost:'Live Shopee Ads Cost'},
    {ch:'sp_sba',y:0,gmv:'GMV by SBA Shopee',orders:'QTY Orders by SBA Shopee Ads',cost:'SBA Shopee Ads Cost'},
    {ch:'sp_pc',y:0,gmv:'GMV by Product Card Shopee',orders:'QTY by Product Card Shopee',cost:'Product Card Shopee Ads Cost'},
    {ch:'sp_pc_new',y:0,gmv:'GMV by New Product Card Shopee',orders:'QTY by New Product Card Shopee',cost:null},
    {ch:'sp_store',y:0,gmv:'GMV by Ads Store',orders:'QTY by Ads Store',cost:'Ads Store Shopee Ads Cost'},
    {ch:'tt_vsa',y:2025,gmv:'GMV by Video',orders:'QTY Orders by Video',cost:null,requireExisting:true},
    {ch:'tt_psa',y:2025,gmv:'GMV by Product Card',orders:'QTY Orders by Product Card',cost:null,requireExisting:true},
    {ch:'tt_vsa',y:2026,gmv:'GMV by Video',orders:'QTY Orders by Video',cost:null,requireExisting:true},
    {ch:'tt_psa',y:2026,gmv:'GMV by Product Card',orders:'QTY Orders by Product Card',cost:null},
    {ch:'tt_vsa_ns',y:2026,gmv:'GMV by Video NP',orders:'QTY Orders by Video NP',cost:null},
    {ch:'tt_psa_ns',y:2026,gmv:'GMV by Product Card NP',orders:'QTY Orders by Product Card NP',cost:null},
  ];
  for(const y of [2025,2026]){
    const s=momByYear[String(y)];if(!s)continue;
    for(let m=1;m<=12;m++){
      const mk=y+'-'+String(m).padStart(2,'0');
      for(const f of FLAT){
        if(f.y&&f.y!==y)continue;
        const gmv=(s[f.gmv]||[])[m-1],ord=f.orders?(s[f.orders]||[])[m-1]:null,cost=f.cost?(s[f.cost]||[])[m-1]:null;
        if(!gmv&&!ord&&!cost)continue;
        const exists=months[mk]&&months[mk].series[f.ch];
        if(f.requireExisting&&!exists)continue;
        const mo=ensure(mk,y,m);
        const tgt=mo.series[f.ch]||(mo.series[f.ch]={});
        if(cost&&!tgt.cost)tgt.cost=spread(Math.round(cost),mo.days,false);
        if(gmv&&!tgt.gmv)tgt.gmv=spread(Math.round(gmv),mo.days,false);
        if(ord&&!tgt.orders)tgt.orders=spread(Math.round(ord),mo.days,true);
        if(!Object.keys(tgt).length)delete mo.series[f.ch];
      }
    }
  }
  // bulan tanpa data sama sekali dibuang
  for(const mk in months)if(!Object.keys(months[mk].series).length)delete months[mk];

  // ---- 6) budget bulanan CPAS/awareness/CI dari blok "Forecasting Budget" (tracker Budget|Spent|Remaining)
  // tracker per bulan: label 'Awareness TikTok'..'Sales CPAS' + 3 kolom; urutan = Jan, Feb, Mar 2025
  {
    let trackerMonth=0;
    blocks.forEach((b)=>{
      const rows=rowsOf(b);
      const isForecast=rows.some(c=>clean(c.find(x=>clean(x))||'').startsWith('Forecasting Budget'));
      if(!isForecast)return;
      for(let i=0;i<rows.length;i++){
        const cc=rows[i].map(clean);const li=cc.findIndex(x=>x);
        if(li<0)continue;
        if(cc[li]==='Date'&&cc.filter(x=>x)[1]==='Budget'){trackerMonth++;continue;}
        if(!trackerMonth)continue;
        const mk='2025-'+String(trackerMonth).padStart(2,'0');
        if(!months[mk])continue;
        const val=num(cc.filter((x,j)=>j>li&&x)[0]);
        if(val==null)continue;
        const map={'Awareness TikTok':'tt_aw_ext','Community Interaction TikTok':'tt_ci_smv','Sales CPAS':'meta_cpas'};
        const ch=map[cc[li]];
        if(ch&&val>0&&months[mk].budgets[ch]==null)months[mk].budgets[ch]=val;
      }
    });
    if(trackerMonth>3)warnings.push('Tracker budget bulanan > 3, hanya Jan-Mar 2025 yang dipetakan');
  }

  return {months,mom:momByYear,warnings};
}

function b64ToBuf(b64){const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8.buffer;}
async function runDriveSync(onStatus){
  const report={applied:[],skipped:[],errors:[],ok:[]};
  let cells=0,filesDone=0;
  const server=await gdResolveServer();
  if(!server){report.errors.push(gdErrMsg({code:'server_not_connected'}));return {report,cells,filesDone};}
  async function gdWalk(fid,depth){
    let out=[];
    const res=await gdCall(server,'search_files',{query:`parentId = '${fid}'`,pageSize:200,excludeContentSnippets:true});
    const items=(res&&res.payload&&res.payload.files)||[];
    for(const it of items){
      if(it.mimeType==='application/vnd.google-apps.folder'){ if(depth<5) out=out.concat(await gdWalk(it.id,depth+1)); }
      else out.push(it);
    }
    return out;
  }
  for(const f of GD_FOLDERS){
    onStatus(L('Memindai ','Scanning ')+f.name+'\u2026');
    let list;
    try{list=await gdWalk(f.id,0);}
    catch(e){report.errors.push(f.name+': '+gdErrMsg(e));continue;}
    for(const file of list){
      if(syncedIds[file.id])continue;
      const t=String(file.title||'');
      const okType=/\.(csv|xlsx|txt)$/i.test(t)||/csv|excel|spreadsheetml|text\/plain/.test(String(file.mimeType||''));
      if(!okType){report.skipped.push(t+': '+L('format tidak didukung','unsupported format'));syncedIds[file.id]='skip-format';continue;}
      onStatus(L('Memproses ','Processing ')+t+'\u2026');
      let dl;
      try{dl=await gdCall(server,'download_file_content',{fileId:file.id});}
      catch(e){report.errors.push(t+': '+gdErrMsg(e));continue;}
      const dpay=dl&&dl.payload?dl.payload:{};
      if(!dpay.content){report.errors.push(t+': '+L('konten kosong','empty content'));continue;}
      let rows;
      try{
        if(/\.xlsx$/i.test(t)||/officedocument|spreadsheetml|ms-excel/.test(String(dpay.mimeType||'')))
          rows=await xlsxToRows(b64ToBuf(dpay.content));
        else rows=csvParse(new TextDecoder().decode(b64ToBuf(dpay.content)).replace(/^\uFEFF/,''));
      }catch(e){report.errors.push(t+': '+(e.message||e));continue;}
      const det=detectRows(rows,t);
      if(det.error){report.skipped.push(t+': '+det.error);syncedIds[file.id]='skip-detect';continue;}
      if(det.mapping){prodNames=Object.assign({},prodNames,det.mapping);store.set(LS_PN,prodNames);}
      let entries=null;
      if(det.entries)entries=det.entries.map(e=>({...e,chId:f.channel||e.chId||det.defaultCh}));
      else if(det.entriesNoDate){
        if(!det.date){report.skipped.push(t+': '+L('tanggal tidak terbaca, tambahkan tanggal pada nama file','date unreadable, add the date to the file name'));continue;}
        entries=det.entriesNoDate.map(e=>({...e,iso:det.date,chId:f.channel||e.chId||det.defaultCh}));
      }else if(det.single){
        if(!det.date){report.skipped.push(t+': '+L('tanggal tidak terbaca','date unreadable'));continue;}
        entries=[{chId:f.channel||det.defaultCh,iso:det.date,metrics:det.single}];
      }
      if(entries&&entries.length)cells+=applyEntries(entries);
      if(det.products&&det.products.length){
        const inc=det.products.map(p=>({...p,chId:p.chId||f.channel||det.defaultCh,iso:p.iso||det.date,code:p.code||'',
          qty:p.qty||0,val:p.val||0,cost:p.cost||0,imp:p.imp||0,clk:p.clk||0,ord:p.ord||0}))
          .filter(p=>p.chId&&p.iso&&inData(p.iso));
        if(inc.length){prodStore=mergeDetail(prodStore,inc);store.set(LS_P,prodStore);}
      }
      if(det.videos&&det.videos.length){
        const inc=det.videos.map(v=>({...v,iso:v.iso||det.date})).filter(v=>v.iso&&inData(v.iso));
        if(inc.length){vidStore=mergeDetail(vidStore,inc);store.set(LS_V,vidStore);}
      }
      syncedIds[file.id]=new Date().toISOString();
      filesDone++;
      report.applied.push(t+' \u2192 '+f.name);
    }
  }
  store.set(LS_SYNCF,syncedIds);
  store.set(LS_O,overlay);
  invalidateCache();GLOBAL_LAST=computeGlobalLast();
  return {report,cells,filesDone};
}
const gdAvailable=()=>!!(window.claude&&window.claude.mcp);
function gdErrMsg(e){
  const c=e&&e.code;
  if(c==='needs_reauth')return L('Koneksi Google Drive kedaluwarsa. Sambungkan ulang di claude.ai: Settings \u2192 Connectors \u2192 Google Drive.','Google Drive connection expired. Reconnect in claude.ai: Settings \u2192 Connectors \u2192 Google Drive.');
  if(c==='server_not_connected'||c==='selection_required')return L('Connector Google Drive belum tersedia di akun claude.ai Anda. Tambahkan di Settings \u2192 Connectors, lalu muat ulang halaman.','The Google Drive connector is not available on your claude.ai account. Add it in Settings \u2192 Connectors, then reload the page.');
  if(c==='not_in_manifest')return L('Versi halaman ini belum memuat izin Drive. Muat ulang halaman artifact.','This page version does not carry the Drive permission yet. Reload the artifact page.');
  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return L('Izin connector tidak diberikan pada tampilan ini. Muat ulang halaman dan setujui akses saat diminta.','Connector permission was not granted for this view. Reload the page and approve access when prompted.');
  if(c==='blocked_by_policy'||c==='approval_required')return L('Kebijakan organisasi memblokir akses tool ini.','Organization policy blocks this tool.');
  return (e&&e.message)?e.message:String(c||e);
}
async function gdResolveServer(){
  const r=await window.claude.mcp.listTools();
  const hit=(r.servers||[]).find(s=>GD_SERVER_NAMES.includes(s.server)&&(s.tools||[]).length);
  if(hit)return hit.server;
  const loose=(r.servers||[]).find(s=>/google[ _]?drive/i.test(s.server)&&(s.tools||[]).length);
  return loose?loose.server:null;
}
async function gdCall(server,tool,input){
  try{return await window.claude.mcp.callTool(server,tool,input,{cache:false});}
  catch(e){
    if(e&&e.retryable){
      await new Promise(r=>setTimeout(r,(e.retryAfterMs||1500)+Math.random()*500));
      return await window.claude.mcp.callTool(server,tool,input,{cache:false});
    }
    throw e;
  }
}
async function runWorksheetSync(onStatus){
  const report={applied:[],skipped:[],errors:[],ok:[]};
  let cells=0,monthsDone=0;
  const server=await gdResolveServer();
  if(!server){report.errors.push(gdErrMsg({code:'server_not_connected'}));return {report,cells,monthsDone};}
  onStatus(L('Memeriksa versi sheet\u2026','Checking sheet version\u2026'));
  let meta={};
  try{const r=await gdCall(server,'get_file_metadata',{fileId:GD_SHEET_ID});meta=(r&&r.payload&&typeof r.payload==='object')?r.payload:{};}
  catch(e){report.errors.push(GD_SHEET_NAME+': '+gdErrMsg(e));return {report,cells,monthsDone};}
  if(meta.modifiedTime&&syncState.modifiedTime===meta.modifiedTime){
    report.ok.push(L('Terhubung ke Google Drive. Worksheet belum berubah sejak sinkron terakhir \u2014 semua angka sudah termuat.','Connected to Google Drive. The worksheet has not changed since the last sync \u2014 all figures are already loaded.'));
    return {report,cells,monthsDone,matched:true};
  }
  onStatus(L('Mengambil isi sheet\u2026','Fetching sheet content\u2026'));
  let dump='';
  try{const r=await gdCall(server,'read_file_content',{fileId:GD_SHEET_ID});
    const pay=r&&r.payload;
    dump=typeof pay==='string'?pay:((pay&&pay.fileContent)||'');}
  catch(e){report.errors.push(GD_SHEET_NAME+': '+gdErrMsg(e));return {report,cells,monthsDone};}
  if(!dump){report.errors.push(GD_SHEET_NAME+': '+L('konten kosong','empty content'));return {report,cells,monthsDone};}
  onStatus(L('Memproses data\u2026','Processing data\u2026'));
  let parsed;
  try{parsed=parsePuresiaDump(dump);}
  catch(e){report.errors.push('Parser: '+((e&&e.message)||e));return {report,cells,monthsDone};}
  const outside=[];
  for(const mk in parsed.months){
    const mo=parsed.months[mk];
    ensureMonth(mk);
    const entries=[];
    for(const cid in mo.series){
      const s=mo.series[cid];
      const baseCh=(RAW.months[mk].series||{})[cid]||{};
      for(let d=0;d<mo.days;d++){
        const metrics={};let has=false;
        for(const k in s){
          const v=s[k][d];
          const bv=(baseCh[k]||[])[d]||0;
          if(v==null)continue;
          if(Math.abs(v-bv)>0.5){metrics[k]=v;has=true;}
        }
        if(has)entries.push({chId:cid,iso:mk+'-'+String(d+1).padStart(2,'0'),metrics});
      }
    }
    const c=applyEntries(entries);
    if(c){cells+=c;monthsDone++;report.applied.push(mk+' \u00b7 '+c+' '+L('sel berubah','changed cells'));}
  }
  syncState={modifiedTime:meta.modifiedTime||null,lastRun:new Date().toISOString()};
  store.set(LS_SYNC,syncState);
  store.set(LS_O,overlay);
  invalidateCache();GLOBAL_LAST=computeGlobalLast();
  return {report,cells,monthsDone};
}

  async function handleFiles(fileList){
    for(const f of fileList){
      const item={name:f.name,status:'proses…'};
      PENDING.push(item);
      try{
        let rows;
        if(/\.xlsx$/i.test(f.name))rows=await xlsxToRows(await f.arrayBuffer());
        else rows=csvParse(await f.text());
        const res=detectRows(rows,f.name);
        Object.assign(item,res);
        if(res.needsCh)item.chId=res.defaultCh;
        if(!res.error&&!res.mapping){
          const hv=harvestProdNames(rows);
          if(hv){item.harvest=hv;item.label=(item.label||'')+` · +${Object.keys(hv).length} ${L('nama produk terdeteksi','product names detected')}`;}
        }
      }catch(err){item.error=L('Gagal membaca file: ','Failed to read file: ')+(err.message||err);}
      renderFileList();
    }

      const dateSel=f.needsDate?`<input type="date" data-dt="${i}" value="${f.date||''}" min="${dmin}" max="${dmax}">`:'';
      let sums='';
      if(f.single)sums=`${fmtRpC(f.single.cost||0)} spend · ${fmtRpC(f.single.gmv||0)} ${L('omzet','revenue')} · ${fmtN(f.single.orders||0)} ${L('pesanan','orders')}`;

const LIVE_CH=new Set(['tt_live_smo','tt_live_aff','tt_live_all','sp_live']);
const CAT_WORDS=new Set(['puresia','vegan','natural','new','refill','-','|']);
function shortName(name){
  const toks=String(name||'').trim().split(/\s+/);
  let i=0;
  while(i<toks.length-1&&CAT_WORDS.has(toks[i].toLowerCase()))i++;
  const out=toks.slice(i).join(' ').replace(/\s*\[\s*\d+\s*\]\s*$/,'');
  return out||name;
}
const fmtRoi=v=>v==null?'–':nf1.format(v)+'×';
function canonKey(name){
  return shortName(name).toLowerCase()
    .replace(/\[\s*\d+\s*\]/g,'').replace(/[^a-z0-9 ]/g,' ')
    .replace(/\s+/g,' ').trim() || String(name).toLowerCase();
}
let prodView={mode:'all',ch:'',from:FIRST_ISO,to:null,preset:'custom',q:'',sort:'val',dir:-1,fmin:{}};
const PROD_COLS=()=>[
  ['qty','Qty Sold',fmtN],['val',L('Nilai','Value'),fmtRp],['pct',L('%Kontribusi','%Contribution'),fmtPct],
  ['cost',L('Biaya Iklan','Ad Spend'),fmtRp],
  ['imp',L('Impresi','Impressions'),fmtNC],['clk',L('Klik','Clicks'),fmtNC],
  ['ctr','CTR',fmtPct],['ctor','CTOR',fmtPct],['roi','ROI',fmtRoi],
];
function derive(o){
  o.ctr=o.imp?100*o.clk/o.imp:null;
  o.ctor=o.clk?100*(o.ord||o.qty)/o.clk:null;
  o.roi=o.cost?o.val/o.cost:null;
  return o;
}
const PRODMAP=RAW.prodMap||{};
const resolveProdName=r=>{
  const byUser=prodNames[r.code], byMap=PRODMAP[r.code];
  const nm=byUser||byMap;
  return nm? {...r,name:nm} : r;
};
function renderProducts(){
  if(!prodView.to)prodView.to=DATA_END();
  const data=store.get(LS_P,[]).filter(r=>!LIVE_CH.has(r.chId))
    .filter(r=>['tiktok','shopee'].includes(chDef(r.chId)?.platform))
    .map(resolveProdName);
  let rows=data.filter(r=>r.iso>=prodView.from&&r.iso<=prodView.to);
  if(prodView.mode==='channel'&&prodView.ch)rows=rows.filter(r=>chDef(r.chId)?.platform===prodView.ch);
  if(prodView.q){const q=prodView.q.toLowerCase();rows=rows.filter(r=>r.name.toLowerCase().includes(q)||String(r.code).includes(q)||canonKey(r.name).includes(q));}
  const agg={};
  for(const r of rows){
    const key=canonKey(r.name);
    const o=agg[key]??={name:r.name,names:new Set(),codes:new Set(),qty:0,val:0,cost:0,imp:0,clk:0,ord:0,chs:new Set()};
    o.qty+=r.qty||0;o.val+=r.val||0;o.cost+=r.cost||0;o.imp+=r.imp||0;o.clk+=r.clk||0;o.ord+=r.ord||0;
    o.chs.add(r.chId);o.names.add(r.name);
    if(r.code)o.codes.add(String(r.code));
    if(r.name.length>o.name.length)o.name=r.name;
  }
  for(const o of Object.values(agg)){
    const codes=[...o.codes];
    o.code=codes.slice(0,2).join(', ')+(codes.length>2?` +${codes.length-2}`:'');
    o.allNames=[...o.names].join(' | ');
  }
  let list=Object.values(agg).map(derive);
  /* %Kontribusi = pangsa nilai produk terhadap total nilai daftar (poin 7) */
  const baseVal=sum(list.map(x=>x.val))||0;

    ${PROD_COLS().map(([k,lbl])=>`<th class="sorth" data-k="${k}" style="cursor:pointer" title="${L('Urutkan','Sort')}">${lbl}${arrow(k)}</th>`).join('')}
  </tr></thead><tbody>

/* =========== ANALISIS LANJUTAN CHATBOT (mesin lokal) =========== */
/* jendela tren: 7 hari terakhir vs 7 hari sebelumnya */
function trendWindows(){
  const end=LATEST_LAST_ISO();
  const curFrom=clampIso(isoShift(end,-6)),curTo=end;
  const prevTo=clampIso(isoShift(curFrom,-1)),prevFrom=clampIso(isoShift(prevTo,-6));
  return {curFrom,curTo,prevFrom,prevTo};
}
const trFmt=d=>d==null?'–':(d>=0?'▲':'▼')+' '+nf1.format(Math.abs(d))+'%';
const pctD=(a,b)=>a?100*(b-a)/a:null;

/* --- kelengkapan data per channel per tanggal --- */
function dataCoverage(){
  const last=GLOBAL_LAST, ms=monthSeries(LATEST);
  const rows=[];
  for(const c of CH_DEF){
    if(HIDDEN_CH.has(c.id))continue;
    const d=ms[c.id]||{};
    const hasDay=day=>{const i=day-1;return ((d.cost||[])[i]||0)>0||((d.gmv||[])[i]||0)>0||((d.clicks||[])[i]||0)>0||((d.impressions||[])[i]||0)>0||((d.orders||[])[i]||0)>0||((d.liveViews||[])[i]||0)>0;};
    let lastDay=0;for(let day=1;day<=last;day++)if(hasDay(day))lastDay=day;
    if(lastDay===0)continue;
    const missing=[];for(let day=1;day<=lastDay;day++)if(!hasDay(day))missing.push(day);
    rows.push({c,lastDay,missing,behind:last-lastDay});
  }
  return {last,rows};
}
function coverageReply(){
  const {last,rows}=dataCoverage();
  if(!rows.length)return L('Belum ada channel dengan data pada '+mkLabel(LATEST)+'. Silakan unggah raw data di tab Unggah.','No channel has data in '+mkLabel(LATEST)+' yet. Please upload raw data on the Upload tab.');
  const behind=rows.filter(r=>r.behind>0).sort((a,b)=>b.behind-a.behind);
  const gaps=rows.filter(r=>r.missing.length);
  const dayList=days=>days.map(dd=>isoLabel(isoOf(LATEST,dd))).join(', ');
  let out=`<b>${L('Kelengkapan data','Data completeness')} · ${mkLabel(LATEST)}</b>\n`+
    L(`Data terbaru menyeluruh mencapai ${isoLabelY(isoOf(LATEST,last))} (hari ke-${last}).`,`Latest data across channels reaches ${isoLabelY(isoOf(LATEST,last))} (day ${last}).`)+'\n';
  if(behind.length)out+='\n'+L(`Channel yang belum sampai hari ${last}:`,`Channels not yet at day ${last}:`)+'\n'+
    behind.map(r=>`• <b>${esc(chName(r.c.id))}</b>: ${L('terakhir','last')} ${isoLabel(isoOf(LATEST,r.lastDay))} · ${L('belum diinput','not input')} ${dayList(Array.from({length:last-r.lastDay},(_,i)=>r.lastDay+1+i))}`).join('\n');
  if(gaps.length)out+='\n\n'+L('Ada tanggal kosong di tengah:','Gaps in the middle:')+'\n'+
    gaps.map(r=>`• <b>${esc(chName(r.c.id))}</b>: ${dayList(r.missing)}`).join('\n');
  if(!behind.length&&!gaps.length)out+='\n'+L(`Semua channel aktif sudah terisi lengkap sampai hari ${last} ✓`,`All active channels are complete through day ${last} ✓`);
  out+='\n\n'+L('Catatan: channel yang memang tidak beriklan pada suatu hari terbaca "belum diinput" karena nilainya nol. Abaikan bila channel itu memang tidak jalan hari itu.','Note: a channel that genuinely did not run on a day reads as "not input" because its value is zero. Ignore if it truly was inactive that day.');
  return out;
}

/* --- tren channel (naik/turun GMV & ROAS) --- */
function channelTrendData(defs){
  const w=trendWindows();
  const rows=[];
  for(const c of defs){
    const a=statsRange([c.id],w.prevFrom,w.prevTo),b=statsRange([c.id],w.curFrom,w.curTo);
    if(!a.gmv&&!b.gmv&&!a.cost&&!b.cost)continue;
    rows.push({c,a,b,dG:pctD(a.gmv,b.gmv),dR:pctD(a.roas,b.roas)});
  }
  const down=rows.filter(r=>r.dG!=null&&r.dG<=-15).sort((a,b)=>a.dG-b.dG);
  const up=rows.filter(r=>r.dG!=null&&r.dG>=15).sort((a,b)=>b.dG-a.dG);
  return {w,rows,down,up};
}
function channelTrendReply(q){
  let defs=SALES_DEF.filter(c=>!HIDDEN_CH.has(c.id));
  let scope='';
  for(const p in PLATFORMS)if(q&&q.includes(p)){defs=defs.filter(c=>c.platform===p);scope=' · '+PLATFORMS[p].name;}
  const {w,down,up}=channelTrendData(defs);
  const line=r=>`<b>${esc(chName(r.c.id))}</b>: GMV ${trFmt(r.dG)} (${fmtRpC(r.a.gmv)}→${fmtRpC(r.b.gmv)}) · ROAS ${trFmt(r.dR)}`;
  let out=`<b>${L('Tren channel','Channel trend')}${scope}</b>\n`+
    L(`7 hari terakhir (${isoLabel(w.curFrom)}–${isoLabel(w.curTo)}) vs sebelumnya (${isoLabel(w.prevFrom)}–${isoLabel(w.prevTo)})`,`Last 7 days (${isoLabel(w.curFrom)}–${isoLabel(w.curTo)}) vs prior (${isoLabel(w.prevFrom)}–${isoLabel(w.prevTo)})`)+'\n';
  if(down.length)out+='\n'+L('Menurun:','Declining:')+'\n'+down.slice(0,5).map(r=>'▼ '+line(r)).join('\n');
  if(up.length)out+='\n\n'+L('Meningkat:','Rising:')+'\n'+up.slice(0,5).map(r=>'▲ '+line(r)).join('\n');
  if(!down.length&&!up.length)out+='\n'+L('Tidak ada perubahan GMV signifikan (±15%) pada channel.','No significant GMV change (±15%) across channels.');
  return out;
}

/* --- diagnosis penyebab sales turun --- */
function driverReply(q){
  const w=trendWindows();
  let defs=SALES_DEF.filter(c=>!HIDDEN_CH.has(c.id));
  for(const p in PLATFORMS)if(q&&q.includes(p))defs=defs.filter(c=>c.platform===p);
  const A=statsRange(defs.map(c=>c.id),w.prevFrom,w.prevTo), B=statsRange(defs.map(c=>c.id),w.curFrom,w.curTo);
  const dG=pctD(A.gmv,B.gmv);
  const rows=[];
  for(const c of defs){const a=statsRange([c.id],w.prevFrom,w.prevTo),b=statsRange([c.id],w.curFrom,w.curTo);
    if(a.gmv||b.gmv)rows.push({c,a,b,delta:b.gmv-a.gmv});}
  const drops=rows.filter(r=>r.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,4);
  const gains=rows.filter(r=>r.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,2);
  const diag=r=>{
    const dCost=pctD(r.a.cost,r.b.cost),dRoas=pctD(r.a.roas,r.b.roas),dCtor=pctD(r.a.ctor,r.b.ctor),dClk=pctD(r.a.clk,r.b.clk);
    if(dCost!=null&&dCost<=-15)return L(`anggaran turun ${nf0.format(-dCost)}% (volume iklan berkurang)`,`spend down ${nf0.format(-dCost)}% (ad volume reduced)`);
    if(dRoas!=null&&dRoas<=-15)return L(`efisiensi ROAS turun ${nf0.format(-dRoas)}% (biaya tetap, hasil turun)`,`ROAS efficiency down ${nf0.format(-dRoas)}% (spend held, returns fell)`);
    if(dCtor!=null&&dCtor<=-15)return L(`konversi CTOR melemah ${nf0.format(-dCtor)}% (klik masuk tapi tidak jadi order)`,`CTOR conversion weakened ${nf0.format(-dCtor)}% (clicks arrive but do not convert)`);
    if(dClk!=null&&dClk<=-15)return L(`trafik/klik turun ${nf0.format(-dClk)}%`,`traffic/clicks down ${nf0.format(-dClk)}%`);
    return L('penurunan volume umum','general volume decline');
  };
  let out=`<b>${L('Diagnosis penjualan','Sales diagnosis')}</b>\n`+
    L(`GMV 7 hari terakhir ${fmtRpC(B.gmv)} vs 7 hari sebelumnya ${fmtRpC(A.gmv)} (${trFmt(dG)}).`,`GMV last 7 days ${fmtRpC(B.gmv)} vs prior 7 days ${fmtRpC(A.gmv)} (${trFmt(dG)}).`)+'\n';
  if(dG!=null&&dG>=0){
    out+='\n'+L('GMV tidak turun pada periode ini.','GMV did not decline in this period.')+(gains.length?'\n'+L('Pendorong: ','Drivers: ')+gains.map(r=>esc(chName(r.c.id))+' +'+fmtRpC(r.delta)).join(', '):'');
    return out;
  }
  if(drops.length)out+='\n'+L('Penyumbang penurunan terbesar:','Biggest contributors to the drop:')+'\n'+
    drops.map(r=>`▼ <b>${esc(chName(r.c.id))}</b>: ${fmtRpC(r.a.gmv)}→${fmtRpC(r.b.gmv)} (${fmtRpC(r.delta)})\n   ${L('Penyebab','Cause')}: ${diag(r)}`).join('\n');
  if(gains.length)out+='\n\n'+L('Yang menahan penurunan (naik): ','Offsetting (rose): ')+gains.map(r=>esc(chName(r.c.id))+' +'+fmtRpC(r.delta)).join(', ');
  out+='\n\n'+L('Saran: prioritaskan channel penurun terbesar sesuai penyebabnya (kembalikan anggaran, rotasi materi bila ROAS turun, atau perbaiki halaman produk bila CTOR turun). Lihat tab Analisis untuk rencana tindakan lengkap.','Suggestion: prioritize the biggest decliners per their cause (restore budget, rotate creatives if ROAS fell, or fix the product page if CTOR fell). See the Analysis tab for full action plans.');
  return out;
}

function botReply(q0){
  const q=String(q0||'').toLowerCase();
  const st=ovStats(isoOf(LATEST,1),LATEST_LAST_ISO(),'all');
  const chm=SALES_DEF.filter(c=>!HIDDEN_CH.has(c.id)).map(c=>chMonth(c.id,LATEST)).filter(c=>c.tot.cost>0||c.tot.gmv>0);
  const has=(...ws)=>ws.some(w=>q.includes(w));
  const wantTrend=has('turun','naik','penurunan','kenaikan','menurun','meningkat','tren','trend','decline','increase','drop','rising','anjlok','melonjak');
  const wantWhy=has('kenapa','mengapa','penyebab','why','cause','karena','apa yang menyebabkan');
  /* 1. kelengkapan data / tanggal yang belum diinput */
  if(has('belum diinput','belum input','belum saya input','yang belum','kelengkapan','sudah lengkap','belum lengkap','cek data','cek kelengkapan','tanggal berapa','data belum','kurang input','missing','tertinggal'))
    return coverageReply();
  /* 2. penyebab penjualan turun */
  if(wantWhy&&has('sales','penjualan','gmv','roas','turun','drop','anjlok','omzet'))
    return driverReply(q);
  /* 3. tren naik/turun dengan subjek */
  if(wantTrend){
    if(has('produk','product'))return prodTrendReply();
    if(has('kreator','creator','video','afiliator'))return creatorTrendReply();
    return channelTrendReply(q);
  }
  /* platform tertentu */
  for(const p in PLATFORMS){
    if(q.includes(p)){
      const ids=platIds(p),uids=platUpperIds(p);
      const s=statsRange(ids,isoOf(LATEST,1),LATEST_LAST_ISO());
      const u=statsRange(uids,isoOf(LATEST,1),LATEST_LAST_ISO());
      const chansP=chm.filter(c=>c.platform===p).sort((a,b)=>b.tot.gmv-a.tot.gmv);
      if(!s.cost&&!u.cost)return L(`Belum ada biaya tercatat untuk ${PLATFORMS[p].name} pada ${mkLabel(LATEST)}.`,`No spend recorded for ${PLATFORMS[p].name} in ${mkLabel(LATEST)}.`);
      return `<b>${PLATFORMS[p].name} · ${mkLabel(LATEST)} (MTD)</b>\n`+
        L(`Spend penjualan ${fmtRpC(s.cost)}${u.cost?` · Branding Ads ${fmtRpC(u.cost)}`:''}\nGMV ${fmtRpC(s.gmv)} · ROAS ${fmtX(s.roas)} · ${fmtN(s.orders)} pesanan\n`,
          `Sales spend ${fmtRpC(s.cost)}${u.cost?` · Branding Ads ${fmtRpC(u.cost)}`:''}\nGMV ${fmtRpC(s.gmv)} · ROAS ${fmtX(s.roas)} · ${fmtN(s.orders)} orders\n`)+
        chansP.slice(0,5).map(chLine).join('\n');
    }
  }
  if(has('produk','product')){
    const PI=prodInsights();
    if(!PI)return L('Belum ada data produk. Unggah raw Shopee Iklan CPC atau TikTok Product GMV Max pada tab Unggah terlebih dahulu.','No product data yet. Upload Shopee CPC Ads or TikTok Product GMV Max raw files on the Upload tab first.');
    let out=`<b>${L('Produk','Products')} · ${mkLabel(PI.mk)}</b>\n`+
      L(`${PI.n} produk · nilai total ${fmtRpC(PI.tot)} · ROI ${PI.roi?fmtRoi(PI.roi):'–'}\n\n${L('Terlaris','Top')}:`,`${PI.n} products · total value ${fmtRpC(PI.tot)} · ROI ${PI.roi?fmtRoi(PI.roi):'–'}\n\nTop sellers:`)+'\n'+
      PI.top.map(x=>`• <b>${esc(shortName(x.name))}</b>: ${fmtRpC(x.val)} (${nf1.format(100*x.val/PI.tot)}%) · ROI ${x.roi?fmtRoi(x.roi):'–'}`).join('\n');
    if(PI.low.length)out+='\n\n'+L('Perlu perhatian (biaya besar, ROI di bawah 5):','Needs attention (high spend, ROI below 5):')+'\n'+
      PI.low.map(x=>`• ${esc(shortName(x.name))}: ${L('biaya','spend')} ${fmtRpC(x.cost)} · ROI ${x.roi==null?'–':fmtRoi(x.roi)}`).join('\n')+
      '\n'+L('Saran: turunkan penawaran produk tersebut dan alihkan anggarannya ke produk terlaris.','Suggestion: lower bids on those products and shift the budget to the top sellers.');
    return out;
  }
  if(has('kreator','creator','video','afiliator')){
    const KI=creatorInsights();
    if(!KI)return L('Belum ada data kreator. Unggah raw TikTok Product GMV Max yang memuat kolom Akun TikTok.','No creator data yet. Upload TikTok Product GMV Max raw files containing the TikTok Account column.');
    let out=`<b>${L('Kreator','Creators')} · ${mkLabel(KI.mk)}</b>\n`+
      `${KI.n} ${L('kreator aktif · nilai total','active creators · total value')} ${fmtRpC(KI.tot)} · ROI ${KI.roi?fmtRoi(KI.roi):'–'}\n\n`+
      L('Teratas:','Top:')+'\n'+
      KI.top.map(x=>`• <b>${esc(x.creator)}</b>: ${fmtRpC(x.val)} (${nf1.format(100*x.val/KI.tot)}%) · ${x.vids.size} video · ROI ${x.roi?fmtRoi(x.roi):'–'}`).join('\n');
    if(KI.low.length)out+='\n\n'+L('ROI rendah: ','Low ROI: ')+KI.low.map(x=>esc(x.creator)).join(', ')+
      '. '+L('Saran: jeda promosi video ber-CTR rendah dari kreator tersebut.','Suggestion: pause promotion of their low CTR videos.');
    return out;
  }
  if(has('masalah','bermasalah','warning','peringatan','alert','turun','drop','issue','problem','perhatian')){
    ALERTS=computeAlerts();
    const act=ALERTS.alerts.filter(a=>a.sev!=='info').slice(0,5);
    if(!act.length)return L('Tidak ada peringatan aktif. Semua channel dalam kondisi sehat ✓','No active warnings. All channels are healthy ✓');
    return `<b>${L('Temuan aktif','Active findings')} (${act.length}${ALERTS.alerts.filter(a=>a.sev!=='info').length>5?'+':''})</b>\n`+
      act.map(a=>`${SEV_IC[a.sev]} <b>${esc(chName(a.ch.id))}</b>: ${esc(a.title)}\n   ${L('Langkah','Step')}: ${esc((a.actions&&a.actions[0])||'-')}`).join('\n')+
      '\n\n'+L('Detail lengkap dan rencana tindakan ada di tab Analisis.','Full detail and action plans are on the Analysis tab.');
  }
  if(has('peluang','scale','opportunit','naikkan','tingkatkan')){
    ALERTS=computeAlerts();
    if(!ALERTS.opps.length)return L('Belum ada kandidat peningkatan anggaran. Syaratnya ROAS minimal 120% dari target dengan laju biaya masih aman.','No scale up candidates yet. The requirement is ROAS of at least 120% of target with spend pace still safe.');
    return `<b>${L('Peluang peningkatan anggaran','Budget scale up opportunities')}</b>\n`+
      ALERTS.opps.map(o=>`🚀 <b>${esc(chName(o.ch.id))}</b>: ${esc(o.title)}`).join('\n')+
      '\n'+L('Naikkan bertahap maksimal 20 sampai 30 persen per dua hari.','Scale gradually, at most 20 to 30 percent every two days.');
  }
  if(has('roas','target')){
    const bad=chm.filter(c=>c.roas!=null&&c.roas<(targets[c.id]||8)).sort((a,b)=>a.roas-b.roas);
    const good=chm.filter(c=>c.roas!=null&&c.roas>=(targets[c.id]||8)).sort((a,b)=>b.roas-a.roas);
    return `<b>ROAS ${mkLabel(LATEST)} (MTD)</b>\n${L('Gabungan','Blended')}: ${fmtX(st.roas)}\n\n`+
      (good.length?L('Di atas target:','Above target:')+'\n'+good.slice(0,4).map(c=>`✓ ${esc(chName(c.id))}: ${fmtX(c.roas)} / ${nf0.format(targets[c.id]||8)}`).join('\n')+'\n\n':'')+
      (bad.length?L('Di bawah target:','Below target:')+'\n'+bad.slice(0,4).map(c=>`✕ ${esc(chName(c.id))}: ${fmtX(c.roas)} / ${nf0.format(targets[c.id]||8)}`).join('\n'):L('Semua channel di atas target ✓','All channels above target ✓'));
  }
  if(has('spend','biaya','anggaran','budget','cost','pacing')){
    const buds=chm.map(c=>({c,b:c.budget||0})).filter(x=>x.b>0);
    const totB=sum(buds.map(x=>x.b)),totS=sum(chm.map(c=>c.tot.cost));
    const over=buds.filter(x=>x.c.tot.cost/(x.b*x.c.last/mkDays(LATEST))>1.2).map(x=>x.c);
    const under=buds.filter(x=>x.c.last>=3&&x.c.tot.cost/(x.b*x.c.last/mkDays(LATEST))<0.6).map(x=>x.c);
    return `<b>Spend ${mkLabel(LATEST)} (MTD)</b>\n`+
      L(`Total ${fmtRpC(st.spend)} (penjualan ${fmtRpC(st.spendSales)} · branding ${fmtRpC(st.spendUpper)})\nAnggaran channel tercatat ${fmtRpC(totB)} · terpakai ${fmtRpC(totS)}\n`,
        `Total ${fmtRpC(st.spend)} (sales ${fmtRpC(st.spendSales)} · branding ${fmtRpC(st.spendUpper)})\nRecorded channel budgets ${fmtRpC(totB)} · used ${fmtRpC(totS)}\n`)+
      (over.length?'\n'+L('Di atas laju anggaran: ','Above budget pace: ')+over.map(c=>esc(chName(c.id))).join(', '):'')+
      (under.length?'\n'+L('Penyerapan lambat: ','Slow utilization: ')+under.map(c=>esc(chName(c.id))).join(', '):'')+
      '\n\n'+L('Anggaran per channel dapat diubah pada tab Platform (klik angka anggaran).','Channel budgets can be edited on the Platform tab (click the budget figure).');
  }
  if(has('bandingkan','compare','bulan lalu','last month','mom')){
    const pm=prevMonthKey(LATEST);
    const a=momStatsFor(pm,'all'),b=ovStats(isoOf(LATEST,1),LATEST_LAST_ISO(),'all');
    if(!a)return L('Data bulan sebelumnya tidak tersedia.','Previous month data is unavailable.');
    const row=(lbl,x,y,f)=>`• ${lbl}: ${f(y)} vs ${f(x)} (${x?((y-x)/Math.abs(x)>=0?'▲':'▼')+' '+nf1.format(Math.abs(100*(y-x)/Math.abs(x)))+'%':'–'})`;
    return `<b>${mkLabelS(LATEST)} (MTD) vs ${mkLabelS(pm)} (${L('bulan penuh','full month')})</b>\n`+
      row('Spend',a.spend,b.spend,fmtRpC)+'\n'+row('GMV',a.gmv,b.gmv,fmtRpC)+'\n'+
      row('ROAS',a.roas,b.roas,fmtX)+'\n'+row(L('Pesanan','Orders'),a.orders,b.orders,fmtN)+
      '\n\n'+L('Catatan: bulan berjalan belum selesai sehingga selisih wajar tampak besar.','Note: the current month is not finished, so gaps naturally look large.');
  }
  if(has('ctr','ctor','klik','click','impresi','impression','funnel','konversi','conversion')){
    return `<b>Funnel ${mkLabel(LATEST)} (MTD)</b>\n`+
      `${L('Impresi','Impressions')}: ${fmtNC(st.imp)}\n${L('Klik produk','Product clicks')}: ${fmtNC(st.clk)} (CTR ${fmtPct(st.ctr)})\n${L('Pesanan','Orders')}: ${fmtN(st.orders)} (CTOR ${fmtPct(st.ctor)})\nAOV: ${fmtRpC(st.aov)} · CPO: ${fmtRpC(st.cpo)}\n\n`+
      L('CTR rendah berarti materi iklan kurang menarik; CTOR rendah berarti halaman produk atau harga yang menahan konversi.','Low CTR means creatives are underperforming; low CTOR means the product page or pricing is holding back conversion.');
  }
  if(has('performa','ringkasan','summary','bulan ini','this month','bagaimana','gimana','how')){
    ALERTS=computeAlerts();
    const n=ALERTS.alerts.filter(a=>a.sev!=='info').length;
    const best=chm.filter(c=>c.roas!=null).sort((a,b)=>b.roas-a.roas)[0];
    const worst=chm.filter(c=>c.roas!=null&&c.tot.cost>500000).sort((a,b)=>a.roas-b.roas)[0];
    return `<b>${mkLabel(LATEST)} (MTD, ${L('hingga hari ke-','through day ')}${GLOBAL_LAST})</b>\n`+
      `Spend ${fmtRpC(st.spend)} · GMV ${fmtRpC(st.gmv)} · ROAS ${fmtX(st.roas)}\n${fmtN(st.orders)} ${L('pesanan','orders')} · CPO ${fmtRpC(st.cpo)} · AOV ${fmtRpC(st.aov)}\n\n`+
      (best?`${L('Terbaik','Best')}: <b>${esc(chName(best.id))}</b> (ROAS ${fmtX(best.roas)})\n`:'')+
      (worst?`${L('Perlu perhatian','Needs attention')}: <b>${esc(chName(worst.id))}</b> (ROAS ${fmtX(worst.roas)})\n`:'')+
      `\n${n?L(`Ada ${n} temuan aktif dan ${ALERTS.opps.length} peluang. Tanyakan "channel bermasalah" untuk detail.`,`There are ${n} active findings and ${ALERTS.opps.length} opportunities. Ask "which channels have issues" for detail.`):L('Tidak ada peringatan aktif ✓','No active warnings ✓')}`;
  }
  return L('Saya teman analisis Anda. Contoh yang bisa ditanyakan:\n• Tanggal berapa yang belum saya input?\n• Kenapa sales turun? (diagnosis penyebab)\n• Channel / produk / kreator mana yang turun atau naik?\n• Ringkasan TikTok / Shopee / Meta\n• ROAS di bawah target, peluang scale up, pacing anggaran\n• Bandingkan dengan bulan lalu',
    'I am your analysis companion. You can ask, for example:\n• Which dates have I not input yet?\n• Why did sales drop? (root-cause diagnosis)\n• Which channels / products / creators are up or down?\n• TikTok / Shopee / Meta summary\n• ROAS below target, scale up opportunities, budget pacing\n• Compare with last month');
}
async function chatAsk(q){
  q=String(q||'').trim();
  if(!q)return;
  chatPush('user',q);
  chatHist.push({role:'user',content:q});
  document.getElementById('chatIn').value='';
  const body=document.getElementById('chatBody');
  const tp=document.createElement('div');tp.className='msg bot typing';tp.innerHTML='<i></i><i></i><i></i>';
  body.appendChild(tp);body.scrollTop=body.scrollHeight;
  const t0=Date.now();
  let ans=null,viaAI=false;
  try{ans=await chatLLM(q);viaAI=ans!=null&&String(ans).trim()!=='';}catch(e){ans=null;}
  const wait=380-(Date.now()-t0);
  if(wait>0)await new Promise(r=>setTimeout(r,wait));
  tp.remove();
  if(!viaAI){
    ans=botReply(q);
    if(!chatAiAvailable()&&!chatNotified){
      chatNotified=true;
      ans+='\n\n'+L('Catatan: jawaban di atas dari mesin analisis lokal. Untuk jawaban AI yang memahami konteks bebas, buka dashboard sebagai file HTML lalu tekan ikon ⚙ di kepala chat dan masukkan kunci API Anthropic.','Note: the answer above comes from the local analysis engine. For AI answers with free-form context, open the dashboard as an HTML file, press the ⚙ icon in the chat header, and enter an Anthropic API key.');
    }
  }
  chatHist.push({role:'assistant',content:String(ans).replace(/<[^>]+>/g,'')});
  if(chatHist.length>20)chatHist=chatHist.slice(-20);
  chatPush('bot',viaAI?esc(ans):ans);
}

  };
  const mq=matchMedia('(prefers-color-scheme: dark)');
  const applyOs=()=>document.documentElement.dataset.osdark=mq.matches?'1':'0';
  applyOs();mq.addEventListener('change',applyOs);
  const saved=store.get(LS_TH,null);
  if(saved)document.documentElement.dataset.theme=saved;
  document.getElementById('themeBtn').onclick=()=>{
    const cur=document.documentElement.dataset.theme;
    const isDark=cur?cur==='dark':mq.matches;
    const next=isDark?'light':'dark';
    document.documentElement.dataset.theme=next;store.set(LS_TH,next);
    nav();
  };
  /* chatbot */
  document.getElementById('chatFab').onclick=()=>chatOpen(!document.getElementById('chatPanel').classList.contains('open'));
  document.getElementById('chatCfg').onclick=async()=>{
    if(window.claude&&window.claude.complete){
      uiToast(L('Mode AI sudah aktif melalui lingkungan artifact.','AI mode is already active through the artifact environment.'));return;
    }
    const v=await uiPrompt({title:L('Mode AI Chatbot','Chatbot AI Mode'),
      label:L('Tempel kunci API Anthropic (sk-ant-...) agar chatbot dijawab Claude dengan konteks data dashboard. Kunci hanya disimpan di browser ini dan dipakai langsung ke api.anthropic.com. Kosongkan lalu Simpan untuk menonaktifkan.','Paste an Anthropic API key (sk-ant-...) so the chatbot is answered by Claude with dashboard data context. The key is stored only in this browser and used directly against api.anthropic.com. Clear and Save to disable.'),
      value:store.get(LS_KEY,''),ok:L('Simpan','Save'),cancel:L('Batal','Cancel')});
    if(v===null)return;
    store.set(LS_KEY,v.trim());chatTexts();
    uiToast(v.trim()?L('Mode AI aktif.','AI mode enabled.'):L('Mode AI dimatikan; memakai mesin lokal.','AI mode disabled; using the local engine.'));
  };
  document.getElementById('chatClose').onclick=()=>chatOpen(false);
  document.getElementById('chatSend').onclick=()=>chatAsk(document.getElementById('chatIn').value);
  document.getElementById('chatIn').onkeydown=e=>{if(e.key==='Enter')chatAsk(e.target.value);};
  addEventListener('hashchange',nav);
  let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(nav,220);});
  document.body.addEventListener('click',e=>{
    const tr=e.target.closest('tr[data-nav]');if(tr)location.hash=tr.dataset.nav;
  });
  nav();
}
boot();
</script>

</body>
</html>
